name: Sync company production facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-sync-company-production-facts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize company page with confirmed equipment facts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/(public)/company/page.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  productionLeadTimeSummary,\n} from "@/data/manufacturing-facts";',
                  '  productionLeadTimeSummary,\n  productionEquipment,\n} from "@/data/manufacturing-facts";',
              ),
              (
                  '["4", "листогибочных комплекса"],',
                  '[`${productionEquipment.pressBrakes} + ${productionEquipment.panelBenders}`, "листогиба + панельгиб"],',
              ),
              (
                  '["Производство полного цикла", "Лазерная резка, гибка, сварочные посты, слесарный участок, три камеры порошковой окраски, контроль качества и упаковка объединены в едином процессе."],',
                  '["Производство полного цикла", `Лазерная резка, гибка, сварочные посты, слесарный участок, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, дробеструйная и лазерная очистка, контроль качества и упаковка объединены в едином процессе.`],',
              ),
              (
                  '["3 лазерных комплекса с ЧПУ", `Чёрная сталь ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола ${laserCuttingCapabilities.tableWorkingArea}.`],',
                  '[`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`, `Чёрная сталь ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола ${laserCuttingCapabilities.tableWorkingArea}.`],',
              ),
              (
                  '["4 листогибочных комплекса", "Гибка по чертежам с проверкой развёртки, инструмента, углов, полок и общей геометрии."],',
                  '[`${productionEquipment.pressBrakes} листогибочных комплекса`, "Гибка по чертежам с проверкой развёртки, инструмента, углов, полок и общей геометрии."],',
              ),
              (
                  '["Панельгиб", "Формообразование фасадных и корпусных деталей с контролем повторяемых размеров партии."],',
                  '[`${productionEquipment.panelBenders} панельгиб`, "Формообразование фасадных и корпусных деталей с контролем повторяемых размеров партии."],',
              ),
              (
                  '["3 камеры порошковой окраски", "Подготовка и нанесение полимерного покрытия по согласованным цвету, фактуре и требованиям к поверхности."],',
                  '[`${productionEquipment.powderCoatingBooths} камеры порошковой окраски`, "Подготовка и нанесение полимерного покрытия по согласованным цвету, фактуре и требованиям к поверхности."],',
              ),
              (
                  '["Камера дробеструйной очистки", "Подготавливаем поверхность металла перед нанесением покрытия: удаляем загрязнения и создаём равномерную шероховатость для надёжной адгезии."],',
                  '["Дробеструйная очистка", "Очищаем и подготавливаем поверхность по согласованной технологии с учётом материала, состояния изделия и следующей операции."],\n  ["Лазерная очистка", "Выполняем локальную очистку поверхности лазером там, где этот способ подходит материалу, загрязнению и дальнейшему технологическому маршруту."],',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one company-page phrase: {old[:100]} (found {count})')
              text = text.replace(old, new, 1)

          if '4 листогибочных комплекса' in text:
              raise SystemExit('Old press-brake count remains on company page')
          if 'Лазерная очистка' not in text or 'Дробеструйная очистка' not in text:
              raise SystemExit('Both surface-preparation capabilities must be present')

          path.write_text(text)
          PY

      - name: Commit synchronized company facts
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(public)/company/page.tsx'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: sync company page with production facts"
          git push origin HEAD:main
