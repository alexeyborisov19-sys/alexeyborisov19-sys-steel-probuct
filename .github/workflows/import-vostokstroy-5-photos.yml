name: Import VostokStroy 1st Vostochnaya 5 photos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-vostokstroy-5-photos.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download edited project photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/projects
          urls=(
            "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:87fbe9d4-a20a-4f7e-b251-d1c2a05cb826"
            "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:2f052f85-9c1f-4e6d-9ca1-b5228b87c628"
            "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:2cbf7745-e978-4114-a9ec-11b01a9cd519"
          )
          targets=(
            "public/images/projects/vostokstroy-vostochnaya-5-1.png"
            "public/images/projects/vostokstroy-vostochnaya-5-2.png"
            "public/images/projects/vostokstroy-vostochnaya-5-3.png"
          )
          for i in 0 1 2; do
            curl -L --fail --silent --show-error "${urls[$i]}" -o "${targets[$i]}"
            size="$(stat -c%s "${targets[$i]}")"
            test "$size" -gt 50000
            file "${targets[$i]}" | grep -qi 'PNG image data'
          done

      - name: Commit photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/vostokstroy-vostochnaya-5-*.png
          git commit -m "Add edited VostokStroy 1st Vostochnaya 5 photos"
          git push origin HEAD:main
