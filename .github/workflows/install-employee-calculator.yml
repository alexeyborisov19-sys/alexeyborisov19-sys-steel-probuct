name: Install reviewed employee calculator release
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA256 of the reviewed Windows installer
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: steelprodukt-production
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed installer from private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          mkdir -m 700 package
          gh release download employee-windows-0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'SteelProdukt-Employee-0.1.0-x64.exe' --dir package
          printf '%s  %s\n' "$EXPECTED_SHA" package/SteelProdukt-Employee-0.1.0-x64.exe | sha256sum --check
      - name: Prepare private settings and server access
        env:
          INITIAL_SETTINGS: ${{ secrets.STEEL_EMPLOYEE_INITIAL_SETTINGS }}
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$INITIAL_SETTINGS"
          umask 077
          printf '%s' "$INITIAL_SETTINGS" > package/settings.json
          python3 -c 'import json; v=json.load(open("package/settings.json")); assert set(v)=={"commercial","operations","metalMarketUpliftPct"}'
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
      - name: Install isolated files and enable employee activation
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          remote="/tmp/steel-employee-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "mkdir -m 700 '$remote'"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" package/* "$BEGET_USER@$BEGET_HOST:$remote/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' STAGE='$remote' EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf -- "$STAGE"' EXIT
          cd "$APP_PATH"
          test -f app/api/employee-app/activation/route.ts
          set -a
          . ./.env.production
          set +a
          test -f "$STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH"
          printf '%s  %s\n' "$EXPECTED_SHA" "$STAGE/SteelProdukt-Employee-0.1.0-x64.exe" | sha256sum --check
          export EMPLOYEE_ROOT=/var/lib/steelprodukt/employee-app
          install -d -m 700 -o nodejs -g nodejs "$EMPLOYEE_ROOT"
          install -m 600 -o nodejs -g nodejs "$STAGE/settings.json" "$EMPLOYEE_ROOT/settings.json"
          install -m 600 -o nodejs -g nodejs "$STAGE/SteelProdukt-Employee-0.1.0-x64.exe" "$EMPLOYEE_ROOT/SteelProdukt-Employee-0.1.0-x64.exe"
          python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['EMPLOYEE_ROOT']);name='SteelProdukt-Employee-0.1.0-x64.exe'
          (root/'release.json').write_text(json.dumps(dict(version='0.1.0',url='https://www.steelprodukt.ru/downloads/employee/'+name,bytes=(root/name).stat().st_size,sha256=os.environ['EXPECTED_SHA'])))
          env=pathlib.Path('.env.production');old=env.read_text();(root/'environment-before-install').write_text(old)
          values={'STEEL_EMPLOYEE_ACTIVATION_ENABLED':'true','STEEL_EMPLOYEE_REGISTRY_PATH':str(root/'registry.sqlite'),'STEEL_EMPLOYEE_BASIS_PATH':os.environ['STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH'],'STEEL_EMPLOYEE_SETTINGS_PATH':str(root/'settings.json'),'STEEL_EMPLOYEE_RELEASE_PATH':str(root/'release.json'),'STEEL_EMPLOYEE_INSTALLER_PATH':str(root/name)}
          lines=[line for line in old.splitlines() if line.split('=',1)[0] not in values]
          env.write_text('\n'.join(lines+[k+'='+v for k,v in values.items()])+'\n')
          PY
          chown nodejs:nodejs "$EMPLOYEE_ROOT/release.json"
          chmod 600 "$EMPLOYEE_ROOT/release.json" "$EMPLOYEE_ROOT/environment-before-install" .env.production
          sudo -iu nodejs bash -lc "cd '$APP_PATH' && pm2 restart ecosystem.config.cjs --env production --update-env"
          REMOTE
