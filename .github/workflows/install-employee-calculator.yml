name: Withdraw public employee installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
      - name: Disable public installer download
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('.env.production');lines=p.read_text().splitlines()
          p.write_text('\n'.join(x for x in lines if x.split('=',1)[0]!='STEEL_EMPLOYEE_INSTALLER_PATH')+'\nSTEEL_EMPLOYEE_INSTALLER_PATH=\n')
          PYTHON
          chmod 600 .env.production
          script=$(mktemp /tmp/steel-withdraw-XXXXXX)
          printf 'cd %q\npm2 restart ecosystem.config.cjs --env production --update-env\n' "$APP_PATH" > "$script"
          chmod 644 "$script"
          sudo -iu nodejs bash "$script"
          rm "$script"
          python3 - <<'NGINX'
          from pathlib import Path
          import re,subprocess
          changed=[]
          for link in Path('/etc/nginx/sites-enabled').glob('*'):
              p=link.resolve();text=p.read_text()
              if 'steelprodukt.ru' not in text or 'location ^~ /downloads/employee/' in text: continue
              updated,count=re.subn(r'(\s*location\s+/\s*\{)', '\n    location ^~ /downloads/employee/ { return 404; }\n'+r'\1', text)
              if not count: continue
              changed.append((p,text));p.write_text(updated)
          if not changed: raise RuntimeError('Download location not found; no configuration changed')
          test=subprocess.run(['nginx','-t'],capture_output=True)
          if test.returncode:
              for p,text in changed:p.write_text(text)
              raise RuntimeError('Nginx validation failed; original configuration restored')
          subprocess.run(['systemctl','reload','nginx'],check=True)
          print('Public employee downloads blocked at reverse proxy')
          NGINX
          REMOTE
