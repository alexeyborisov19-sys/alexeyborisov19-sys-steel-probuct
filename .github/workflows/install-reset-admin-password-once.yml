name: One-time PD admin password reset

on:
  push:
    paths:
      - '.github/workflows/install-reset-admin-password-once.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Reset admin password without exposing plaintext
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"

          PASSWORD="Aa7!$(openssl rand -hex 12)"
          export RESET_PASSWORD="$PASSWORD"

          NODE_ENV=production node --env-file="$ENV_FILE" --import tsx --input-type=module <<'NODE'
          import { hashPassword, passwordAlgorithm, passwordVersion, verifyPassword } from "./lib/pd-admin/auth/password.ts";
          import { hashAdministrativeFingerprint, revokeAllUserSessions } from "./lib/pd-admin/auth/session-store.ts";
          import { recordAccessEventInTransaction } from "./lib/pd-admin/audit/chain.ts";
          import { readPdAdminConfig } from "./lib/pd-admin/config.ts";
          import { closePdDatabase, openPdDatabase } from "./lib/pd-admin/db/database.ts";

          const password = process.env.RESET_PASSWORD || "";
          const config = readPdAdminConfig(process.env, { production: true, cwd: process.cwd() });
          if (!config.enabled || !config.sessionHashKey || !config.auditChainKey) throw new Error("PD admin is not safely enabled");

          const database = openPdDatabase({
            applyMigrations: false,
            databasePath: config.databasePath,
            environment: process.env,
          });

          try {
            const user = database.prepare("SELECT id, role, is_active FROM users WHERE username = 'admin'")
              .get();
            if (!user || Number(user.is_active) !== 1) throw new Error("Active admin account not found");

            const encoded = hashPassword(password);
            const now = new Date();
            const ipHash = hashAdministrativeFingerprint("server-generated-reset", config.sessionHashKey, "ip");

            database.exec("BEGIN IMMEDIATE");
            try {
              database.prepare(
                "UPDATE users SET password_hash = ?, password_algorithm = ?, password_version = ?, " +
                "must_change_password = 1, password_changed_at = ?, failed_login_count = 0, " +
                "locked_until = NULL, updated_at = ? WHERE id = ?"
              ).run(
                encoded,
                passwordAlgorithm,
                passwordVersion,
                now.toISOString(),
                now.toISOString(),
                user.id,
              );

              revokeAllUserSessions(database, user.id, "PASSWORD_RESET_SERVER_GENERATED", now);

              recordAccessEventInTransaction(database, {
                occurredAt: now.toISOString(),
                userId: user.id,
                action: "USER_PASSWORD_RESET",
                targetType: "USER",
                targetId: user.id,
                legalBasis: "ADMINISTRATIVE_ACCESS_CONTROL",
                result: "SUCCESS",
                ipHash,
                metadata: {
                  role: String(user.role),
                  code: "MUST_CHANGE_PASSWORD",
                  method: "SERVER_GENERATED_ONE_TIME",
                },
              }, config.auditChainKey);

              database.exec("COMMIT");
            } catch (error) {
              database.exec("ROLLBACK");
              throw error;
            }

            const check = database.prepare("SELECT password_hash, must_change_password FROM users WHERE id = ?")
              .get(user.id);
            if (!check || Number(check.must_change_password) !== 1 || !verifyPassword(password, String(check.password_hash))) {
              throw new Error("Password reset verification failed");
            }
            console.log("PASSWORD_RESET_VERIFIED=true");
          } finally {
            closePdDatabase(database, config.databasePath);
          }
          NODE

          cat > /tmp/pdreset-public.pem <<'PUBKEY'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1r7sR1BUDuCTVdJAJaWE
yENFGUudLovhWFTrsPR+XyABkF3NzjBk7Lgj20CeoW58EkWic0kFstkmVsrGvh0G
v7SdN9I/bR6q1QJEfKl6zLqp/IsxT7XECiDb9MowVYQJwN6VCgN7Dy2JZUZ9MaFU
cEwAxcy8QvxKey1j+aGtl18N3o86nZSFU1xyFK7EIyPFZ6m91qK0tcaLPg6F/F3W
q6FUbprffVjCCO9ifW5SoWqCRT0d+zsTn3b4paT8cYwIbMU/b4qTQv5oCeTG9uMw
PF/PGh8pBf5PMc+5lDrJkXyAKHz+akWnEsUWMXwfRTNbqEkADs7qgQff91f6Bag4
KwIDAQAB
-----END PUBLIC KEY-----
PUBKEY

          CIPHERTEXT="$(printf '%s' "$PASSWORD" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pdreset-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          unset RESET_PASSWORD PASSWORD
          rm -f /tmp/pdreset-public.pem
          echo "TEMP_PASSWORD_CIPHERTEXT=$CIPHERTEXT"
          REMOTE
