name: Apply production KPI copy wave13

on:
  push:
    branches:
      - fix/production-copy-wave13

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-copy-wave13
          fetch-depth: 1
      - name: Apply production KPI copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/(public)/production/page.tsx')
          text = page.read_text(encoding='utf-8')

          replacements = [
              ('className="container grid gap-4 sm:grid-cols-2 lg:grid-cols-5"', 'className="container grid gap-4 sm:grid-cols-2 lg:grid-cols-4"'),
              ('            ["Давальческое", "сырьё после входного контроля"],\n', ''),
              ('            ["По КД", "от единичной детали до серии"],', '            ["По КД / ТЗ", "от единичной детали до серии"],'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')

          test_file = Path('tests/production-kpi-copy.test.ts')
          test_file.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst productionPage = new URL("../app/(public)/production/page.tsx", import.meta.url);\n\ntest("production KPI strip keeps only strong client-facing proof points", async () => {\n  const source = await readFile(productionPage, "utf8");\n\n  assert.match(source, /lg:grid-cols-4/);\n  assert.match(source, /\["По КД \/ ТЗ", "от единичной детали до серии"\]/);\n  assert.doesNotMatch(source, /\["Давальческое", "сырьё после входного контроля"\]/);\n});\n''', encoding='utf-8')
          PY
      - name: Commit applied copy
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/production/page.tsx' tests/production-kpi-copy.test.ts
          git commit -m "copy: simplify production KPI strip"
          git push origin HEAD:fix/production-copy-wave13
