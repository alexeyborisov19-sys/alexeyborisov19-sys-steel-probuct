name: Apply approved production copy

on:
  push:
    branches: [fix/production-copy-wave13]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-copy-wave13
          sparse-checkout: |
            /*
            !/.agents/
            !/.codex/
            !/.claude/
            !/.claude-flow/
          sparse-checkout-cone-mode: false
      - name: Apply approved copy
        run: python scripts/apply-production-copy-wave13.py
      - name: Commit approved production page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(public)/production/page.tsx' tests/production-page-positioning.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: apply approved production page copy'
          git push origin HEAD:fix/production-copy-wave13
