name: Install UI UX Pro Max for Codex

on:
  push:
    paths:
      - '.github/workflows/install-uiux-pro-max.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI UX Pro Max skill for Codex
        run: npx --yes ui-ux-pro-max-cli@2.15.0 init --ai codex

      - name: Commit installed skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/ui-ux-pro-max
          if git diff --cached --quiet; then
            echo "UI UX Pro Max already installed; nothing to commit."
            exit 0
          fi
          git commit -m "chore: install UI UX Pro Max Codex skill"
          git push
