name: Verify published PR210
on:
  push:
    branches: [diagnostic/public-release-proof-20260930]
    paths: [.github/workflows/release-210-proof.yml]
permissions:
  contents: read
concurrency:
  group: public-release-210-proof
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
      SEO_AUDIT_BASE_URL: https://www.steelprodukt.ru
    steps:
      - name: Read verification source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: diagnostic
      - name: Require the reviewed PR to be merged
        id: release
        run: |
          python3 - <<'PY'
          import json,os,re,time,urllib.request
          url='https://api.github.com/repos/alexeyborisov19-sys/alexeyborisov19-sys-steel-probuct/pulls/210'
          for attempt in range(30):
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SteelProdukt-release210-proof'})
              with urllib.request.urlopen(req,timeout=20) as r: pr=json.load(r)
              assert pr['head']['sha']=='1ced992933288e87fca3612a595b71499842292f', 'Reviewed head changed'
              if pr.get('merged'):
                  sha=pr['merge_commit_sha']
                  assert re.fullmatch('[0-9a-f]{40}',sha)
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('sha='+sha+'\n')
                  print('MERGED_RELEASE',sha)
                  break
              if pr['state']=='closed': raise RuntimeError('PR closed without merge')
              time.sleep(20)
          else: raise RuntimeError('PR not merged; public checks not started')
          PY
      - name: Read immutable published source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install verification dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Install browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Require successful publication of this exact source
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['RELEASE_SHA']
          url='https://api.github.com/repos/alexeyborisov19-sys/alexeyborisov19-sys-steel-probuct/actions/runs?head_sha='+sha+'&per_page=20'
          for attempt in range(30):
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SteelProdukt-release210-proof'})
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              runs=[r for r in data['workflow_runs'] if r['path']=='.github/workflows/deploy-beget.yml' and r['head_sha']==sha and r['event']=='push']
              if runs and runs[0]['status']=='completed':
                  assert runs[0]['conclusion']=='success', 'Publication failed'
                  print('DEPLOYMENT_VERIFIED',runs[0]['id'],sha,runs[0]['conclusion'])
                  break
              time.sleep(20)
          else: raise RuntimeError('Publication not confirmed; public checks not started')
          PY
      - name: Production SEO and redirects
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p output/release-210
          npm run seo:audit | tee output/release-210/seo.log
      - name: Production browser audit with intercepted form submissions
        working-directory: site
        run: |
          set -euo pipefail
          npm run browser:audit | tee output/release-210/browser.log
      - name: Screenshots, advertising parameters and rejected multipart request
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          cp ../diagnostic/.github/diagnostics/release-210-check.mjs .github/diagnostics/release-210-check.mjs
          node .github/diagnostics/release-210-check.mjs | tee output/release-210/proof.log
      - name: Store public verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-pr210-proof
          path: |
            site/output/release-210/
            site/output/browser-audit/
          if-no-files-found: warn
          retention-days: 14
