name: Finalize confirmed production copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-production-copy-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Finalize production copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))

          company = 'app/(public)/company/page.tsx'
          replace(
              company,
              '["Производство полного цикла", `Лазерная резка, гибка, сварочные посты, слесарный участок, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, дробеструйная и лазерная очистка, контроль качества и упаковка объединены в едином процессе.`],',
              '["Производство полного цикла", `Инженерно-конструкторский центр, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса, ${productionEquipment.panelBenders} панельгиб, ${productionEquipment.weldingStations} сварочных поста, слесарно-доводочные операции, сборочное производство, дробеструйная и лазерная очистка, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектация и упаковка объединены в едином маршруте.`],',
          )
          replace(
              company,
              '{ question: "Какие операции выполняются на собственной площадке?", answer: "Производственный маршрут включает инженерную подготовку, лазерную резку, гибку на ЧПУ, сварочные и слесарные операции, порошковую окраску, контроль качества и упаковку." },',
              '{ question: "Какие операции выполняются на собственной площадке?", answer: `Производственный маршрут включает инженерно-конструкторскую подготовку, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса и ${productionEquipment.panelBenders} панельгиб, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, дробеструйную и лазерную очистку, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектацию и упаковку.` },',
          )

          home = 'app/(public)/page.tsx'
          replace(
              home,
              '{ question: "Выполняете полный цикл производства?", answer: "Да. В единый маршрут могут входить инженерная подготовка, лазерный раскрой, гибка на ЧПУ, сварка и сборка, порошковая окраска, контроль, упаковка и отгрузка." },',
              '{ question: "Выполняете полный цикл производства?", answer: `Да. В единый маршрут могут входить инженерно-конструкторская подготовка, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса и ${productionEquipment.panelBenders} панельгиб, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, дробеструйная и лазерная очистка, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектация, упаковка и отгрузка.` },',
          )
          replace(home, '["Система", "контроля качества"],', '[`${productionEquipment.weldingStations}`, "сварочных поста"],\n              [`${productionEquipment.powderCoatingBooths}`, "камеры порошковой окраски"],')
          replace(home, 'lg:grid-cols-[1.35fr_repeat(5,1fr)]', 'lg:grid-cols-[1.35fr_repeat(6,1fr)]')
          replace(home, '["Проектирование", "design.jpg"]', '["Инженерно-конструкторская подготовка", "design.jpg"]')

          checks = {
              company: [
                  'Инженерно-конструкторский центр',
                  'productionEquipment.weldingStations',
                  'productionEquipment.powderCoatingBooths',
                  'Сборочное производство',
                  'Комплектация и упаковка',
              ],
              home: [
                  'Инженерно-конструкторская подготовка',
                  'productionEquipment.weldingStations',
                  'productionEquipment.powderCoatingBooths',
              ],
          }
          for path, phrases in checks.items():
              text = Path(path).read_text()
              missing = [x for x in phrases if x not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')
          PY

      - name: Commit finalized production copy
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/'(public)'/company/page.tsx app/'(public)'/page.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "facts: finalize production chain copy"
          git push origin HEAD:main
