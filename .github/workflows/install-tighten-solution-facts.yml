name: Tighten solution engineering claims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-tighten-solution-facts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qualify load and safety claims
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data/solution-details.ts')
          text = path.read_text()

          replacements = [
              (
                  'Подбираем решение под конкретный фасад, габарит оборудования и способ крепления. В результате наружные блоки размещаются безопасно, обслуживаются без лишнего демонтажа и выглядят как часть архитектуры здания, а не как случайно добавленное оборудование.',
                  'Подбираем исполнение под конкретный фасад, габарит оборудования и способ крепления. Рабочие нагрузки, узлы крепления и сервисные зазоры принимаем по проектным данным и документации оборудования; внешний вид согласуем с архитектурой объекта.'
              ),
              (
                  'Конструкцию и перфорацию подбираем так, чтобы не перекрывать рабочие зоны оборудования.',
                  'Схему перфорации и открытые зоны согласуем с требованиями документации оборудования к вентиляции и сервисному доступу.'
              ),
              (
                  'Несущие элементы для установки блока, корзины или экрана. Подбираются по массе оборудования, типу основания и монтажной отметке.',
                  'Несущие элементы для установки блока, корзины или экрана. Сечения и узлы крепления задаются по КД с учётом расчётных данных проекта, типа основания и монтажной отметки.'
              ),
              (
                  'Проверяем габариты, нагрузку, фасад и доступ для монтажа.',
                  'Проверяем габариты, проектные данные о нагрузках, фасад и доступ для монтажа.'
              ),
              (
                  'Защищают персонал и оборудование от контакта с движущимися, нагревающимися или загрязняющими узлами, сохраняя доступ для осмотра и обслуживания.',
                  'Ограничивают доступ к движущимся, нагревающимся или загрязняющим узлам и сохраняют предусмотренный КД доступ для осмотра и обслуживания.'
              ),
              (
                  'Несущая база для оборудования, шкафов, панелей и модульных узлов. Сечения и точки крепления подбираем под нагрузку и способ сборки.',
                  'Несущая база для оборудования, шкафов, панелей и модульных узлов. Сечения и точки крепления принимаются по КД и расчётным данным проекта; способ сборки согласуется до запуска.'
              ),
              (
                  'Организуют безопасную и аккуратную прокладку кабеля внутри оборудования, на производственных участках и в технических помещениях.',
                  'Организуют прокладку кабеля внутри оборудования, на производственных участках и в технических помещениях по предусмотренной проектом трассе.'
              ),
              (
                  'Рабочие площадки, переходы, защитные борта и ограждения для безопасного доступа к оборудованию и технологическим зонам.',
                  'Рабочие площадки, переходы, защитные борта и ограждения для организации доступа к оборудованию и технологическим зонам. Расчётные нагрузки и параметры ограждений задаются проектной документацией.'
              ),
              (
                  'Производим не сами инженерные коммуникации, а изделия, которые помогают их безопасно разместить, закрепить, обслуживать и защитить. Подбираем конструкцию под трассу, массу оборудования, основание, доступ для сервиса и особенности кровли или фасада.',
                  'Производим не сами инженерные коммуникации, а изделия для их размещения, крепления, обслуживания и защиты. Конструкцию изготавливаем по исходным данным о трассе, массе оборудования, основании, сервисном доступе и особенностях кровли или фасада; расчётные нагрузки и узлы крепления задаются проектом.'
              ),
              (
                  'Производим и поставляем согласованный комплект: кронштейны, рамы, опоры, направляющие и крепёж — с учётом нагрузки, основания и проектной схемы.',
                  'Производим и поставляем согласованный комплект: кронштейны, рамы, опоры, направляющие и крепёж — по проектной схеме, КД и данным о нагрузках и основании.'
              ),
              (
                  'Учитываем основание, ветровую нагрузку, водоотведение и совместимость с кровельным пирогом.',
                  'Исходные требования к основанию, ветровой нагрузке, водоотведению и совместимости с кровельным пирогом принимаем из проектной документации.'
              ),
              (
                  'Опорные элементы для коммуникаций, блоков, лотков и инженерного оборудования. Изготавливаются под нагрузку и основание.',
                  'Опорные элементы для коммуникаций, блоков, лотков и инженерного оборудования. Изготавливаются по КД; расчётная нагрузка, основание и узлы крепления задаются проектом.'
              ),
              (
                  'Основания и опоры, которые передают нагрузку от оборудования на несущую конструкцию с понятной схемой крепления.',
                  'Основания и опоры для установки оборудования на несущую конструкцию. Схема передачи нагрузок и крепления принимается по проекту.'
              ),
              (
                  'Определяем опоры, кронштейны, рамы, защитные элементы и крепеж.',
                  'Формируем состав опор, кронштейнов, рам, защитных элементов и крепежа по проектным исходным данным.'
              ),
              (
                  'Выполняем гибку и сборку, чтобы обеспечить точную посадку элементов в узле.',
                  'Выполняем гибку и сборку по согласованным размерам и узлам КД.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one engineering claim, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          forbidden = [
              'размещаются безопасно',
              'Организуют безопасную',
              'для безопасного доступа',
              'подбираем под нагрузку',
              'Изготавливаются под нагрузку',
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'Unsafe absolute claim remains: {phrase}')

          path.write_text(text)
          PY

      - name: Commit qualified technical copy
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'data/solution-details.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: qualify project-dependent engineering claims"
          git push origin HEAD:main
