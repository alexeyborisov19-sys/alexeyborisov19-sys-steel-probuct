name: Test production quote delivery

on:
  push:
    paths:
      - '.github/workflows/install-test-quote-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit technical test quote
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H 'Origin: https://www.steelprodukt.ru' \
              -H 'Referer: https://www.steelprodukt.ru/contacts' \
              -F 'name=Технический тест SMTP' \
              -F 'email=info@steelprodukt.ru' \
              -F "message=Автоматическая проверка доставки формы. Run ${GITHUB_RUN_ID}." \
              -F 'personalDataConsent=yes' \
              -F "consentTimestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -F 'pageUrl=https://www.steelprodukt.ru/contacts' \
              https://www.steelprodukt.ru/api/quote
          )"
          cat "$RESPONSE_FILE"
          echo
          echo "HTTP_CODE=$HTTP_CODE"
          test "$HTTP_CODE" = "200"
          grep -q '"code":"ACCEPTED"' "$RESPONSE_FILE"
