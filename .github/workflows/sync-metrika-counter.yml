name: Sync Yandex Metrica counter

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-metrika-counter.yml'

permissions:
  contents: read

jobs:
  sync:
    name: Set production Metrica counter
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Update production environment
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"

          if grep -q '^NEXT_PUBLIC_YM_COUNTER_ID=' "$ENV_FILE"; then
            sed -i 's/^NEXT_PUBLIC_YM_COUNTER_ID=.*/NEXT_PUBLIC_YM_COUNTER_ID=112542227/' "$ENV_FILE"
          else
            printf '\nNEXT_PUBLIC_YM_COUNTER_ID=112542227\n' >> "$ENV_FILE"
          fi

          ACTUAL="$(sed -n 's/^NEXT_PUBLIC_YM_COUNTER_ID=//p' "$ENV_FILE" | head -n 1 | tr -d '\r\"\047')"
          test "$ACTUAL" = "112542227"
          echo "Production Yandex Metrica counter is $ACTUAL."
          REMOTE
