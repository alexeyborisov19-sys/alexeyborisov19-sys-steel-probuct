name: Apply complete image layout fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Replace corrected image layouts
        shell: bash
        run: |
          printf '%s' '' | base64 -d > 'app/globals.css'
          printf '%s' '' | base64 -d > 'app/page.tsx'
          printf '%s' '' | base64 -d > 'app/solutions/page.tsx'
          printf '%s' '' | base64 -d > 'app/industries/page.tsx'
          printf '%s' '' | base64 -d > 'app/production/page.tsx'
          printf '%s' '' | base64 -d > 'app/projects/page.tsx'
          printf '%s' '' | base64 -d > 'components/MegaMenu.tsx'
          printf '%s' '' | base64 -d > 'components/SolutionItemVisual.tsx'
          printf '%s' '' | base64 -d > 'components/ProductionCycle.tsx'

      - name: Commit corrected layout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/globals.css' 'app/page.tsx' 'app/solutions/page.tsx' 'app/industries/page.tsx' 'app/production/page.tsx' 'app/projects/page.tsx' 'components/MegaMenu.tsx' 'components/SolutionItemVisual.tsx' 'components/ProductionCycle.tsx'
          git rm --ignore-unmatch '.github/workflows/fix-image-layout.yml'
          git commit -m 'Fix complete image display across the site'
          git push
