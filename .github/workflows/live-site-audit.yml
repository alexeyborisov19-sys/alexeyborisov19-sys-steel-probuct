name: Live site audit

# Read-only probe of the published site, run from a GitHub runner because it can
# reach the public internet directly. Answers two questions: is the site served
# from Russia, and are its indexing signals intact. Writes nothing and needs no
# secrets — it only fetches public URLs.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-site-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the host and locate the server
        shell: bash
        run: |
          set +e
          set -o pipefail
          HOST=www.steelprodukt.ru
          APEX=steelprodukt.ru
          echo "=============== ЛОКАЦИЯ ==============="
          for h in "$APEX" "$HOST"; do
            echo "--- $h ---"
            dig +short "$h" A | sed 's/^/  A: /'
          done
          IP="$(dig +short "$HOST" A | head -1)"
          echo
          echo "IP: ${IP:-не разрешился}"
          if [ -n "$IP" ]; then
            # RIPEstat is a public, key-less registry lookup: country of the
            # allocation and the announcing network.
            curl -fsS --max-time 20 "https://stat.ripe.net/data/prefix-overview/data.json?resource=$IP" \
              | jq -r '"  префикс: \(.data.resource // "?")",
                       "  сеть:    " + ((.data.asns // []) | map("AS\(.asn) \(.holder)") | join(", "))' \
              || echo "  RIPEstat недоступен"
            # Country of the address allocation, straight from the registry stats.
            curl -fsS --max-time 20 "https://stat.ripe.net/data/rir-stats-country/data.json?resource=$IP" \
              | jq -r '"  страна по реестру: " + ((.data.located_resources // []) | map(.location) | join(", "))' \
              || echo "  страна по реестру: недоступно"
            curl -fsS --max-time 20 "https://stat.ripe.net/data/geoloc/data.json?resource=$IP" \
              | jq -r '.data.locations[]? | "  гео: \(.country) \(.city // "")"' || true
          fi

      - name: Transport, canonical host and redirects
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo "=============== ТРАНСПОРТ И РЕДИРЕКТЫ ==============="
          probe() {
            printf '  %-46s ' "$1"
            curl -sS -o /dev/null --max-time 25 \
              -w 'HTTP %{http_code}  ->  %{redirect_url}\n' "$1" || echo "ОШИБКА"
          }
          probe "http://steelprodukt.ru/"
          probe "http://www.steelprodukt.ru/"
          probe "https://steelprodukt.ru/"
          probe "https://www.steelprodukt.ru/"
          echo
          echo "--- сертификат ---"
          echo | openssl s_client -servername www.steelprodukt.ru -connect www.steelprodukt.ru:443 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null | sed 's/^/  /' || echo "  не удалось прочитать"

      - name: Indexing signals
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          echo "=============== ИНДЕКСАЦИЯ ==============="
          echo "--- robots.txt ---"
          curl -fsS --max-time 25 "$BASE/robots.txt" | sed 's/^/  /' || echo "  НЕДОСТУПЕН"
          echo
          echo "--- sitemap.xml ---"
          SM="$(curl -fsS --max-time 30 "$BASE/sitemap.xml" || true)"
          if [ -n "$SM" ]; then
            echo "  URL всего:              $(printf '%s' "$SM" | grep -c '<loc>')"
            echo "  на https://www:         $(printf '%s' "$SM" | grep -c '<loc>https://www\.steelprodukt\.ru')"
            echo "  вне канонического хоста: $(printf '%s' "$SM" | grep '<loc>' | grep -vc 'https://www\.steelprodukt\.ru')"
          else
            echo "  НЕДОСТУПЕН"
          fi
          echo
          echo "--- IndexNow ключ ---"
          printf '  '; curl -sS -o /dev/null --max-time 20 -w 'HTTP %{http_code}\n' "$BASE/indexnow-key.txt"
          echo
          echo "--- заголовки главной ---"
          curl -sSI --max-time 25 "$BASE/" | grep -iE '^(HTTP/|content-type|cache-control|x-robots-tag|x-cache-status|content-security-policy|strict-transport)' | sed 's/^/  /'

      - name: Page-level SEO on key URLs
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          echo "=============== СТРАНИЦЫ ==============="
          for p in / /products /production /contacts /articles /projects /solutions /company /industries; do
            HTML="$(curl -fsS --max-time 30 "$BASE$p" || true)"
            CODE="$(curl -sS -o /dev/null --max-time 25 -w '%{http_code}' "$BASE$p")"
            if [ -z "$HTML" ]; then echo "  $CODE  $p  — тело не получено"; continue; fi
            TITLE="$(printf '%s' "$HTML" | grep -o '<title>[^<]*</title>' | head -1 | sed 's/<[^>]*>//g' | cut -c1-58)"
            CANON="$(printf '%s' "$HTML" | grep -o 'rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')"
            ROBOTS="$(printf '%s' "$HTML" | grep -o '<meta name="robots" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"$//')"
            DESCLEN="$(printf '%s' "$HTML" | grep -o '<meta name="description" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"$//' | wc -c)"
            LANG="$(printf '%s' "$HTML" | grep -o '<html lang="[^"]*"' | head -1 | sed 's/.*lang="//;s/"$//')"
            BANNER="$(printf '%s' "$HTML" | grep -c 'data-site-status="test-mode"' || true)"
            echo "  $CODE  $p"
            echo "        title:     $TITLE"
            echo "        canonical: ${CANON:-НЕТ}"
            echo "        robots:    ${ROBOTS:-нет тега}   lang: ${LANG:-?}   description: ${DESCLEN} симв.   плашка: $BANNER"
          done

      - name: Russian-market and legacy signals
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          echo "=============== РУНЕТ-СИГНАЛЫ ==============="
          HTML="$(curl -fsS --max-time 30 "$BASE/" || true)"
          echo "  yandex-verification: $(printf '%s' "$HTML" | grep -c 'name="yandex-verification"') шт."
          echo "  google-site-verification: $(printf '%s' "$HTML" | grep -c 'name="google-site-verification"') шт."
          echo "  Метрика (mc.yandex.ru):   $(printf '%s' "$HTML" | grep -c 'mc\.yandex\.ru')"
          echo "  og:locale:                $(printf '%s' "$HTML" | grep -o 'property="og:locale" content="[^"]*"' | sed 's/.*content="//;s/"$//')"
          echo "  addressCountry в разметке: $(printf '%s' "$HTML" | grep -o '"addressCountry":"[^"]*"' | head -1)"
          echo "  addressLocality:           $(printf '%s' "$HTML" | grep -o '"addressLocality":"[^"]*"' | head -1)"
          echo "  telephone:                 $(printf '%s' "$HTML" | grep -o '"telephone":"[^"]*"' | head -1)"
          echo
          echo "--- страницы старого сайта (должны быть 301/410) ---"
          for p in /galery /lityo-stali-foto /chugunnoe-lityo /opisanieprodukcii /vozmozhnosti /vnutri; do
            printf '  %-24s ' "$p"
            curl -sS -o /dev/null --max-time 25 -w 'HTTP %{http_code}  ->  %{redirect_url}\n' "$BASE$p"
          done

      # The compliance register in LEGAL_COMPLIANCE_RU.md lists these as items to
      # verify from outside the server, and names an external curl as the
      # evidence it wants. Read-only: nothing is sent, only status codes read.
      - name: Compliance checks the register asks for
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          IP="$(dig +short www.steelprodukt.ru A | head -1)"
          echo "=============== ПЕРИМЕТР ==============="
          echo "--- Node.js на порту 3000 должен быть закрыт снаружи ---"
          printf '  %s:3000 -> ' "$IP"
          if curl -sS -o /dev/null --max-time 8 "http://$IP:3000/robots.txt"; then
            echo "ОТВЕЧАЕТ — порт открыт наружу, блокер из регистра НЕ закрыт"
          else
            echo "не отвечает (соединение не установлено) — как и требует регистр"
          fi

          echo "--- контур персональных данных должен отдавать 404 ---"
          for p in /internal/personal-data /internal/personal-data/login /api/internal/personal-data; do
            printf '  %-40s ' "$p"
            curl -sS -o /dev/null --max-time 20 -w 'HTTP %{http_code}\n' "$BASE$p"
          done

          echo "--- заголовки контура ПД ---"
          curl -sSI --max-time 20 "$BASE/internal/personal-data" \
            | grep -iE '^(HTTP/|cache-control|x-robots-tag|referrer-policy|x-frame-options)' | sed 's/^/  /'

          echo "--- /api/ должен быть закрыт от индексации ---"
          printf '  X-Robots-Tag на /api/quote-request: '
          curl -sSI --max-time 20 "$BASE/api/quote-request" | grep -i 'x-robots-tag' | sed 's/^ *//' || echo "нет заголовка"

          echo
          echo "=============== ОПУБЛИКОВАННЫЕ ДОКУМЕНТЫ ==============="
          for p in /legal/privacy /legal/personal-data-consent /legal/marketing-consent /legal/cookies /legal/services /legal/terms /legal/requisites; do
            printf '  %-34s ' "$p"
            curl -sS -o /dev/null --max-time 20 -w 'HTTP %{http_code}\n' "$BASE$p"
          done

          echo
          echo "--- версия и дата в политике, как их видит посетитель ---"
          curl -fsS --max-time 20 "$BASE/legal/privacy" \
            | grep -oE 'Реда[^<]{0,80}|Версия[^<]{0,60}' | head -3 | sed 's/^/  /'

      # A third-party 152-ФЗ scanner reported that a form links only to the
      # privacy policy, which since 01.09.2025 (ФЗ-156 of 24.06.2025, art. 9)
      # is a violation on its own: the consent has to be a separate document.
      # This dumps what a crawler actually receives, so the claim is checkable.
      - name: Consent links a crawler sees in the forms
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          echo "=============== СОГЛАСИЯ В ФОРМАХ ==============="
          for p in /contacts / /products /production; do
            HTML="$(curl -fsS --max-time 30 "$BASE$p" || true)"
            [ -z "$HTML" ] && { echo "  $p — тело не получено"; continue; }
            echo "  --- $p ---"
            echo "    <form>:                       $(printf '%s' "$HTML" | grep -o '<form' | wc -l)"
            echo "    checkbox personalDataConsent: $(printf '%s' "$HTML" | grep -o 'name="personalDataConsent"' | wc -l)"
            # React does not preserve JSX attribute order, so match the whole tag
            # rather than assuming required follows name.
            echo "    required у него:              $(printf '%s' "$HTML" | grep -o '<input[^>]*personalDataConsent[^>]*>' | grep -c 'required')"
            echo "    ссылка /legal/privacy:                $(printf '%s' "$HTML" | grep -o '/legal/privacy' | wc -l)"
            echo "    ссылка /legal/personal-data-consent:  $(printf '%s' "$HTML" | grep -o '/legal/personal-data-consent' | wc -l)"
            echo "    ссылка /legal/marketing-consent:      $(printf '%s' "$HTML" | grep -o '/legal/marketing-consent' | wc -l)"
          done

      # A third-party crawler reported ~95 words on an article the local build
      # renders with ~1000, and a similar gap on the homepage. Either the live
      # server truncates the body, or that crawler counts differently. This
      # measures what the server actually returns, with the same rule used on
      # the build: text inside <main>, scripts and tags stripped.
      - name: How much text the server actually returns
        shell: bash
        run: |
          set +e
          set -o pipefail
          BASE=https://www.steelprodukt.ru
          cat > /tmp/count.py <<'PY'
          import re, sys
          h = sys.stdin.read()
          raw = len(h)
          h = re.sub(r'<script\b.*?</script>', ' ', h, flags=re.S | re.I)
          h = re.sub(r'<style\b.*?</style>', ' ', h, flags=re.S | re.I)
          m = re.search(r'<main\b.*?</main>', h, flags=re.S | re.I)
          scope = 'main' if m else 'body'
          h = m.group(0) if m else h
          h = re.sub(r'<[^>]{0,400}?>', ' ', h, flags=re.S)
          words = [t for t in h.split()
                   if re.fullmatch(r"[А-Яа-яЁёA-Za-z][А-Яа-яЁёA-Za-z\-']*", t)]
          print(f"{raw} {len(words)} {scope}")
          PY

          echo "=============== ОБЪЁМ ОТВЕТА ==============="
          printf '  %-52s %10s %8s %6s\n' URL байт слов область
          for p in /articles/avtomatizaciya-gibki-claas-2026 \
                   /articles/trumpf-mate-instrument-dlya-listovogo-metalla-2026 \
                   /articles/china-tech /articles / /products /projects; do
            OUT="$(curl -fsS --max-time 40 "$BASE$p" | python3 /tmp/count.py)" || OUT="— — —"
            printf '  %-52s %10s %8s %6s\n' "$p" $OUT
          done

          echo
          echo "--- та же статья глазами роботов ---"
          A=/articles/avtomatizaciya-gibki-claas-2026
          for UA in "Mozilla/5.0" \
                    "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
                    "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)"; do
            OUT="$(curl -fsS --max-time 40 -A "$UA" "$BASE$A" | python3 /tmp/count.py)" || OUT="— — —"
            printf '  %-46s байт %s слов %s (%s)\n' "$(printf '%s' "$UA" | cut -c1-44)" $OUT
          done

          echo
          echo "--- как отдаётся: длина, кодировка, кэш ---"
          curl -sSI --max-time 30 "$BASE$A" \
            | grep -iE '^(HTTP/|content-length|transfer-encoding|content-encoding|x-cache-status|vary)' \
            | sed 's/^/  /'
          echo "  --- обход кэша (?_cb) ---"
          curl -sSI --max-time 30 "$BASE$A?_cb=$RANDOM" \
            | grep -iE '^(HTTP/|content-length|x-cache-status)' | sed 's/^/  /'
