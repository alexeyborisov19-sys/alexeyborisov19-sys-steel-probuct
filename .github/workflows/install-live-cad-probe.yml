name: Live CAD preview probe

# Checks the production CAD preview against the files customers actually send.
#
# It reads only. Nothing is written, nothing is quoted, no order is created —
# the endpoint returns display geometry and a review state, and that is all this
# probe looks at.
#
# The DXF case is the one that matters: the drawing carries a byte-order mark,
# a 999 comment naming the exporter and no $INSUNITS at all, because that is how
# LibreCAD, SolidWorks and Inkscape write the files that were being turned away.

# Run by hand, after a deploy. It used to re-run itself whenever this file
# changed, which is the wrong order for a probe that checks production: a case
# added here is written against the build that is about to ship, not the one
# currently serving. The arc case below made that concrete — against a server
# without the fix it does not time out, it pins a core for good, which is the
# very bug it checks for.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the probe files
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { OcctKernel } from 'occt-wasm';

          // A drawing shaped like the exports that were refused: byte-order
          // mark, a 999 comment, no $INSUNITS, and annotation sitting in the
          // ENTITIES section beside the part.
          const drawing = [
            '999', 'Exported by LibreCAD',
            '0', 'SECTION', '2', 'HEADER',
            '9', '$MEASUREMENT', '70', '1',
            '0', 'ENDSEC',
            '0', 'SECTION', '2', 'ENTITIES',
            '0', 'LWPOLYLINE', '8', 'CONTOUR', '90', '4', '70', '1',
            '10', '0', '20', '0',
            '10', '200', '20', '0',
            '10', '200', '20', '100',
            '10', '0', '20', '100',
            '0', 'MTEXT', '8', 'NOTES', '1', 'Stal 3 mm',
            '0', 'DIMENSION', '8', 'NOTES',
            '0', 'LEADER', '8', 'NOTES',
            '0', 'ENDSEC', '0', 'EOF',
          ].join('\n');
          await writeFile('/tmp/probe-real-export.dxf', `﻿${drawing}\n`, 'utf8');

          // A document renamed to .dxf. The signature check was widened to let
          // comments and a byte-order mark through, so this proves it still
          // refuses a file that is not a drawing.
          await writeFile('/tmp/probe-not-a-drawing.dxf', '<!doctype html>\n<html><body>hi</body></html>\n', 'utf8');

          // The same drawing a Russian CAD writes when asked for DXF R12/R2000:
          // CP1251, one byte per character. Decoded as UTF-8 its РАЗМЕРЫ layer
          // became replacement characters, stopped counting as annotation, and
          // the dimension line 40 mm below the part inflated the priced blank
          // from 200x100 to 200x140.
          const cyrillic = [
            '0', 'SECTION', '2', 'HEADER',
            '9', '$INSUNITS', '70', '4',
            '0', 'ENDSEC',
            '0', 'SECTION', '2', 'ENTITIES',
            '0', 'LWPOLYLINE', '8', 'КОНТУР', '90', '4', '70', '1',
            '10', '0', '20', '0',
            '10', '200', '20', '0',
            '10', '200', '20', '100',
            '10', '0', '20', '100',
            '0', 'LINE', '8', 'РАЗМЕРЫ',
            '10', '0', '20', '-40', '11', '200', '21', '-40',
            '0', 'ENDSEC', '0', 'EOF',
          ].join('\n') + '\n';
          const cp1251 = Buffer.alloc(cyrillic.length);
          for (let index = 0; index < cyrillic.length; index += 1) {
            const code = cyrillic.charCodeAt(index);
            // U+0410..U+044F (А..я) sit at 0xC0..0xFF; the rest is ASCII, which
            // the two encodings share.
            cp1251[index] = code >= 0x0410 && code <= 0x044f ? code - 0x0410 + 0xc0 : code;
          }
          await writeFile('/tmp/probe-cp1251.dxf', cp1251);

          // An arc whose angles are finite but absurd. Reading it used to never
          // return: normalizeArc subtracted 360 in a loop, and at this magnitude
          // the subtraction gives back the same number for ever.
          await writeFile('/tmp/probe-wild-arc.dxf', [
            '0', 'SECTION', '2', 'HEADER', '9', '$INSUNITS', '70', '4', '0', 'ENDSEC',
            '0', 'SECTION', '2', 'ENTITIES',
            '0', 'ARC', '8', 'CUT', '10', '1e308', '20', '0', '40', '1e308', '50', '0', '51', '1e308',
            '0', 'ENDSEC', '0', 'EOF',
          ].join('\n') + '\n', 'utf8');

          const kernel = await OcctKernel.init();
          const shape = kernel.makeBox(120, 80, 1);
          try {
            const step = kernel.exportStep(shape);
            if (typeof step !== 'string' || !step.includes('ISO-10303-21')) {
              throw new Error('Generated STEP text is invalid');
            }
            await writeFile('/tmp/probe-plate.step', step, 'utf8');
          } finally {
            kernel.release(shape);
            kernel.dispose?.();
          }
          NODE

      - name: A real-world DXF export is read, not refused
        run: |
          set -uo pipefail
          HTTP_CODE="$(curl -sS --max-time 90 -o /tmp/dxf.json -w '%{http_code}' \
            -F 'file=@/tmp/probe-real-export.dxf;type=application/octet-stream' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          echo "HTTP $HTTP_CODE"
          jq '{ok, error, format: .preview.format, status: .preview.status, cad: .preview.cad,
                polylines: (.preview.drawing.polylines | length // 0)}' /tmp/dxf.json || cat /tmp/dxf.json

          set -e
          test "$HTTP_CODE" = "200"
          jq -e '.ok == true' /tmp/dxf.json >/dev/null
          jq -e '.preview.format == "dxf"' /tmp/dxf.json >/dev/null
          # The part was read at its declared size, through $MEASUREMENT.
          jq -e '.preview.cad.widthMm == 200' /tmp/dxf.json >/dev/null
          jq -e '.preview.cad.heightMm == 100' /tmp/dxf.json >/dev/null
          # And there is linework to draw, so the customer sees their part.
          jq -e '(.preview.drawing.polylines | length) > 0' /tmp/dxf.json >/dev/null
          echo 'Live DXF probe passed: comment header, byte-order mark and missing $INSUNITS are all read.'

      - name: A file that only claims to be a DXF is still refused
        run: |
          set -uo pipefail
          HTTP_CODE="$(curl -sS --max-time 60 -o /tmp/bad.json -w '%{http_code}' \
            -F 'file=@/tmp/probe-not-a-drawing.dxf;type=application/octet-stream' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          echo "HTTP $HTTP_CODE"
          cat /tmp/bad.json

          set -e
          # Refused, and refused with a sentence the customer can act on rather
          # than a developer string.
          test "$HTTP_CODE" != "200"
          jq -e '.ok == false' /tmp/bad.json >/dev/null
          jq -e '.error | test("[А-Яа-я]")' /tmp/bad.json >/dev/null
          echo 'Live refusal probe passed: the widened header check still rejects a non-drawing.'

      - name: A CP1251 drawing keeps its Cyrillic annotation layers
        run: |
          set -uo pipefail
          HTTP_CODE="$(curl -sS --max-time 90 -o /tmp/cp1251.json -w '%{http_code}' \
            -F 'file=@/tmp/probe-cp1251.dxf;type=application/octet-stream' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          echo "HTTP $HTTP_CODE"
          jq '{ok, error, cad: .preview.cad, excluded: .preview.drawing.excludedLayers}' /tmp/cp1251.json || cat /tmp/cp1251.json

          set -e
          test "$HTTP_CODE" = "200"
          jq -e '.ok == true' /tmp/cp1251.json >/dev/null
          # The part, not the part plus its dimension line: 200x100, not 200x140.
          jq -e '.preview.cad.widthMm == 200' /tmp/cp1251.json >/dev/null
          jq -e '.preview.cad.heightMm == 100' /tmp/cp1251.json >/dev/null
          # And the layer is named back to the customer in readable Cyrillic.
          jq -e '.preview.drawing.excludedLayers | index("РАЗМЕРЫ") != null' /tmp/cp1251.json >/dev/null
          echo 'Live CP1251 probe passed: the R12/R2000 export from a Russian CAD is read at its true size.'

      - name: An arc with absurd angles is refused rather than chewed on
        run: |
          set -uo pipefail
          START="$(date +%s)"
          HTTP_CODE="$(curl -sS --max-time 45 -o /tmp/arc.json -w '%{http_code}' \
            -F 'file=@/tmp/probe-wild-arc.dxf;type=application/octet-stream' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          ELAPSED="$(( $(date +%s) - START ))"
          echo "HTTP $HTTP_CODE in ${ELAPSED}s"
          cat /tmp/arc.json

          set -e
          # The answer matters less than the fact that there is one: this file
          # used to pin the request that read it.
          test "$ELAPSED" -lt 30
          test "$HTTP_CODE" != "200"
          jq -e '.ok == false' /tmp/arc.json >/dev/null
          jq -e '.error | test("[А-Яа-я]")' /tmp/arc.json >/dev/null
          echo 'Live arc probe passed: the endpoint answered instead of hanging.'

      - name: A STEP solid is measured by OpenCascade on the server
        run: |
          set -uo pipefail
          HTTP_CODE="$(curl -sS --max-time 120 -o /tmp/step.json -w '%{http_code}' \
            -F 'file=@/tmp/probe-plate.step;type=application/step' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          echo "HTTP $HTTP_CODE"
          jq '{ok, error, code, format: .preview.format, status: .preview.status, cad: .preview.cad,
                meshes: (.preview.meshes | length // 0)}' /tmp/step.json || cat /tmp/step.json

          set -e
          test "$HTTP_CODE" = "200"
          jq -e '.ok == true' /tmp/step.json >/dev/null
          jq -e '(.preview.meshes | length) > 0' /tmp/step.json >/dev/null
          jq -e '(.preview.meshes[0].positions | length) > 0' /tmp/step.json >/dev/null
          # Thickness measured from the solid is what keeps the default 1 mm
          # from pricing a plate that was drawn thicker.
          jq -e '.preview.cad.thicknessFromModelMm != null' /tmp/step.json >/dev/null
          echo 'Live STEP probe passed: the solid was meshed and its thickness measured.'
