name: Live CAD preview probe

on:
  push:
    paths:
      - '.github/workflows/install-live-cad-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate a valid STEP solid
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { OcctKernel } from 'occt-wasm';

          const kernel = await OcctKernel.init();
          const shape = kernel.makeBox(120, 80, 1);
          try {
            const step = kernel.exportStep(shape);
            const bytes = step instanceof Uint8Array ? step : new Uint8Array(step);
            if (bytes.byteLength < 100) throw new Error('Generated STEP is unexpectedly small');
            await writeFile('/tmp/steelprodukt-live-probe.step', bytes);
            console.log(`Generated STEP: ${bytes.byteLength} bytes`);
          } finally {
            kernel.release(shape);
            kernel.dispose?.();
          }
          NODE

      - name: POST STEP to production CAD preview API
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --max-time 90 \
            -o /tmp/cad-response.json \
            -w '%{http_code}' \
            -F 'file=@/tmp/steelprodukt-live-probe.step;type=application/step' \
            'https://www.steelprodukt.ru/api/online-order/cad/analyze')"
          echo "HTTP $HTTP_CODE"
          jq '{ok, error, format, code, preview: (if .preview then {format: .preview.format, units: .preview.units, width: .preview.width, height: .preview.height, depth: .preview.depth, meshCount: (.preview.meshes | length), firstMeshPositions: (.preview.meshes[0].positions | length), firstMeshIndices: (.preview.meshes[0].indices | length)} else null end)}' /tmp/cad-response.json
          test "$HTTP_CODE" = "200"
          jq -e '.ok == true' /tmp/cad-response.json >/dev/null
          jq -e '(.preview.meshes | length) > 0' /tmp/cad-response.json >/dev/null
          jq -e '(.preview.meshes[0].positions | length) > 0' /tmp/cad-response.json >/dev/null
          jq -e '(.preview.meshes[0].indices | length) > 0' /tmp/cad-response.json >/dev/null
          echo 'Live STEP -> OpenCascade -> mesh probe passed.'
