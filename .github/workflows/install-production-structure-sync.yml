name: Sync confirmed production structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-production-structure-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize confirmed production structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
              p.write_text(text)

          edit('data/assistant-knowledge.ts', [
              ('Инженерный отдел: анализ задачи, разработка конструкции и КД, технологическая подготовка, оптимизация под серийное изготовление.',
               'Инженерно-конструкторский центр: анализ задачи, разработка и проверка КД, технологическая подготовка, опытные образцы и оптимизация под серийное изготовление.'),
              ('"Сварочные посты и слесарный участок для сборки, доводки и подготовки изделий."',
               '`${productionEquipment.weldingStations} сварочных поста; слесарно-доводочные операции; отдельное сборочное производство.`'),
              ('Контроль качества, комплектование, упаковка и организация отгрузки.',
               'Контроль качества, комплектация и упаковка перед организацией отгрузки.'),
              ('Цепочка включает инженерную проработку, лазерный раскрой, гибку, слесарные и сварочные операции, подготовку поверхности, порошковую окраску, контроль, упаковку и отгрузку.',
               'Цепочка включает инженерно-конструкторскую подготовку, лазерный раскрой, гибку, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, подготовку поверхности, порошковую окраску, контроль качества, комплектацию, упаковку и отгрузку.'),
              ('Инженерный отдел анализирует задачу, разрабатывает конструкцию и КД, проверяет технологичность и готовит изделие к стабильному производству.',
               'Инженерно-конструкторский центр анализирует задачу, разрабатывает и проверяет КД, оценивает технологичность, сопровождает опытный образец и готовит изделие к стабильному серийному производству.'),
          ])

          edit('app/(public)/production/page.tsx', [
              ('["Инженерный отдел", "Прорабатываем конструкцию, технологию изготовления и состав поставки до запуска заказа."],',
               '["Инженерно-конструкторский центр", "Разрабатываем и проверяем КД, прорабатываем технологию, опытный образец и готовность изделия к серийному выпуску."],'),
              ('`${productionEquipment.pressBrakes} листогибочных комплекса + панельгиб`',
               '`${productionEquipment.pressBrakes} листогибочных комплекса + ${productionEquipment.panelBenders} панельгиб`'),
              ('["Сварочные посты", "Выполняем сварку и сборку с контролем геометрии готового изделия."],',
               '[`${productionEquipment.weldingStations} сварочных поста`, "Сварочно-сборочное направление для изготовления деталей и узлов с контролем геометрии."],'),
              ('["Слесарный участок", "Проводим доводку, подгонку и подготовительные операции перед сборкой и покрытием."],',
               '["Слесарно-доводочные операции", "Выполняем подгонку, зачистку, доводку и подготовку деталей к сварке, сборке и покрытию."],\n  ["Сборочное производство", "Собираем детали и узлы в готовые сборочные единицы перед финальным контролем по технологическому маршруту."],'),
              ('"Контроль, упаковка и логистика"', '"Контроль качества, комплектация и упаковка"'),
              ('"Проверяем комплектацию, защищаем изделия при перевозке и организуем отгрузку."',
               '"Проверяем изделия и комплектность, маркируем партии, упаковываем и готовим к отгрузке."'),
              ('description="Инженерная подготовка, лазерный раскрой, гибка, сварка, окраска, контроль и упаковка в одном согласованном маршруте."',
               'description="Инженерно-конструкторская подготовка, лазерный раскрой, гибка, сварка, сборка, подготовка поверхности, окраска, контроль, комплектация и упаковка в одном согласованном маршруте."'),
          ])

          edit('app/(public)/company/page.tsx', [
              ('["3", "лазерных комплекса"]', '[`${productionEquipment.laserComplexes}`, "лазерных комплекса"]'),
              ('["Сварочные посты", "Сварка и сборка металлоизделий с контролем геометрии и подготовкой к следующему этапу производства."],',
               '[`${productionEquipment.weldingStations} сварочных поста`, "Сварочно-сборочное направление для деталей и узлов с контролем геометрии и подготовкой к следующему этапу производства."],'),
              ('["Слесарный участок", "Доводка, подгонка, подготовка к сварке и сборочные операции по согласованной технологии."],',
               '["Слесарно-доводочные операции", "Доводка, подгонка, зачистка и подготовка деталей к сварке и сборке по согласованной технологии."],\n  ["Сборочное производство", "Сборка деталей и узлов в готовые сборочные единицы с промежуточным контролем геометрии и комплектности."],'),
              ('<p className="eyebrow">Оборудование и участки</p>', '<p className="eyebrow">Производственные направления</p>'),
          ])

          company = Path('app/(public)/company/page.tsx')
          company_text = company.read_text()
          if 'const productionCapabilities = [\n  ["Инженерно-конструкторский центр"' not in company_text:
              company_text = company_text.replace(
                  'const productionCapabilities = [\n  [`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`,',
                  'const productionCapabilities = [\n  ["Инженерно-конструкторский центр", "Разработка и проверка КД, технологическая подготовка, опытные образцы и оптимизация изделий под серийное производство."],\n  [`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`,',
                  1,
              )
          if '["Комплектация и упаковка"' not in company_text:
              company_text = company_text.replace(
                  '["Лазерная очистка", "Выполняем локальную очистку поверхности лазером там, где этот способ подходит материалу, загрязнению и дальнейшему технологическому маршруту."],',
                  '["Лазерная очистка", "Выполняем локальную очистку поверхности лазером там, где этот способ подходит материалу, загрязнению и дальнейшему технологическому маршруту."],\n  ["Комплектация и упаковка", "Маркируем и комплектуем партии, защищаем изделия упаковкой и готовим заказ к организованной отгрузке."],',
                  1,
              )
          company.write_text(company_text)

          home = Path('app/(public)/page.tsx')
          home_text = home.read_text()
          if 'productionEquipment,' not in home_text:
              home_text = home_text.replace(
                  '  productionLeadTimeSummary,\n  productionOrderConditions,',
                  '  productionLeadTimeSummary,\n  productionOrderConditions,\n  productionEquipment,',
                  1,
              )
          home_text = home_text.replace('["3", "лазерных комплекса"]', '[`${productionEquipment.laserComplexes}`, "лазерных комплекса"]', 1)
          home_text = home_text.replace('["4", "листогибочных комплекса"]', '[`${productionEquipment.pressBrakes}`, "листогибочных комплекса"]', 1)
          home.write_text(home_text)

          checks = {
              'data/manufacturing-facts.ts': ['laserComplexes: 3', 'pressBrakes: 4', 'weldingStations: 4', 'powderCoatingBooths: 3'],
              'data/assistant-knowledge.ts': ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'сборочное производство', 'комплектация и упаковка'],
              'app/(public)/production/page.tsx': ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'Слесарно-доводочные операции', 'Сборочное производство', 'Контроль качества, комплектация и упаковка'],
              'app/(public)/company/page.tsx': ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'Слесарно-доводочные операции', 'Сборочное производство', 'Комплектация и упаковка'],
          }
          for path, phrases in checks.items():
              text = Path(path).read_text()
              missing = [phrase for phrase in phrases if phrase not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')
          PY

      - name: Commit synchronized production structure
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/assistant-knowledge.ts app/'(public)'/production/page.tsx app/'(public)'/company/page.tsx app/'(public)'/page.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "facts: present confirmed full production structure"
          git push origin HEAD:main
