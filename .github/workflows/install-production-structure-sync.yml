name: Sync confirmed production structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-production-structure-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize production terminology and confirmed facts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  text = text.replace(old, new, 1)
                  p.write_text(text)

          assistant = 'data/assistant-knowledge.ts'
          replace_if_present(assistant,
              '  "Инженерный отдел: анализ задачи, разработка конструкции и КД, технологическая подготовка, оптимизация под серийное изготовление.",',
              '  "Инженерно-конструкторский центр: анализ задачи, разработка и проверка КД, технологическая подготовка, опытные образцы и оптимизация под серийное изготовление.",')
          replace_if_present(assistant,
              '  "Сварочные посты и слесарный участок для сборки, доводки и подготовки изделий.",',
              '  `${productionEquipment.weldingStations} сварочных поста; слесарно-доводочные операции; отдельное сборочное производство.`,')
          replace_if_present(assistant,
              '  "Контроль качества, комплектование, упаковка и организация отгрузки.",',
              '  "Контроль качества, комплектация и упаковка перед организацией отгрузки.",')
          replace_if_present(assistant,
              'return `Цепочка включает инженерную проработку, лазерный раскрой, гибку, слесарные и сварочные операции, подготовку поверхности, порошковую окраску, контроль, упаковку и отгрузку. ${productionLeadTimeSummary} На каком изделии нужно остановиться подробнее?`;',
              'return `Цепочка включает инженерно-конструкторскую подготовку, лазерный раскрой, гибку, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, подготовку поверхности, порошковую окраску, контроль качества, комплектацию, упаковку и отгрузку. ${productionLeadTimeSummary} На каком изделии нужно остановиться подробнее?`;')
          replace_if_present(assistant,
              'return "Инженерный отдел анализирует задачу, разрабатывает конструкцию и КД, проверяет технологичность и готовит изделие к стабильному производству. У вас уже есть чертёж или пока только техническое задание?";',
              'return "Инженерно-конструкторский центр анализирует задачу, разрабатывает и проверяет КД, оценивает технологичность, сопровождает опытный образец и готовит изделие к стабильному серийному производству. У вас уже есть чертёж или пока только техническое задание?";')

          production = 'app/(public)/production/page.tsx'
          replace_if_present(production,
              '["Инженерный отдел", "Прорабатываем конструкцию, технологию изготовления и состав поставки до запуска заказа."],',
              '["Инженерно-конструкторский центр", "Разрабатываем и проверяем КД, прорабатываем технологию, опытный образец и готовность изделия к серийному выпуску."],')
          replace_if_present(production,
              '[`${productionEquipment.pressBrakes} листогибочных комплекса + панельгиб`, "Формируем стабильную геометрию деталей и повторяемость партии."],',
              '[`${productionEquipment.pressBrakes} листогибочных комплекса + ${productionEquipment.panelBenders} панельгиб`, "Формируем стабильную геометрию деталей и повторяемость партии."],')
          replace_if_present(production,
              '["Сварочные посты", "Выполняем сварку и сборку с контролем геометрии готового изделия."],',
              '[`${productionEquipment.weldingStations} сварочных поста`, "Сварочно-сборочное направление для изготовления деталей и узлов с контролем геометрии."],')
          replace_if_present(production,
              '["Слесарный участок", "Проводим доводку, подгонку и подготовительные операции перед сборкой и покрытием."],',
              '["Слесарно-доводочные операции", "Выполняем подгонку, зачистку, доводку и подготовку деталей к сварке, сборке и покрытию."],\n  ["Сборочное производство", "Собираем детали и узлы в готовые сборочные единицы перед финальным контролем по технологическому маршруту."],')
          replace_if_present(production,
              '["Контроль, упаковка и логистика", "Проверяем комплектацию, защищаем изделия при перевозке и организуем отгрузку."],',
              '["Контроль качества, комплектация и упаковка", "Проверяем изделия и комплектность, маркируем партии, упаковываем и готовим к отгрузке."],')
          replace_if_present(production,
              'description="Инженерная подготовка, лазерный раскрой, гибка, сварка, окраска, контроль и упаковка в одном согласованном маршруте."',
              'description="Инженерно-конструкторская подготовка, лазерный раскрой, гибка, сварка, сборка, подготовка поверхности, окраска, контроль, комплектация и упаковка в одном согласованном маршруте."')

          company = 'app/(public)/company/page.tsx'
          replace_if_present(company, '["3", "лазерных комплекса"],', '[`${productionEquipment.laserComplexes}`, "лазерных комплекса"],')
          replace_if_present(company,
              '["Производство полного цикла", `Лазерная резка, гибка, сварочные посты, слесарный участок, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, дробеструйная и лазерная очистка, контроль качества и упаковка объединены в едином процессе.`],',
              '["Производство полного цикла", `Инженерно-конструкторский центр, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса, панельгиб, ${productionEquipment.weldingStations} сварочных поста, слесарно-доводочные операции, сборочное производство, подготовка поверхности, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектация и упаковка объединены в едином маршруте.`],')
          replace_if_present(company,
              'const productionCapabilities = [\n  [`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`,',
              'const productionCapabilities = [\n  ["Инженерно-конструкторский центр", "Разработка и проверка КД, технологическая подготовка, опытные образцы и оптимизация изделий под серийное производство."],\n  [`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`,')
          replace_if_present(company,
              '["Сварочные посты", "Сварка и сборка металлоизделий с контролем геометрии и подготовкой к следующему этапу производства."],',
              '[`${productionEquipment.weldingStations} сварочных поста`, "Сварочно-сборочное направление для деталей и узлов с контролем геометрии и подготовкой к следующему этапу производства."],')
          replace_if_present(company,
              '["Слесарный участок", "Доводка, подгонка, подготовка к сварке и сборочные операции по согласованной технологии."],',
              '["Слесарно-доводочные операции", "Доводка, подгонка, зачистка и подготовка деталей к сварке и сборке по согласованной технологии."],\n  ["Сборочное производство", "Сборка деталей и узлов в готовые сборочные единицы с промежуточным контролем геометрии и комплектности."],')
          replace_if_present(company,
              '["Лазерная очистка", "Выполняем локальную очистку поверхности лазером там, где этот способ подходит материалу, загрязнению и дальнейшему технологическому маршруту."],',
              '["Лазерная очистка", "Выполняем локальную очистку поверхности лазером там, где этот способ подходит материалу, загрязнению и дальнейшему технологическому маршруту."],\n  ["Комплектация и упаковка", "Маркируем и комплектуем партии, защищаем изделия упаковкой и готовим заказ к организованной отгрузке."],')
          replace_if_present(company, '<p className="eyebrow">Оборудование и участки</p>', '<p className="eyebrow">Производственные направления</p>')
          replace_if_present(company,
              '{ question: "Какие операции выполняются на собственной площадке?", answer: "Производственный маршрут включает инженерную подготовку, лазерную резку, гибку на ЧПУ, сварочные и слесарные операции, порошковую окраску, контроль качества и упаковку." },',
              '{ question: "Какие операции выполняются на собственной площадке?", answer: `Производственный маршрут включает инженерно-конструкторскую подготовку, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса и панельгиб, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, подготовку поверхности, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектацию и упаковку.` },')

          home = 'app/(public)/page.tsx'
          replace_if_present(home,
              '  productionLeadTimeSummary,\n  productionOrderConditions,',
              '  productionLeadTimeSummary,\n  productionOrderConditions,\n  productionEquipment,')
          replace_if_present(home,
              '{ question: "Выполняете полный цикл производства?", answer: "Да. В единый маршрут могут входить инженерная подготовка, лазерный раскрой, гибка на ЧПУ, сварка и сборка, порошковая окраска, контроль, упаковка и отгрузка." },',
              '{ question: "Выполняете полный цикл производства?", answer: `Да. В единый маршрут могут входить инженерно-конструкторская подготовка, ${productionEquipment.laserComplexes} лазерных комплекса, ${productionEquipment.pressBrakes} листогибочных комплекса и панельгиб, слесарно-доводочные операции, ${productionEquipment.weldingStations} сварочных поста, сборочное производство, подготовка поверхности, ${productionEquipment.powderCoatingBooths} камеры порошковой окраски, контроль качества, комплектация, упаковка и отгрузка.` },')
          replace_if_present(home,
              '["3", "лазерных комплекса"],\n              ["4", "листогибочных комплекса"],',
              '[`${productionEquipment.laserComplexes}`, "лазерных комплекса"],\n              [`${productionEquipment.pressBrakes}`, "листогибочных комплекса"],')

          required = {
              assistant: ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'сборочное производство'],
              production: ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'Слесарно-доводочные операции', 'Сборочное производство', 'Комплектация и упаковка'],
              company: ['Инженерно-конструкторский центр', 'productionEquipment.weldingStations', 'Слесарно-доводочные операции', 'Сборочное производство', 'Комплектация и упаковка'],
              home: ['productionEquipment.laserComplexes', 'productionEquipment.pressBrakes', 'productionEquipment.weldingStations'],
          }
          for path, phrases in required.items():
              text = Path(path).read_text()
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f'{path}: required phrase missing after sync: {phrase}')
          PY

      - name: Commit synchronized production structure
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/assistant-knowledge.ts app/\(public\)/production/page.tsx app/\(public\)/company/page.tsx app/\(public\)/page.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "facts: present confirmed full production structure"
          git push origin HEAD:main
