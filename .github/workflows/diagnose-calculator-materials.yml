name: Diagnose calculator material coverage

on:
  push:
    branches:
      - diagnose/cad-calculator-20260918
    paths:
      - .github/workflows/diagnose-calculator-materials.yml

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calculate same DXF for all public materials
        run: |
          set -euo pipefail
          cat > /tmp/part.dxf <<'DXF'
          0
          SECTION
          2
          HEADER
          9
          $INSUNITS
          70
          4
          0
          ENDSEC
          0
          SECTION
          2
          ENTITIES
          0
          LWPOLYLINE
          8
          CUT
          90
          4
          70
          1
          10
          0
          20
          0
          10
          100
          20
          0
          10
          100
          20
          100
          10
          0
          20
          100
          0
          ENDSEC
          0
          EOF
          DXF
          for MATERIAL in hot cold zinc; do
            printf '{"title":"material diagnostic","parts":[{"clientPartId":"diag","fileIndex":0,"materialId":"%s","thicknessMm":1,"quantity":1,"operations":[],"operationInputs":{}}]}' "$MATERIAL" > /tmp/manifest.json
            CODE="$(curl -sS -o /tmp/response.json -w '%{http_code}' \
              -H 'Origin: https://www.steelprodukt.ru' \
              -H 'Referer: https://www.steelprodukt.ru/online-order' \
              -F 'manifest=</tmp/manifest.json' \
              -F 'files=@/tmp/part.dxf;type=application/dxf' \
              https://www.steelprodukt.ru/api/online-order/calculate)"
            STATUS="$(jq -r '.calculation.parts[0].status // .code // "none"' /tmp/response.json)"
            PRICE="$(jq -r '.calculation.parts[0].price.status // "none"' /tmp/response.json)"
            echo "MATERIAL=$MATERIAL HTTP=$CODE STATUS=$STATUS PRICE=$PRICE"
          done
