name: Quote integration snapshot
on:
  push:
    branches: [release/ai-engineer-integrated-20260921]
    paths: [.github/workflows/quote-integration-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only source changes since the verified workspace
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib
          base='e59cef680461c0edef0c35c68e5534383fd89458'
          names=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','app','components','lib','tests','docs','.env.example']).decode().splitlines()
          rows=[]
          for name in names:
              p=pathlib.Path(name)
              prior=subprocess.run(['git','show',f'{base}:{name}'],capture_output=True)
              rows.append({'path':name,'base':prior.stdout.decode() if prior.returncode==0 else None,'current':p.read_text() if p.exists() else None})
          payload={'base':base,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'changes':rows,
              'transport':{str(i):pathlib.Path(f'.github/quote-release-patch.{i}.b64').read_text() for i in range(1,6)}}
          pathlib.Path('/tmp/quote-integration-snapshot.json').write_text(json.dumps(payload,ensure_ascii=False))
          print('Exported source files:',len(rows))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: quote-integration-snapshot
          path: /tmp/quote-integration-snapshot.json
          retention-days: 1
