name: Sync confirmed surface-cleaning facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-sync-surface-cleaning-facts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize confirmed production capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/(public)/production/page.tsx')
          text = page.read_text()
          old_import = '  productionLeadTimeSummary,\n  productionOrderConditions,\n} from "@/data/manufacturing-facts";'
          new_import = '  productionEquipment,\n  productionLeadTimeSummary,\n  productionOrderConditions,\n} from "@/data/manufacturing-facts";'
          if old_import not in text:
              raise SystemExit('production import anchor not found')
          text = text.replace(old_import, new_import, 1)
          replacements = [
              ('["3 лазерных комплекса с ЧПУ", `Раскрой чёрной стали ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола ${laserCuttingCapabilities.tableWorkingArea}.`],',
               '[`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ`, `Раскрой чёрной стали ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола ${laserCuttingCapabilities.tableWorkingArea}.`],'),
              ('["3 листогибочных комплекса + панельгиб", "Формируем стабильную геометрию деталей и повторяемость партии."],',
               '[`${productionEquipment.pressBrakes} листогибочных комплекса + панельгиб`, "Формируем стабильную геометрию деталей и повторяемость партии."],'),
              ('["3 камеры порошковой окраски", "Наносим защитно-декоративное покрытие и ведём параллельную обработку изделий."],',
               '[`${productionEquipment.powderCoatingBooths} камеры порошковой окраски`, "Наносим защитно-декоративное покрытие и ведём параллельную обработку изделий."],'),
              ('["Камера дробеструйной очистки", "Подготавливаем поверхность металла перед окраской для надёжного сцепления покрытия."],',
               '["Дробеструйная очистка", "Подготавливаем поверхность металла по согласованной технологии перед дальнейшими операциями и нанесением покрытия."],\n  ["Лазерная очистка", "Удаляем локальные загрязнения, окислы и покрытия в рамках согласованной технологической подготовки поверхности."],'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'production page anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)
          page.write_text(text)

          assistant = Path('data/assistant-knowledge.ts')
          text = assistant.read_text()
          old_import = '  productionLeadTimeSummary,\n  productionOrderConditions,\n} from "@/data/manufacturing-facts";'
          new_import = '  productionEquipment,\n  productionLeadTimeSummary,\n  productionOrderConditions,\n} from "@/data/manufacturing-facts";'
          if old_import not in text:
              raise SystemExit('assistant import anchor not found')
          text = text.replace(old_import, new_import, 1)
          replacements = [
              ('`3 лазерных комплекса с ЧПУ. Чёрная сталь: ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола: ${laserCuttingCapabilities.tableWorkingArea}. Применимость конкретного режима подтверждается по марке стали, геометрии и требованиям к кромке. Диапазоны для нержавеющей и оцинкованной стали, алюминия и других материалов согласуются отдельно.`,',
               '`${productionEquipment.laserComplexes} лазерных комплекса с ЧПУ. Чёрная сталь: ${laserCuttingCapabilities.thicknessRange}; рабочее поле стола: ${laserCuttingCapabilities.tableWorkingArea}. Применимость конкретного режима подтверждается по марке стали, геометрии и требованиям к кромке. Диапазоны для нержавеющей и оцинкованной стали, алюминия и других материалов согласуются отдельно.`,'),
              ('"3 листогибочных комплекса и панельгиб для повторяемой геометрии деталей.",',
               '`${productionEquipment.pressBrakes} листогибочных комплекса и панельгиб для повторяемой геометрии деталей.`,'),
              ('"3 камеры порошковой окраски.",',
               '`${productionEquipment.powderCoatingBooths} камеры порошковой окраски.`,'),
              ('"Камера дробеструйной очистки для подготовки поверхности перед нанесением покрытия.",',
               '"Дробеструйная очистка поверхности по согласованной технологии перед дальнейшими операциями и нанесением покрытия.",\n  "Лазерная очистка поверхности для согласованных задач по удалению загрязнений, окислов и покрытий.",'),
              ('["порош", "покрас", "ral", "цвет", "дробест"]',
               '["порош", "покрас", "ral", "цвет", "дробест", "лазерная чист", "лазерная очист"]'),
              ('["порош", "покрас", "ral", "дробест", "покрыт"]',
               '["порош", "покрас", "ral", "дробест", "лазерная чист", "лазерная очист", "покрыт"]'),
              ('"Работают три камеры порошковой окраски и камера дробеструйной очистки. Цвет, фактура и подготовка поверхности подбираются по материалу и условиям эксплуатации. Укажите габариты изделия, материал, количество и требуемый RAL."',
               '`${productionEquipment.powderCoatingBooths} камеры порошковой окраски; доступны дробеструйная и лазерная очистка поверхности. Маршрут подготовки, цвет и фактура подбираются по материалу и условиям эксплуатации. Укажите габариты изделия, материал, количество и требуемый RAL.`'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'assistant anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)
          assistant.write_text(text)
          PY

      - name: Commit synchronized facts
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(public)/production/page.tsx' 'data/assistant-knowledge.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: sync shot-blasting and laser cleaning facts"
          git push origin HEAD:main
