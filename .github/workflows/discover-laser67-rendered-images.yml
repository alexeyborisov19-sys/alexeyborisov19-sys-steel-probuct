name: Discover rendered Laser67 product images

on:
  push:
    branches:
      - check-yandex-api-20260919
    paths:
      - '.github/workflows/discover-laser67-rendered-images.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect rendered product pages
        run: |
          cat > discover.mjs <<'EOF'
          import { chromium } from 'playwright';

          const pages = [
            'https://laser67.ru/products/category/korpusa-metallicheskie',
            'https://laser67.ru/products/category/metallokassety-fasadnye',
            'https://laser67.ru/products/category/pozharnye-shkafy',
            'https://laser67.ru/products/category/zakladnye-detali-iz-metalla',
            'https://laser67.ru/products/category/traversy-tm-dlya-lep',
            'https://laser67.ru/products/category/obramleniya-dlya-liftov',
            'https://laser67.ru/products/category/zapchasti-dlya-selkhoztekhniki',
            'https://laser67.ru/products/category/pochtoviy-yaschik',
            'https://laser67.ru/products/category/kostrovaya-chasha'
          ];

          const browser = await chromium.launch({headless:true});
          for (const url of pages) {
            const page = await browser.newPage({viewport:{width:1440,height:2200}});
            const network = new Set();

            page.on('response', res => {
              const req = res.request();
              if (req.resourceType() === 'image') network.add(res.url());
            });

            try {
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(6000);
              await page.evaluate(async () => {
                for (let y=0; y<document.body.scrollHeight; y+=800) {
                  window.scrollTo(0,y);
                  await new Promise(r=>setTimeout(r,180));
                }
                window.scrollTo(0,0);
              });
              await page.waitForTimeout(2500);

              const dom = await page.evaluate(() => {
                const out = [];
                for (const img of document.querySelectorAll('img')) {
                  out.push({
                    src: img.currentSrc || img.src || '',
                    alt: img.alt || '',
                    width: img.naturalWidth || 0,
                    height: img.naturalHeight || 0
                  });
                }
                for (const el of document.querySelectorAll('*')) {
                  const bg = getComputedStyle(el).backgroundImage;
                  if (bg && bg !== 'none') {
                    for (const m of bg.matchAll(/url\(["']?([^"')]+)["']?\)/g)) {
                      out.push({src:m[1],alt:'[background]',width:el.clientWidth||0,height:el.clientHeight||0});
                    }
                  }
                }
                return out;
              });

              const merged = [];
              const seen = new Set();
              for (const item of [...dom, ...[...network].map(src=>({src,alt:'[network]',width:0,height:0}))]) {
                if (!item.src || seen.has(item.src)) continue;
                seen.add(item.src);
                merged.push(item);
              }

              const relevant = merged.filter(x => {
                const u=(x.src||'').toLowerCase();
                if (u.includes('favicon') || u.includes('logo') || u.includes('icon') || u.includes('sprite')) return false;
                return true;
              });

              console.log('PAGE='+url);
              console.log('RENDERED_IMAGES='+JSON.stringify(relevant));
            } catch (e) {
              console.log('ERROR='+url+' '+String(e));
            } finally {
              await page.close();
            }
          }
          await browser.close();
          EOF

          node discover.mjs
