name: Install Marketing Skills for Codex

on:
  push:
    paths:
      - '.github/workflows/install-marketing-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Marketing Skills
        run: |
          git clone --no-checkout https://github.com/coreyhaines31/marketingskills.git /tmp/marketingskills
          git -C /tmp/marketingskills checkout becd60ee9df07f7d595c26e092253ba49f7a9ffc

      - name: Install skills for Codex
        run: |
          mkdir -p .agents/skills
          cp -R /tmp/marketingskills/skills/. .agents/skills/

      - name: Commit installed marketing skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills
          if git diff --cached --quiet; then
            echo "Marketing Skills already installed; nothing to commit."
            exit 0
          fi
          git commit -m "chore: install Codex marketing and SEO skills"
          git push
