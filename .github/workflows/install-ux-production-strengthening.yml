name: Install UX and production copy strengthening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ux-production-strengthening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply UX and production copy improvements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: marker missing: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          replace_once('app/(public)/production/[slug]/page.tsx', 'Подтвердим получение материалов в течение рабочего дня. Срок подготовки расчёта\n                сообщим после проверки документации.', 'Материалы передаются на инженерную проверку. Срок подготовки расчёта\n                сообщим после проверки документации.')
          replace_once('app/(public)/production/page.tsx', '["Проектирование", "/images/real-production/engineering-department.jpg", "Проверяем технологичность, сопряжения и развёртки.", "/production/proektirovanie-metalloizdeliy"],', '["Инженерно-конструкторский центр", "/images/real-production/engineering-department.jpg", "Разрабатываем и проверяем КД, технологичность, сопряжения и развёртки.", "/production/proektirovanie-metalloizdeliy"],')
          replace_once('app/(public)/production/page.tsx', '["Сварка", "/images/real-production/welding-station.jpg", "Проверяем сборку, швы и геометрию изделия.", "/production/svarka-i-sborka-metalloizdeliy"],', '["Сварочно-сборочное направление", "/images/real-production/welding-station.jpg", "Четыре сварочных поста, сборка и контроль геометрии изделия.", "/production/svarka-i-sborka-metalloizdeliy"],')
          replace_once('app/(public)/production/page.tsx', '["Отгрузка", "/images/web/cycle-quality-control.jpg", "Проверяем комплектность, маркировку и упаковку.", "/production/kontrol-kachestva-i-upakovka"],', '["Комплектация и упаковка", "/images/web/cycle-quality-control.jpg", "Проверяем комплектность, маркировку и готовность партии к отгрузке.", "/production/kontrol-kachestva-i-upakovka"],')

          header = Path('components/Header.tsx')
          text = header.read_text()
          if 'import { siteConfig } from "@/lib/site";' not in text:
              text = text.replace('import { usePathname } from "next/navigation";\n', 'import { usePathname } from "next/navigation";\nimport { siteConfig } from "@/lib/site";\n', 1)
          if 'Перейти к содержимому' not in text:
              marker = '      className="site-header fixed left-0 right-0 top-0 z-50 border-b border-white/10 bg-black/95"\n    >'
              replacement = marker + '\n      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-[100] focus:bg-steel-orange focus:px-4 focus:py-3 focus:text-xs focus:font-bold focus:uppercase focus:text-white">Перейти к содержимому</a>'
              if marker not in text:
                  raise SystemExit('Header: header marker missing')
              text = text.replace(marker, replacement, 1)
          if 'siteConfig.telephoneDisplay' not in text:
              marker = '            </nav>\n          </div>\n        </div>\n      )}\n'
              phone_lines = ['            </nav>', '            <a', '              href={`tel:${siteConfig.telephone}`}', '              className="mt-5 flex min-h-12 items-center justify-between border border-white/15 px-4 text-xs font-bold uppercase text-white transition hover:border-steel-orange hover:text-steel-orange"', '            >', '              <span>Позвонить</span>', '              <span className="text-steel-orange">{siteConfig.telephoneDisplay}</span>', '            </a>', '          </div>', '        </div>', '      )}', '']
              replacement = '\n'.join(phone_lines)
              if marker not in text:
                  raise SystemExit('Header: mobile navigation marker missing')
              text = text.replace(marker, replacement, 1)
          header.write_text(text)

          replace_once('components/PageLayout.tsx', '<main>', '<main id="main-content">')
          replace_once('app/(public)/page.tsx', '<main>', '<main id="main-content">')
          replace_once('app/(public)/products/[slug]/page.tsx', '<Header /><main>', '<Header /><main id="main-content">')

          launcher = Path('components/EngineeringAssistantLauncher.tsx')
          text = launcher.read_text()
          text = text.replace('className="assistant-launcher group flex h-[58px] items-center gap-3 border border-steel-orange/65 bg-[#111519] pl-3 pr-4', 'className="assistant-launcher group flex h-[58px] items-center gap-0 border border-steel-orange/65 bg-[#111519] px-1.5 sm:gap-3 sm:pl-3 sm:pr-4', 1)
          text = text.replace('<span className="min-w-[142px] whitespace-nowrap text-left">', '<span className="hidden min-w-[142px] whitespace-nowrap text-left sm:block">', 1)
          launcher.write_text(text)
          PY

      - name: Verify and commit
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/'(public)'/production/'[slug]'/page.tsx app/'(public)'/production/page.tsx components/Header.tsx components/PageLayout.tsx app/'(public)'/page.tsx app/'(public)'/products/'[slug]'/page.tsx components/EngineeringAssistantLauncher.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: strengthen production UX accessibility and mobile conversion"
          git push origin HEAD:main
