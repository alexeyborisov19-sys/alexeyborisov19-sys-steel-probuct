name: Install UX and production copy strengthening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ux-production-strengthening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply UX and production copy improvements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: marker missing: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          # Production-service pages: remove the last unverified response-time SLA.
          replace_once(
              'app/(public)/production/[slug]/page.tsx',
              'Подтвердим получение материалов в течение рабочего дня. Срок подготовки расчёта\n                сообщим после проверки документации.',
              'Материалы передаются на инженерную проверку. Срок подготовки расчёта\n                сообщим после проверки документации.',
          )

          # Production index: use the approved professional names of production directions.
          replace_once(
              'app/(public)/production/page.tsx',
              '["Проектирование", "/images/real-production/engineering-department.jpg", "Проверяем технологичность, сопряжения и развёртки.", "/production/proektirovanie-metalloizdeliy"],',
              '["Инженерно-конструкторский центр", "/images/real-production/engineering-department.jpg", "Разрабатываем и проверяем КД, технологичность, сопряжения и развёртки.", "/production/proektirovanie-metalloizdeliy"],',
          )
          replace_once(
              'app/(public)/production/page.tsx',
              '["Сварка", "/images/real-production/welding-station.jpg", "Проверяем сборку, швы и геометрию изделия.", "/production/svarka-i-sborka-metalloizdeliy"],',
              '["Сварочно-сборочное направление", "/images/real-production/welding-station.jpg", "Четыре сварочных поста, сборка и контроль геометрии изделия.", "/production/svarka-i-sborka-metalloizdeliy"],',
          )
          replace_once(
              'app/(public)/production/page.tsx',
              '["Отгрузка", "/images/web/cycle-quality-control.jpg", "Проверяем комплектность, маркировку и упаковку.", "/production/kontrol-kachestva-i-upakovka"],',
              '["Комплектация и упаковка", "/images/web/cycle-quality-control.jpg", "Проверяем комплектность, маркировку и готовность партии к отгрузке.", "/production/kontrol-kachestva-i-upakovka"],',
          )

          # Header: add a keyboard skip link and a direct mobile telephone action.
          header = Path('components/Header.tsx')
          text = header.read_text()
          if 'siteConfig' not in text:
              text = text.replace('import { usePathname } from "next/navigation";\n', 'import { usePathname } from "next/navigation";\nimport { siteConfig } from "@/lib/site";\n', 1)
          if 'Перейти к содержимому' not in text:
              text = text.replace(
                  '  return (\n    <header',
                  '  return (\n    <header',
                  1,
              )
              text = text.replace(
                  '      className="site-header fixed left-0 right-0 top-0 z-50 border-b border-white/10 bg-black/95"\n    >',
                  '      className="site-header fixed left-0 right-0 top-0 z-50 border-b border-white/10 bg-black/95"\n    >\n      <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-[100] focus:bg-steel-orange focus:px-4 focus:py-3 focus:text-xs focus:font-bold focus:uppercase focus:text-white">Перейти к содержимому</a>',
                  1,
              )
          if 'Позвонить ·' not in text:
              marker = '            </nav>\n          </div>\n        </div>\n      )}\n'
              phone = '''            </nav>
            <a
              href={`tel:${siteConfig.telephone}`}
              className="mt-5 flex min-h-12 items-center justify-between border border-white/15 px-4 text-xs font-bold uppercase text-white transition hover:border-steel-orange hover:text-steel-orange"
            >
              <span>Позвонить</span>
              <span className="text-steel-orange">{siteConfig.telephoneDisplay}</span>
            </a>
          </div>
        </div>
      )}
'''
              if marker not in text:
                  raise SystemExit('Header: mobile navigation marker missing')
              text = text.replace(marker, phone, 1)
          header.write_text(text)

          # Ensure the skip link has a destination on shared and manually composed public pages.
          replace_once('components/PageLayout.tsx', '<main>', '<main id="main-content">')
          replace_once('app/(public)/page.tsx', '<main>', '<main id="main-content">')
          replace_once('app/(public)/products/[slug]/page.tsx', '<Header /><main>', '<Header /><main id="main-content">')

          # Keep the assistant useful but stop the fixed launcher covering mobile content.
          launcher = Path('components/EngineeringAssistantLauncher.tsx')
          text = launcher.read_text()
          text = text.replace(
              'className="assistant-launcher group flex h-[58px] items-center gap-3 border border-steel-orange/65 bg-[#111519] pl-3 pr-4',
              'className="assistant-launcher group flex h-[58px] items-center gap-0 border border-steel-orange/65 bg-[#111519] px-1.5 sm:gap-3 sm:pl-3 sm:pr-4',
              1,
          )
          text = text.replace(
              '<span className="min-w-[142px] whitespace-nowrap text-left">',
              '<span className="hidden min-w-[142px] whitespace-nowrap text-left sm:block">',
              1,
          )
          launcher.write_text(text)

          # Regression coverage across all modified public surfaces.
          test = Path('tests/ux-production-strengthening.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst read = (path: string) => readFile(new URL(`../${path}`, import.meta.url), "utf8");\n\ntest("production pages keep approved professional production terminology", async () => {\n  const source = await read("app/(public)/production/page.tsx");\n  assert.match(source, /Инженерно-конструкторский центр/);\n  assert.match(source, /Сварочно-сборочное направление/);\n  assert.match(source, /Комплектация и упаковка/);\n  assert.match(source, /Четыре сварочных поста/);\n});\n\ntest("production-service pages do not promise an unverified one-day response SLA", async () => {\n  const source = await read("app/(public)/production/[slug]/page.tsx");\n  assert.doesNotMatch(source, /Подтвердим получение материалов в течение рабочего дня/);\n  assert.match(source, /Материалы передаются на инженерную проверку/);\n});\n\ntest("public navigation provides a keyboard skip target and direct mobile call action", async () => {\n  const [header, layout, home, product] = await Promise.all([\n    read("components/Header.tsx"),\n    read("components/PageLayout.tsx"),\n    read("app/(public)/page.tsx"),\n    read("app/(public)/products/[slug]/page.tsx"),\n  ]);\n  assert.match(header, /href="#main-content"/);\n  assert.match(header, /siteConfig\\.telephoneDisplay/);\n  for (const source of [layout, home, product]) assert.match(source, /id="main-content"/);\n});\n\ntest("engineering assistant launcher stays compact on small screens", async () => {\n  const source = await read("components/EngineeringAssistantLauncher.tsx");\n  assert.match(source, /hidden min-w-\\[142px\\].*sm:block/);\n  assert.match(source, /sm:gap-3/);\n});\n''')
          PY

      - name: Verify and commit
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/'(public)'/production/'[slug]'/page.tsx app/'(public)'/production/page.tsx components/Header.tsx components/PageLayout.tsx app/'(public)'/page.tsx app/'(public)'/products/'[slug]'/page.tsx components/EngineeringAssistantLauncher.tsx tests/ux-production-strengthening.test.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: strengthen production UX accessibility and mobile conversion"
          git push origin HEAD:main
