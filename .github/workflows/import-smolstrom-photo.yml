name: Import Smolstrom project photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-smolstrom-photo.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch project photo
        run: |
          mkdir -p public/images/projects
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              "https://at.adobe.com/wtmxPXmQMppZSdMM",
              "public/images/projects/smolstrom-marii-oktyabrskoy-1.jpg",
          )
          PY
          test $(stat -c%s public/images/projects/smolstrom-marii-oktyabrskoy-1.jpg) -gt 100000
      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/smolstrom-marii-oktyabrskoy-1.jpg
          git commit -m "Add Smolstrom Maria Oktyabrskaya project photo"
          git push origin HEAD:main
