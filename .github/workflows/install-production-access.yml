name: Configure production calculator access
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: RSA public key for encrypted first-administrator credentials
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: steelprodukt-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure existing server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/production-public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/production-public.pem" -noout
      - name: Create first administrator with encrypted delivery
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          PUB="/tmp/production-public-$GITHUB_RUN_ID.pem"
          ENC="/tmp/production-credentials-$GITHUB_RUN_ID.enc"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" "$RUNNER_TEMP/production-public.pem" "$BEGET_USER@$BEGET_HOST:$PUB"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' PUB='$PUB' ENC='$ENC' EXPECTED_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(cat "$APP_PATH/.next/BUILD_COMMIT")" = "$EXPECTED_SHA"
          chmod 644 "$PUB"
          sudo install -d -m 0700 -o nodejs -g nodejs /var/lib/steelprodukt/admin /var/lib/steelprodukt/exports
          sudo -iu nodejs bash -s -- "$APP_PATH" "$PUB" "$ENC" <<'NODEUSER'
          set -euo pipefail
          cd "$1"
          node --import tsx --import ./scripts/repo-alias-hook.mjs scripts/setup-production-access.ts "$2" "$3"
          set -a
          . ./.env.production
          set +a
          pm2 restart steelprodukt --update-env
          NODEUSER
          rm -f "$PUB"
          REMOTE
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "sudo cat '$ENC'" > "$RUNNER_TEMP/production-credentials.enc"
          test -s "$RUNNER_TEMP/production-credentials.enc"
      - uses: actions/upload-artifact@v7
        with:
          name: production-admin-encrypted
          path: ${{ runner.temp }}/production-credentials.enc
          retention-days: 1
          if-no-files-found: error
