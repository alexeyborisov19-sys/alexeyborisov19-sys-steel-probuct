name: Import high-quality ODKB photos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-odkb-high-quality.yml'

permissions:
  contents: write

jobs:
  import:
    name: Replace compressed ODKB photos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download original JPEG photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/projects

          urls=(
            "https://at.adobe.com/h8kSz1xw6ys1HXz9"
            "https://at.adobe.com/8aoYcOIB8VOSmcCt"
            "https://at.adobe.com/3GNxygTtyz9jPFmQ"
          )
          targets=(
            "public/images/projects/odkb-novyy-korpus-1.jpg"
            "public/images/projects/odkb-novyy-korpus-2.jpg"
            "public/images/projects/odkb-novyy-korpus-3.jpg"
          )

          for i in 0 1 2; do
            echo "Downloading ${targets[$i]}"
            curl -L --fail --silent --show-error "${urls[$i]}" -o "${targets[$i]}"
            size="$(stat -c%s "${targets[$i]}")"
            if [ "$size" -lt 80000 ]; then
              echo "Downloaded JPEG is unexpectedly small: ${targets[$i]} ($size bytes)"
              exit 1
            fi
            file "${targets[$i]}" | grep -qiE 'JPEG|image data' || {
              echo "Downloaded file is not a JPEG image: ${targets[$i]}"
              exit 1
            }
          done

          rm -f             public/images/projects/odkb-novyy-korpus-1.webp             public/images/projects/odkb-novyy-korpus-2.webp             public/images/projects/odkb-novyy-korpus-3.webp

      - name: Commit higher-quality files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/odkb-novyy-korpus-1.jpg
          git add public/images/projects/odkb-novyy-korpus-2.jpg
          git add public/images/projects/odkb-novyy-korpus-3.jpg
          git add -u public/images/projects/odkb-novyy-korpus-*.webp
          if git diff --cached --quiet; then
            echo "No ODKB photo changes to commit."
            exit 0
          fi
          git commit -m "Replace compressed ODKB photos with JPEG masters"
          git push origin HEAD:main
