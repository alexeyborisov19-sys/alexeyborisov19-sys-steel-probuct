name: Audit PD admin readiness

on:
  push:
    paths:
      - '.github/workflows/install-audit-pd-admin-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Check prerequisites without enabling anything
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          ENV_FILE="$APP_PATH/.env.production"

          check_key() {
            key="$1"
            if grep -q "^\${key}=." "$ENV_FILE"; then
              echo "\${key}=present"
            else
              echo "\${key}=missing"
            fi
          }

          for key in PD_SEARCH_HMAC_KEY PD_SESSION_HASH_KEY PD_AUDIT_CHAIN_KEY PD_ADMIN_DB_PATH PD_EXPORT_PATH; do
            check_key "$key"
          done

          DB_PATH="$(sed -n 's/^PD_ADMIN_DB_PATH=//p' "$ENV_FILE" | head -n1)"
          if [ -z "$DB_PATH" ]; then DB_PATH="/var/lib/steelprodukt/admin/personal-data.sqlite"; fi
          if [ -f "$DB_PATH" ]; then
            echo "PD_ADMIN_DB_FILE=present"
            python3 - "$DB_PATH" <<'PY'
          import sqlite3, sys
          path=sys.argv[1]
          con=sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              tables={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
              print("PD_USERS_TABLE=" + ("present" if "users" in tables else "missing"))
              if "users" in tables:
                  total=con.execute("select count(*) from users").fetchone()[0]
                  active=con.execute("select count(*) from users where is_active=1").fetchone()[0]
                  print(f"PD_USERS_TOTAL={total}")
                  print(f"PD_USERS_ACTIVE={active}")
          finally:
              con.close()
          PY
          else
            echo "PD_ADMIN_DB_FILE=missing"
          fi

          if grep -q '^PD_ADMIN_ENABLED=true$' "$ENV_FILE"; then
            echo "PD_ADMIN_ENABLED=true"
          else
            echo "PD_ADMIN_ENABLED=false"
          fi
          REMOTE
