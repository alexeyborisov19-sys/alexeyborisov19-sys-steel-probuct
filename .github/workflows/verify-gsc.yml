name: Verify GSC service account
on:
  push:
    branches: [audit/gsc-connection-20261004]
    paths: [.github/workflows/verify-gsc.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install --quiet google-auth requests
      - name: Check service account and Search Console API
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          try:
            info=json.loads(os.environ.get('GSC_SERVICE_ACCOUNT_JSON',''))
            assert info.get('client_email')=='steelprodukt-gsc@steelprodukt-seo.iam.gserviceaccount.com'
            assert info.get('token_uri')=='https://oauth2.googleapis.com/token'
            credentials=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/webmasters'])
            session=AuthorizedSession(credentials)
            r=session.get('https://www.googleapis.com/webmasters/v3/sites',timeout=30)
            print('GSC_SA_HTTP='+str(r.status_code))
            r.raise_for_status()
            matches=[s for s in r.json().get('siteEntry',[]) if s.get('siteUrl')=='https://www.steelprodukt.ru/']
            print('GSC_SA_ACCESS='+json.dumps(matches))
            assert matches,'Property unavailable'
            from urllib.parse import quote
            r=session.get('https://www.googleapis.com/webmasters/v3/sites/'+quote(matches[0]['siteUrl'],safe='')+'/sitemaps',timeout=30)
            print('GSC_SA_SITEMAPS_HTTP='+str(r.status_code))
            r.raise_for_status()
            print('GSC_SA_CHECK=SUCCESS')
          except Exception as e:
            print('GSC_SA_CHECK=FAILED type='+type(e).__name__)
            sys.exit(1)
          PY
