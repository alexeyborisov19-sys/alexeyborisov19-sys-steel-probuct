name: Read Google search evidence
on:
  push:
    branches: [audit/gsc-connection-20261004]
    paths: [.github/workflows/verify-gsc.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python3 -m pip install --quiet google-auth requests
      - name: Read priority Google index evidence first
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,collections,concurrent.futures
          from urllib.parse import quote,urlparse
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          SITE='https://www.steelprodukt.ru/'
          info=json.loads(os.environ['GSC_SERVICE_ACCOUNT_JSON'])
          assert info.get('type')=='service_account'
          assert info.get('project_id')=='steelprodukt-seo'
          assert info.get('client_email')=='steelprodukt-gsc@steelprodukt-seo.iam.gserviceaccount.com'
          assert info.get('token_uri')=='https://oauth2.googleapis.com/token'
          credentials=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/webmasters.readonly'])
          google=AuthorizedSession(credentials)
          base='https://www.googleapis.com/webmasters/v3/sites/'+quote(SITE,safe='')
          r=google.get(base,timeout=(8,25));r.raise_for_status()
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'priority-commercial-urls','property':SITE,'auth':{'http':r.status_code,'project':info['project_id'],'account':info['client_email'],'property':r.json()},'inspections':[],'technical':[]}
          print('GSC_PRIORITY AUTH '+json.dumps(report['auth'],ensure_ascii=False),flush=True)
          paths=['','products','production','services','customers','customers/requirements','customers/materials','customers/order-and-delivery','tools','products/akvilon','products/metallokassety/bim','products/metallokassety','production/gibka-listovogo-metalla','production/svarka-i-sborka-metalloizdeliy','products/korziny-dlya-konditsionerov','products/metallicheskie-korpusa','products/metallokassety-premium','contacts']
          def inspect(path):
              item={'url':SITE+path,'path':'/'+path}
              try:
                  with AuthorizedSession(credentials) as session:
                      response=session.post('https://searchconsole.googleapis.com/v1/urlInspection/index:inspect',json={'inspectionUrl':item['url'],'siteUrl':SITE,'languageCode':'ru-RU'},timeout=(8,25))
                  item['http']=response.status_code
                  if response.ok:
                      result=response.json().get('inspectionResult',{})
                      item['index']=result.get('indexStatusResult',{})
                      item['richResults']=result.get('richResultsResult',{})
                      item['inspectionResultLink']=result.get('inspectionResultLink')
                  else:item['error']=response.json().get('error',{}).get('message','API error')
              except Exception as exc:item['error']=type(exc).__name__
              print('GSC_PRIORITY INDEX '+json.dumps(item,ensure_ascii=False),flush=True)
              return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              report['inspections']=list(pool.map(inspect,paths))
          try:
              r=google.get(base+'/sitemaps',timeout=(8,25))
              report['googleSitemaps']={'http':r.status_code,'response':r.json()}
          except Exception as exc:report['googleSitemaps']={'error':type(exc).__name__}
          report['summary']={'inspected':len(report['inspections']),'apiErrors':sum(x.get('http')!=200 for x in report['inspections']),'verdicts':dict(collections.Counter(x.get('index',{}).get('verdict','API_ERROR') for x in report['inspections']))}
          with open('gsc-audit.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print('GSC_PRIORITY SUMMARY '+json.dumps(report['summary'],ensure_ascii=False),flush=True)
          print('GSC_PRIORITY SITEMAPS '+json.dumps(report['googleSitemaps'],ensure_ascii=False),flush=True)
          PY
      - name: Check live priority pages with bounded timeouts
        if: success()
        run: |
          python3 - <<'PY'
          import json,concurrent.futures,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import requests
          with open('gsc-audit.json',encoding='utf-8') as f:report=json.load(f)
          SITE=report['property']
          class Signals(HTMLParser):
              def __init__(self):super().__init__();self.canonical=[];self.robots=[];self.title='';self.in_title=False
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='link' and 'canonical' in a.get('rel','').lower().split():self.canonical.append(a.get('href',''))
                  if t=='meta' and a.get('name','').lower() in ['robots','googlebot']:self.robots.append(a.get('content',''))
                  if t=='title':self.in_title=True
              def handle_endtag(self,t):
                  if t=='title':self.in_title=False
              def handle_data(self,data):
                  if self.in_title:self.title+=data
          def check(u):
              d={'url':u,'path':urlparse(u).path}
              try:
                  r=requests.get(u,timeout=(4,9),allow_redirects=False,headers={'User-Agent':'SteelproduktReadOnlySEOAudit/1.0'})
                  d.update({'http':r.status_code,'location':r.headers.get('Location'),'xRobotsTag':r.headers.get('X-Robots-Tag'),'contentType':r.headers.get('Content-Type')})
                  if r.status_code==200 and 'text/html' in r.headers.get('Content-Type',''):
                      p=Signals();p.feed(r.text);d.update({'canonical':p.canonical,'robots':p.robots,'title':p.title})
                  if u.endswith('/robots.txt'):d['body']=r.text[:12000]
                  if u.endswith('/sitemap.xml') and r.ok:
                      root=ET.fromstring(r.content);d['urls']=[e.text.strip() for e in root.findall('{*}url/{*}loc') if e.text];d['urlCount']=len(d['urls'])
              except Exception as exc:d['error']=type(exc).__name__
              return d
          urls=[x['url'] for x in report['inspections']]+[SITE+'robots.txt',SITE+'sitemap.xml','https://steelprodukt.ru/','http://steelprodukt.ru/','https://saquapequoke.beget.app/products/metallokassety']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:report['technical']=list(pool.map(check,urls))
          for d in report['technical']:print('GSC_PRIORITY LIVE '+json.dumps({k:v for k,v in d.items() if k!='urls'},ensure_ascii=False),flush=True)
          with open('gsc-audit.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          with open('gsc-summary.json','w',encoding='utf-8') as f:json.dump(report['summary'],f,ensure_ascii=False,indent=2)
          PY
      - name: Save read-only evidence even if public crawl fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-index-audit
          path: |
            gsc-audit.json
            gsc-summary.json
          retention-days: 7
          if-no-files-found: warn
