name: Publish to Beget

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.agents/**'
      - '.codex/**'
      - '.claude/**'
      - '.claude-flow/**'
      - '.mcp.json'
      - 'AGENTS.md'
      - '.github/workflows/install-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelprodukt-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish website
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v5

      - name: Verify deployable source
        run: |
          test -f package.json
          test -f ecosystem.config.cjs
          test -d app

      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Upload current website version
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "mkdir -p '$BEGET_APP_PATH'"
          rsync -az --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.claude/' \
            --exclude='.claude-flow/' \
            --exclude='.mcp.json' \
            --exclude='AGENTS.md' \
            --exclude='.data/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --include='.env.example' \
            --exclude='.env*' \
            --exclude='public/video/company-film-flat.mp4' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p $BEGET_SSH_PORT" \
            ./ "$BEGET_USER@$BEGET_HOST:$BEGET_APP_PATH/"

      - name: Build and restart application on Beget
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH"
          test -f "$APP_PATH/package.json" || {
            echo "package.json was not uploaded to $APP_PATH"
            exit 1
          }
          chown -R nodejs:nodejs "$APP_PATH"
          bash "$APP_PATH/deploy/prepare-production.sh" "$APP_PATH" nodejs
          sudo -iu nodejs bash "$APP_PATH/deploy/build-and-restart.sh" "$APP_PATH"
          REMOTE