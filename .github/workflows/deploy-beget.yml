name: Publish to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelprodukt-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish website
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Upload current website version
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "mkdir -p '$BEGET_APP_PATH'"
          rsync -az --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env*' \
            --exclude='public/video/company-film-flat.mp4' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p $BEGET_SSH_PORT" \
            ./ "$BEGET_USER@$BEGET_HOST:$BEGET_APP_PATH/"

      - name: Upload protected mail settings
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          UNISENDER_API_KEY: ${{ secrets.UNISENDER_API_KEY }}
        run: |
          test -n "$UNISENDER_API_KEY"
          umask 077
          cat > .env.production <<'ENVFILE'
          SMTP_HOST=smtp.go2.unisender.ru
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=8283614
          SMTP_FROM="Сталь Продукт <info@steelprodukt.ru>"
          QUOTE_RECIPIENT=info@steelprodukt.ru
          ENVFILE
          printf 'SMTP_PASSWORD=%s\n' "$UNISENDER_API_KEY" >> .env.production
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" .env.production "$BEGET_USER@$BEGET_HOST:$BEGET_APP_PATH/.env.production"
          rm -f .env.production
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "chown nodejs:nodejs '$BEGET_APP_PATH/.env.production' && chmod 600 '$BEGET_APP_PATH/.env.production'"

      - name: Build and restart application on Beget
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          test -n "$APP_PATH"
          test -f "$APP_PATH/package.json" || {
            echo "package.json was not uploaded to $APP_PATH"
            exit 1
          }
          chown -R nodejs:nodejs "$APP_PATH"
          sudo -iu nodejs bash -lc "cd '$APP_PATH' && npm install && npm run build && pm2 startOrReload ecosystem.config.cjs --env production --update-env && pm2 save"
          REMOTE
