name: Quote release preflight

on:
  push:
    branches: [fix/quote-engine-dialog-safety-20260921]
    paths: [.github/workflows/quote-release-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
      - name: Inspect configuration presence only
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/package.json');
          require('@next/env').loadEnvConfig(process.cwd(), false);
          const e = process.env;
          const present = key => Boolean(e[key]?.trim());
          const model = e.YANDEX_AI_MODEL_URI || '';
          const exists = key => present(key) && fs.existsSync(e[key]);
          const commitPath = '.next/BUILD_COMMIT';
          const commit = fs.existsSync(commitPath) ? fs.readFileSync(commitPath, 'utf8').trim() : '';
          // Only booleans and the public release SHA leave this machine.
          console.log(JSON.stringify({
            release: /^[a-f0-9]{40}$/.test(commit) ? commit : null,
            aiEnabled: e.YANDEX_AI_ENABLED === 'true',
            aiKeyPresent: present('YANDEX_AI_API_KEY'),
            aiFolderPresent: present('YANDEX_AI_FOLDER_ID'),
            aiModelPresent: Boolean(model),
            aiModelFloating: /\/(?:latest|rc)(?:$|[/?])/i.test(model),
            aiEndpointConfigured: present('YANDEX_AI_ENDPOINT'),
            aiReviewExplicitlyDisabled: e.STEEL_PRODUCT_QUOTE_AI_REVIEW_REQUIRED === 'false',
            marketSearchEnabled: e.STEEL_PRODUCT_MARKET_SEARCH_ENABLED === 'true',
            searchKeyPresent: present('YANDEX_SEARCH_API_KEY'),
            searchFolderPresent: present('YANDEX_SEARCH_FOLDER_ID'),
            marketReferencePresent: exists('STEEL_PRODUCT_MARKET_REFERENCE_FILE'),
            privateReportRootPresent: exists('STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT'),
            bitrixEnabled: e.BITRIX24_ENABLED === 'true' || e.STEEL_PRODUCT_BITRIX_ENABLED === 'true',
            bitrixWebhookPresent: present('BITRIX24_WEBHOOK_URL') || present('BITRIX_WEBHOOK_URL') || present('STEEL_PRODUCT_BITRIX_WEBHOOK_URL')
          }));
          NODE
          REMOTE
