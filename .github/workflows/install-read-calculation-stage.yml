name: Read safe calculation stage trace

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-read-calculation-stage.yml'

permissions:
  contents: read

jobs:
  read-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Read latest safe stage markers
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -iu nodejs bash -lc 'pm2 logs steelprodukt --nostream --lines 500 2>/dev/null' \
            | grep '"event":"online_calc_stage"' \
            | sed -n 's/.*"stage":"\([A-Z_]*\)".*/STAGE=\1/p' \
            | tail -n 30
          REMOTE
