name: Import Kutuzova 12/1 photos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-kutuzova-12-1.yml'

permissions:
  contents: write

jobs:
  import:
    name: Import supplied Kutuzova photos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download supplied photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/projects

          urls=(
            "https://at.adobe.com/ejcAH7PMaLLKGf1b"
            "https://at.adobe.com/NMVZf0yz1BD70XJn"
            "https://at.adobe.com/fNbzEKoSXzwuT0ct"
          )
          targets=(
            "public/images/projects/kutuzova-12-1-1.jpg"
            "public/images/projects/kutuzova-12-1-2.jpg"
            "public/images/projects/kutuzova-12-1-3.jpg"
          )

          for i in 0 1 2; do
            echo "Downloading ${targets[$i]}"
            curl -L --fail --silent --show-error "${urls[$i]}" -o "${targets[$i]}"
            size="$(stat -c%s "${targets[$i]}")"
            if [ "$size" -lt 100000 ]; then
              echo "Downloaded photo is unexpectedly small: ${targets[$i]} ($size bytes)"
              exit 1
            fi
            file "${targets[$i]}" | grep -qiE 'JPEG|image data' || {
              echo "Downloaded file is not a JPEG image: ${targets[$i]}"
              exit 1
            }
          done

      - name: Commit imported photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/kutuzova-12-1-*.jpg
          if git diff --cached --quiet; then
            echo "No Kutuzova photo changes to commit."
            exit 0
          fi
          git commit -m "Add Kutuzova 12/1 project photos"
          git push origin HEAD:main
