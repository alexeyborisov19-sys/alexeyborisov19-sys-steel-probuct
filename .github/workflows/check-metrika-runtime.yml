name: Check Metrika production runtime

on:
  push:
    branches:
      - verify/metrika-live-20260921
    paths:
      - '.github/workflows/check-metrika-runtime.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical counter through Metrika API
        env:
          TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"

          curl -fsS \
            -H "Authorization: OAuth $TOKEN" \
            -H "Accept: application/json" \
            "https://api-metrika.yandex.net/management/v1/counter/112542227?field=counter_flags" \
            > /tmp/counter.json

          curl -fsS -G \
            -H "Authorization: OAuth $TOKEN" \
            -H "Accept: application/json" \
            --data-urlencode "ids=112542227" \
            --data-urlencode "metrics=ym:s:visits,ym:s:users,ym:s:pageviews" \
            --data-urlencode "date1=7daysAgo" \
            --data-urlencode "date2=today" \
            --data-urlencode "accuracy=1" \
            "https://api-metrika.yandex.net/stat/v1/data" \
            > /tmp/stats.json

          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/counter.json')).get('counter',{})
          s=json.load(open('/tmp/stats.json'))
          print("COUNTER="+json.dumps({
            "id":c.get("id"),
            "name":c.get("name"),
            "site":c.get("site"),
            "status":c.get("status"),
            "code_status":c.get("code_status"),
            "activity_status":c.get("activity_status"),
            "create_time":c.get("create_time"),
            "type":c.get("type"),
            "counter_flags":c.get("counter_flags"),
            "webvisor":c.get("webvisor"),
          },ensure_ascii=False))
          totals=s.get("totals") or []
          print("LAST_7_DAYS="+json.dumps({
            "visits": totals[0] if len(totals)>0 else None,
            "users": totals[1] if len(totals)>1 else None,
            "pageviews": totals[2] if len(totals)>2 else None,
          },ensure_ascii=False))
          PY

      - name: Verify active production build contains canonical counter
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          env_counter="$(sed -n 's/^NEXT_PUBLIC_YM_COUNTER_ID=//p' "$APP_PATH/.env.production" | tail -n1 | tr -d '\r\"' | tr -d "'")"
          env_webvisor="$(sed -n 's/^NEXT_PUBLIC_YM_WEBVISOR=//p' "$APP_PATH/.env.production" | tail -n1 | tr -d '\r\"' | tr -d "'")"
          echo "PRODUCTION_ENV_COUNTER=$env_counter"
          echo "PRODUCTION_ENV_WEBVISOR=$env_webvisor"

          if grep -rqF "112542227" "$APP_PATH/.next/static"; then
            echo "ACTIVE_BUNDLE_CANONICAL_COUNTER=present"
          else
            echo "ACTIVE_BUNDLE_CANONICAL_COUNTER=missing"
            exit 1
          fi

          for legacy in 111263638 112129777; do
            if grep -rqF "$legacy" "$APP_PATH/.next/static"; then
              echo "LEGACY_COUNTER_$legacy=present"
              exit 1
            else
              echo "LEGACY_COUNTER_$legacy=absent"
            fi
          done

          printf 'ACTIVE_BUILD_COMMIT='
          cat "$APP_PATH/.next/BUILD_COMMIT" 2>/dev/null || true
          echo
          REMOTE
