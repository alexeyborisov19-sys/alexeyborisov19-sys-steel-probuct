name: Fix assistant surface-preparation routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-sync-surface-preparation-facts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Route cleaning requests before generic laser cutting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data/assistant-knowledge.ts')
          text = path.read_text()
          generic = '  if (includesAny(text, ["лазер", "раскрой", "резк"])) {\n'
          branch = (
              '  if (includesAny(text, ["лазерная чист", "лазерная очист", "дробест", "очистк поверхности", "подготовк поверхности"])) {\n'
              '    return `${productionEquipment.powderCoatingBooths} камеры порошковой окраски; доступны дробеструйная и лазерная очистка поверхности. Конкретный способ подготовки выбираем по материалу, состоянию изделия и следующей технологической операции. Укажите материал, состояние поверхности и габариты изделия.`;\n'
              '  }\n\n'
          )
          if branch not in text:
              if text.count(generic) != 1:
                  raise SystemExit('Expected one generic laser-cutting branch')
              text = text.replace(generic, branch + generic, 1)
          if text.index(branch) > text.index(generic):
              raise SystemExit('Surface-preparation branch must precede generic laser cutting')
          path.write_text(text)
          PY

      - name: Commit assistant routing fix
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'data/assistant-knowledge.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: route cleaning requests before laser cutting"
          git push origin HEAD:main
