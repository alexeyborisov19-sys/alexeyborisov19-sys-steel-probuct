name: Diagnose mail transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
      - name: Read mail transport errors from all application workers
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "sudo -iu nodejs bash -lc 'for file in ~/.pm2/logs/steelprodukt-error-*.log; do echo --- \$file ---; tail -n 40 \$file; done'"
