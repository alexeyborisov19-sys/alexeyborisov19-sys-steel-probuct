name: Apply reviewed acquisition negative phrases
on:
  push:
    branches: [audit/acquisition-evidence-20260929]
    paths: [.github/workflows/acquisition-query-cleanup.yml]
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Append reviewed negatives; preserve budgets and serving state
        env:
          YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
          YD_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          additions={
            5798460265:['установка отливов','установка откосов'],
            5798460266:['установка кондиционера','блок наружный сплит системы 1u18ds1eaa haier'],
            5798460275:['порошковая краска купить'],
            5798460272:['как сварить двухскатные фермы']
          }
          headers={'Authorization':'Bearer '+os.environ['YD_TOKEN'].removeprefix('OAuth ').removeprefix('Bearer ').strip(),'Content-Type':'application/json','Client-Login':os.environ['YD_CLIENT_LOGIN']}
          def api(resource,method,params):
              req=urllib.request.Request('https://api.direct.yandex.com/json/v501/'+resource,data=json.dumps({'method':method,'params':params}).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              if data.get('error'): raise RuntimeError(json.dumps(data['error']))
              return data['result']
          def campaign():
              return api('campaigns','get',{'SelectionCriteria':{'Ids':[714391927]},'FieldNames':['Id','State','DailyBudget'],'UnifiedCampaignFieldNames':['BiddingStrategy']})['Campaigns']
          before=campaign()
          assert len(before)==1 and before[0]['State']=='ON', 'Campaign is not active; no mutation'
          def groups():
              return api('adgroups','get',{'SelectionCriteria':{'Ids':list(additions)},'FieldNames':['Id','CampaignId','Name','Status','NegativeKeywords']})['AdGroups']
          initial=groups(); assert len(initial)==len(additions)
          updates=[]
          for g in initial:
              assert g['CampaignId']==714391927 and g['Status']=='ACCEPTED'
              old=(g.get('NegativeKeywords') or {}).get('Items',[])
              new=list(dict.fromkeys(old+additions[g['Id']]))
              print('BEFORE',json.dumps(g,ensure_ascii=False))
              if new!=old: updates.append({'Id':g['Id'],'NegativeKeywords':{'Items':new}})
          if updates:
              result=api('adgroups','update',{'AdGroups':updates})
              print('UPDATE',json.dumps(result,ensure_ascii=False))
              assert not any(x.get('Errors') for x in result['UpdateResults'])
          after=groups()
          for g in after: assert set(additions[g['Id']]).issubset(set(g['NegativeKeywords']['Items']))
          assert campaign()==before, 'Unexpected campaign setting change'
          print('VERIFIED: reviewed negatives persisted; campaign budget, bidding and state unchanged')
          PY
