name: Temporary Steel Product calculation diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tmp-steel-product-calculation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Isolated confidential calculation path
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v5

      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Copy staged calculator to temporary path
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" \
            lib/server/instant-quote/run-confidential-calculation.ts \
            "$BEGET_USER@$BEGET_HOST:/tmp/run-confidential-calculation.diag.ts"

      - name: Run synthetic calculation without touching production reports
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          set -a
          . ./.env.production
          set +a

          DIAG_ROOT="$(mktemp -d /tmp/steelprodukt-calc-diag.XXXXXX)"
          REPORT_ROOT="$DIAG_ROOT/reports"
          STUB_MODULES="$DIAG_ROOT/node_modules"
          trap 'rm -rf "$DIAG_ROOT" /tmp/run-confidential-calculation.diag.ts /tmp/calc-diag-runner.mjs' EXIT

          install -d -m 0700 -o nodejs -g nodejs "$REPORT_ROOT"
          install -d -m 0755 "$STUB_MODULES/server-only"
          printf 'module.exports = {};\n' > "$STUB_MODULES/server-only/index.js"
          chmod 0644 "$STUB_MODULES/server-only/index.js"

          chown nodejs:nodejs /tmp/run-confidential-calculation.diag.ts
          chmod 0600 /tmp/run-confidential-calculation.diag.ts
          sed -i '/^import "server-only";/d' /tmp/run-confidential-calculation.diag.ts

          cat > /tmp/calc-diag-runner.mjs <<'NODE'
          import { runConfidentialCalculationForClient } from '/tmp/run-confidential-calculation.diag.ts';

          const now = new Date();
          const timestamp = now.toISOString();
          const project = {
            id: 'diag-calculation-runtime',
            title: 'Safe runtime diagnostic',
            createdAt: timestamp,
            updatedAt: timestamp,
            activePartId: 'smoke-part',
            parts: [{
              id: 'smoke-part',
              fileName: 'diag.dxf',
              fileSizeBytes: 1,
              format: 'dxf',
              createdAt: timestamp,
              state: 'configurable',
              geometry: {
                widthMm: 100,
                heightMm: 100,
                areaMm2: 10000,
                blankAreaMm2: 10000,
                cutLengthMm: 400,
                contourCount: 1,
                pierceCount: 1,
                bendCount: 0,
              },
              configuration: {
                materialId: 'zinc',
                thicknessMm: 1,
                quantity: 1,
                operations: ['laser-cutting'],
              },
              quote: { kind: 'not-requested' },
            }],
          };

          try {
            const result = await runConfidentialCalculationForClient(
              project,
              { 'smoke-part': { unsupportedEntities: [] } },
              { internalNotes: ['safe synthetic runtime diagnostic'] },
              now,
            );
            const part = result.parts[0];
            const ok = part?.status === 'ready'
              && part?.price?.status === 'approved'
              && typeof part.price.totalRub === 'number'
              && part.price.totalRub > 0;
            console.log(JSON.stringify({
              event: 'diag_result',
              ok,
              partStatus: part?.status ?? null,
              priceStatus: part?.price?.status ?? null,
              positiveApprovedPrice: Boolean(ok),
            }));
            if (!ok) process.exit(1);
          } catch (error) {
            const message = error instanceof Error ? error.message : '';
            let code = 'CALCULATION_RUNTIME';
            if (message.includes('STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH')) code = 'PRIVATE_BASIS_CONFIG';
            else if (message.includes('Invalid private calculation basis')) code = 'PRIVATE_BASIS_INVALID';
            else if (/STEEL_PRODUCT_(?:METAL_MULTIPLIER|DRAW_PCT|FINAL_PCT|FIXED_ADD_RUB|FIXED_ADD_ENABLED|ROUND_STEP_RUB)/.test(message)) code = 'PRIVATE_PRICING_CONFIG';
            else if (message.includes('STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT')) code = 'PRIVATE_REPORT_CONFIG';
            else if (/EACCES|EPERM|permission denied/i.test(message)) code = 'PRIVATE_STORAGE_ACCESS';
            else if (/ENOENT|no such file or directory/i.test(message)) code = 'PRIVATE_STORAGE_MISSING';
            else if (/server-only/i.test(message)) code = 'SERVER_MODULE_BOUNDARY';
            else if (/report/i.test(message) && /write|rename|mkdir|chmod/i.test(message)) code = 'PRIVATE_REPORT_WRITE';
            console.log(JSON.stringify({ event: 'diag_result', ok: false, code }));
            process.exit(1);
          }
          NODE
          chown nodejs:nodejs /tmp/calc-diag-runner.mjs
          chmod 0600 /tmp/calc-diag-runner.mjs

          sudo -iu nodejs env \
            NODE_PATH="$STUB_MODULES" \
            STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH="$STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH" \
            STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT="$REPORT_ROOT" \
            STEEL_PRODUCT_METAL_MULTIPLIER="$STEEL_PRODUCT_METAL_MULTIPLIER" \
            STEEL_PRODUCT_DRAW_PCT="$STEEL_PRODUCT_DRAW_PCT" \
            STEEL_PRODUCT_FINAL_PCT="$STEEL_PRODUCT_FINAL_PCT" \
            STEEL_PRODUCT_FIXED_ADD_RUB="$STEEL_PRODUCT_FIXED_ADD_RUB" \
            STEEL_PRODUCT_FIXED_ADD_ENABLED="$STEEL_PRODUCT_FIXED_ADD_ENABLED" \
            STEEL_PRODUCT_ROUND_STEP_RUB="$STEEL_PRODUCT_ROUND_STEP_RUB" \
            bash -lc "cd '$APP_PATH' && node --import tsx /tmp/calc-diag-runner.mjs"
          REMOTE
