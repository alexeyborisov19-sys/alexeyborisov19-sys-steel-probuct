name: Diagnose Steel Product Online runtime

on:
  push:
    branches:
      - feat/steel-product-online-clean-alpha-sep14
    paths:
      - .github/workflows/diagnose-online-order-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect active Next build and PM2
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          echo '--- APP PATH ---'
          pwd
          echo '--- BUILD COMMIT ---'
          cat .next/BUILD_COMMIT 2>/dev/null || echo '<missing>'
          echo
          echo '--- BUILD ID ---'
          cat .next/BUILD_ID 2>/dev/null || echo '<missing>'
          echo
          echo '--- CAD ROUTE IN ACTIVE MANIFEST ---'
          grep -F 'api/online-order/cad/analyze' .next/server/app-paths-manifest.json || true
          echo '--- CAD ROUTE FILE ---'
          ls -l .next/server/app/api/online-order/cad/analyze/route.js 2>/dev/null || true
          echo '--- PM2 PROCESS INFO ---'
          pm2 jlist | node - <<'NODE'
          let input='';
          process.stdin.on('data', c => input += c);
          process.stdin.on('end', () => {
            for (const p of JSON.parse(input)) {
              if (p.name !== 'steelprodukt') continue;
              console.log(JSON.stringify({
                name: p.name,
                pid: p.pid,
                status: p.pm2_env?.status,
                cwd: p.pm2_env?.pm_cwd,
                exec: p.pm2_env?.pm_exec_path,
                args: p.pm2_env?.args,
                node: p.pm2_env?.node_version,
                restart_time: p.pm2_env?.restart_time,
              }, null, 2));
            }
          });
          NODE
          echo '--- LOCAL ROUTE HEADERS ---'
          curl -sS -I http://127.0.0.1:3000/api/online-order/cad/analyze || true
          REMOTE
