name: Diagnose Steel Product Online runtime

on:
  push:
    branches:
      - feat/steel-product-online-clean-alpha-sep14
    paths:
      - .github/workflows/diagnose-online-order-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect active Next build and PM2
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          echo '--- APP PATH ---'
          pwd
          echo '--- BUILD COMMIT ---'
          cat .next/BUILD_COMMIT 2>/dev/null || echo '<missing>'
          echo
          echo '--- BUILD ID ---'
          cat .next/BUILD_ID 2>/dev/null || echo '<missing>'
          echo
          echo '--- CAD ROUTE IN ACTIVE MANIFEST ---'
          grep -F 'api/online-order/cad/analyze' .next/server/app-paths-manifest.json || true
          echo '--- CAD ROUTE FILE ---'
          ls -l .next/server/app/api/online-order/cad/analyze/route.js 2>/dev/null || true
          echo '--- PM2 PROCESS INFO ---'
          # The service belongs to nodejs. Keep stdin for JSON, not source code.
          sudo -iu nodejs pm2 jlist | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            try {
              const processes = JSON.parse(input);
              if (!Array.isArray(processes)) throw new Error("invalid snapshot");
              const p = processes.find(entry => entry?.name === "steelprodukt");
              if (!p) throw new Error("service missing");
              const env = p.pm2_env ?? {};
              console.log(JSON.stringify({
                name: p.name,
                pid: p.pid ?? null,
                status: env.status ?? null,
                node: env.node_version ?? null,
                rssBytes: p.monit?.memory ?? null,
                cpuPercent: p.monit?.cpu ?? null,
                restartCount: env.restart_time ?? null,
                memoryRestartLimitBytes: env.max_memory_restart ?? null,
                startedAtEpochMs: env.pm_uptime ?? null,
              }, null, 2));
            } catch {
              console.error("PM2_SNAPSHOT_UNAVAILABLE");
              process.exitCode = 1;
            }
          });
          '
          echo '--- LOCAL ROUTE HEADERS ---'
          curl -sS -I http://127.0.0.1:3000/api/online-order/cad/analyze || true
          REMOTE
