name: Diagnose Steel Product Online runtime

on:
  push:
    branches:
      - feat/steel-product-online-clean-alpha-sep14
    paths:
      - .github/workflows/diagnose-online-order-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect bounded PM2 memory evidence
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          date -u
          free -m
          sudo -iu nodejs bash -s <<'PM2READ'
          set -euo pipefail
          pm2 jlist | node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{for(const p of JSON.parse(s)){if(p.name!=="steelprodukt")continue; console.log(JSON.stringify({name:p.name,pid:p.pid,rss:p.monit?.memory,restart_count:p.pm2_env?.restart_time,max_memory_restart:p.pm2_env?.max_memory_restart,status:p.pm2_env?.status,uptime:p.pm2_env?.pm_uptime}));}});'
          python3 - <<'PYLOG'
          import pathlib,re
          p=pathlib.Path.home()/".pm2/pm2.log"
          if not p.exists():
              print("PM2 supervisor log unavailable")
          else:
              with p.open("rb") as f:
                  f.seek(0,2)
                  f.seek(max(0,f.tell()-1048576))
                  lines=f.read().decode("utf-8",errors="replace").splitlines()
              hits=[s for s in lines if re.search(r"memory|exceed|SIGKILL|SIGTERM|exited with code",s,re.I) and ("steelprodukt" in s or "memory" in s.lower())]
              for s in hits[-30:]: print(s[:800])
          PYLOG
          PM2READ
          REMOTE
