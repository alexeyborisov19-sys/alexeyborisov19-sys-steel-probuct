name: Optimize solution page images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-optimize-production-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Convert solution production images to Next Image
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          path = Path('components/SolutionDetailPage.tsx')
          text = path.read_text()

          if 'import Image from "next/image";' not in text:
              text = text.replace('import Link from "next/link";\n', 'import Image from "next/image";\nimport Link from "next/link";\n', 1)

          old = b64decode('').decode()
          new = b64decode('').decode()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one solution production image template, found {count}')
          text = text.replace(old, new, 1)

          if '<img' in text:
              raise SystemExit('Unexpected <img> remains in SolutionDetailPage')

          path.write_text(text)
          PY

      - name: Commit optimized solution component
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'components/SolutionDetailPage.tsx'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "perf: optimize solution production image delivery"
          git push origin HEAD:main
