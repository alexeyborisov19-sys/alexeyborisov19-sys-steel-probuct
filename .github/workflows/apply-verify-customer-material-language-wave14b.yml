name: Apply and verify customer material language wave14b

on:
  push:
    branches:
      - fix/customer-material-language-wave14b

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          ref: fix/customer-material-language-wave14b
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/.agents/
            !/.codex/
            !/.claude/
            !/.claude-flow/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply client-facing wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            Path('app/(public)/production/page.tsx'): [
              ('question: "Работаете с давальческим сырьём?"', 'question: "Работаете с материалом заказчика?"'),
              ('Другие материалы и давальческое сырьё принимаем после проверки марки, состояния и выбранной операции.', 'С другими материалами и металлом заказчика работаем после проверки марки, состояния и выбранной операции.'),
            ],
            Path('data/assistant-knowledge.ts'): [
              ('Давальческий материал принимаем после входного контроля.', 'С металлом заказчика работаем после входного контроля.'),
            ],
            Path('data/production-services.ts'): [
              ('Давальческий металл, единичные детали и партии.', 'Материал заказчика, единичные детали и партии.'),
              ('Давальческое сырьё проходит входной контроль до запуска в работу.', 'Металл заказчика проходит входной контроль до запуска в работу.'),
              ('question: "Можно выполнить заказ из давальческого металла?"', 'question: "Можно выполнить заказ из металла заказчика?"'),
              ('Состояние давальческого материала напрямую влияет на устойчивость режима, поэтому его проверяют до запуска.', 'Состояние материала заказчика напрямую влияет на устойчивость режима, поэтому его проверяют до запуска.'),
            ],
            Path('tests/semantic-seo.test.ts'): [
              ('assert.ok(laserCutting.faq.some((item) => /давальческого металла/i.test(item.question) && /входного контроля/i.test(item.answer)));', 'assert.ok(laserCutting.faq.some((item) => /металла заказчика/i.test(item.question) && /входного контроля/i.test(item.answer)));'),
            ],
          }

          for path, replacements in changes.items():
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              if old not in text:
                raise SystemExit(f'Expected source fragment not found in {path}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')

          test_path = Path('tests/semantic-seo.test.ts')
          test_text = test_path.read_text(encoding='utf-8')
          anchor = '  assert.match(assistantLaserAnswer, /1500 × 3000 мм/);\n'
          addition = '''  const visibleLaserCopy = [\n    laserCutting.description,\n    ...laserCutting.specifications?.flatMap((item) => [item.label, item.value, item.note]) ?? [],\n    ...laserCutting.faq.flatMap((item) => [item.question, item.answer]),\n    assistantLaserAnswer,\n  ].join(" ");\n  assert.doesNotMatch(visibleLaserCopy, /давальч/i);\n'''
          if addition not in test_text:
            if anchor not in test_text:
              raise SystemExit('Semantic SEO test anchor not found')
            test_text = test_text.replace(anchor, anchor + addition, 1)
            test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/production/page.tsx' data/assistant-knowledge.ts data/production-services.ts tests/semantic-seo.test.ts
          git commit -m "copy: use customer-material language in public copy"
          git push origin HEAD:fix/customer-material-language-wave14b
