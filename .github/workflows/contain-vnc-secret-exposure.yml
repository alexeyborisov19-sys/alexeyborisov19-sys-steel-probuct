name: Contain VNC secret exposure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contain:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Rotate local production secrets without disclosing values
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          env_file=/var/www/html/.env.production
          test -f "$env_file"
          test "$(stat -c '%a' "$env_file")" = 600
          grep -qx 'PD_ADMIN_ENABLED=false' "$env_file"

          set -a
          . "$env_file"
          set +a
          export PD_ADMIN_ENABLED=true

          sudo -iu nodejs env \
            PD_ADMIN_ENABLED=true \
            PD_ADMIN_DB_PATH="$PD_ADMIN_DB_PATH" \
            node --input-type=module <<'CHECK'
          import { DatabaseSync } from "node:sqlite";
          const database = new DatabaseSync(process.env.PD_ADMIN_DB_PATH, { readOnly: true });
          const counts = database.prepare(`
            SELECT
              (SELECT COUNT(*) FROM users) AS users,
              (SELECT COUNT(*) FROM sessions) AS sessions,
              (SELECT COUNT(*) FROM access_events) AS access_events
          `).get();
          database.close();
          if (Number(counts.users) !== 0 || Number(counts.sessions) !== 0 || Number(counts.access_events) !== 0) {
            throw new Error("Local administrative secrets cannot be rotated after administrative use");
          }
          console.log(JSON.stringify(counts));
          CHECK

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          containment_dir="/root/steelprodukt-vnc-containment-$stamp"
          install -m 700 -d "$containment_dir"
          install -m 600 "$env_file" "$containment_dir/.env.production.before"

          replace_environment_value() {
            key=$1
            replacement=$2
            temporary=$(mktemp "${env_file}.containment.XXXXXX")
            chmod 600 "$temporary"
            found=false
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "$key="*)
                  printf '%s=%s\n' "$key" "$replacement" >> "$temporary"
                  found=true
                  ;;
                *) printf '%s\n' "$line" >> "$temporary" ;;
              esac
            done < "$env_file"
            if [ "$found" != true ]; then
              printf '%s=%s\n' "$key" "$replacement" >> "$temporary"
            fi
            chown --reference="$env_file" "$temporary"
            mv "$temporary" "$env_file"
          }

          replace_environment_value IP_HASH_SALT "$(openssl rand -hex 32)"
          replace_environment_value CONSENT_AUDIT_SALT "$(openssl rand -hex 32)"
          replace_environment_value PD_SEARCH_HMAC_KEY "$(openssl rand -hex 32)"
          replace_environment_value PD_SESSION_HASH_KEY "$(openssl rand -hex 32)"
          replace_environment_value PD_AUDIT_CHAIN_KEY "$(openssl rand -hex 32)"

          current_version=$(sed -n 's/^PD_SEARCH_HMAC_KEY_VERSION=//p' "$env_file" | tail -1)
          case "$current_version" in
            ''|*[!0-9]*) current_version=1 ;;
          esac
          replace_environment_value PD_SEARCH_HMAC_KEY_VERSION "$((current_version + 1))"
          grep -qx 'PD_ADMIN_ENABLED=false' "$env_file"
          test "$(stat -c '%a' "$env_file")" = 600

          set -a
          . "$env_file"
          set +a
          test "${#IP_HASH_SALT}" -ge 64
          test "${#CONSENT_AUDIT_SALT}" -ge 64
          test "${#PD_SEARCH_HMAC_KEY}" -ge 64
          test "${#PD_SESSION_HASH_KEY}" -ge 64
          test "${#PD_AUDIT_CHAIN_KEY}" -ge 64
          test "$PD_ADMIN_ENABLED" = false

          external_rotation_required=false
          for key in SMTP_PASSWORD YANDEX_AI_API_KEY TELEGRAM_BOT_TOKEN; do
            value=$(sed -n "s/^${key}=//p" "$env_file" | tail -1)
            value=${value#\"}
            value=${value%\"}
            if [ -n "$value" ]; then
              printf '%s_external_rotation_required=true\n' "$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')"
              external_rotation_required=true
            fi
          done

          sudo -iu nodejs bash -se <<'NODEJS'
          set -Eeuo pipefail
          set -a
          . /var/www/html/.env.production
          set +a
          export PD_ADMIN_ENABLED=true
          cd /var/www/html
          npm run pd:sync-index -- --mode=full
          npm run pd:integrity-check
          npm run pd:audit-verify
          export PD_ADMIN_ENABLED=false
          pm2 restart steelprodukt --update-env
          pm2 save
          NODEJS

          test "$(systemctl is-active nginx)" = active
          test "$(sudo -iu nodejs pm2 pid steelprodukt | tr -d '[:space:]')" != 0
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/)" = 200
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 https://www.steelprodukt.ru/)" = 200
          grep -qx 'PD_ADMIN_ENABLED=false' "$env_file"

          printf '%s\n' \
            'local_secret_rotation=complete' \
            "pd_search_hmac_key_version=$PD_SEARCH_HMAC_KEY_VERSION" \
            "external_rotation_required=$external_rotation_required" \
            'saved_pd_admin_enabled=false' \
            'public_smoke=ok'
          REMOTE
