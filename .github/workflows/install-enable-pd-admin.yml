name: Enable PD admin

on:
  push:
    paths:
      - '.github/workflows/install-enable-pd-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Enable closed PD admin and restart production
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"

          for key in PD_SEARCH_HMAC_KEY PD_SESSION_HASH_KEY PD_AUDIT_CHAIN_KEY PD_ADMIN_DB_PATH PD_EXPORT_PATH; do
            grep -q "^${key}=." "$ENV_FILE" || {
              echo "Required PD admin configuration is missing: $key"
              exit 1
            }
          done

          DB_PATH="$(sed -n 's/^PD_ADMIN_DB_PATH=//p' "$ENV_FILE" | head -n1)"
          test -n "$DB_PATH"
          test -f "$DB_PATH"

          ACTIVE_USERS="$(python3 - "$DB_PATH" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          try:
              print(con.execute("select count(*) from users where is_active=1").fetchone()[0])
          finally:
              con.close()
          PY
          )"
          test "$ACTIVE_USERS" -ge 1

          cp -a "$ENV_FILE" "$ENV_FILE.bak-pd-admin-$(date +%Y%m%d%H%M%S)"
          ENV_TMP="$(mktemp "$APP_PATH/.env.production.XXXXXX")"
          trap 'rm -f "$ENV_TMP"' EXIT
          grep -v '^PD_ADMIN_ENABLED=' "$ENV_FILE" > "$ENV_TMP" || true
          printf '%s\n' 'PD_ADMIN_ENABLED=true' >> "$ENV_TMP"
          chown nodejs:nodejs "$ENV_TMP"
          chmod 0600 "$ENV_TMP"
          mv "$ENV_TMP" "$ENV_FILE"
          trap - EXIT

          cd "$APP_PATH"
          node --env-file="$ENV_FILE" --import tsx -e "import { readPdAdminConfig } from './lib/pd-admin/config.ts'; const c=readPdAdminConfig(process.env,{production:true,cwd:process.cwd()}); if(!c.enabled) process.exit(1); console.log('PD admin config valid.');"

          sudo -iu nodejs bash -lc "cd '$APP_PATH' && pm2 startOrReload ecosystem.config.cjs --env production --update-env && pm2 save"

          echo "PD_ADMIN_ENABLED=true"
          echo "PD_ACTIVE_USERS=$ACTIVE_USERS"
          REMOTE

      - name: Verify protected admin routes
        run: |
          set -euo pipefail

          LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' https://www.steelprodukt.ru/internal/personal-data/login)"
          MAIL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' https://www.steelprodukt.ru/internal/personal-data/mail)"

          echo "PD_LOGIN_HTTP=$LOGIN_CODE"
          echo "PD_MAIL_HTTP=$MAIL_CODE"

          case "$LOGIN_CODE" in
            200) ;;
            *) echo "Unexpected login page status"; exit 1 ;;
          esac

          case "$MAIL_CODE" in
            302|307|308) ;;
            *) echo "Mailbox route is not protected by authentication redirect"; exit 1 ;;
          esac
