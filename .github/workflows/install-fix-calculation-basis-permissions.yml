name: Fix private calculation basis permissions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-fix-calculation-basis-permissions.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Give only the application user access to private basis
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASIS_DIR=/var/lib/steelprodukt/production
          BASIS_FILE="$BASIS_DIR/calculation-basis.json"
          test -s "$BASIS_FILE"
          chown nodejs:nodejs "$BASIS_DIR" "$BASIS_FILE"
          chmod 700 "$BASIS_DIR"
          chmod 600 "$BASIS_FILE"
          sudo -iu nodejs test -r "$BASIS_FILE"
          echo "Private basis is readable only by application user."
          REMOTE
