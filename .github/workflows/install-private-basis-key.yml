name: Provision private calculation basis key

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-basis-key.yml'

permissions:
  contents: read

jobs:
  provision-key:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Create server-only encryption key
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          KEY_DIR=/var/lib/steelprodukt/private-basis
          PRIVATE_KEY="$KEY_DIR/decrypt.pem"
          install -m 700 -d "$KEY_DIR"
          if [ ! -s "$PRIVATE_KEY" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$PRIVATE_KEY" >/dev/null 2>&1
            chmod 600 "$PRIVATE_KEY"
          fi
          echo -n 'PUBLIC_KEY_B64='
          openssl pkey -in "$PRIVATE_KEY" -pubout 2>/dev/null | base64 -w0
          echo
          REMOTE
