name: Yandex search report (encrypted)

# Temporary, read-only. Runs only on this branch. Collects Webmaster + Metrika data
# with the repository secrets and commits it back ENCRYPTED (repo and logs are public).
on:
  push:
    branches:
      - claude/yandex-search-report
    paths:
      - ".github/workflows/yandex-search-report.yml"
      - ".yandex-report/collect.mjs"

permissions:
  contents: write

concurrency:
  group: yandex-search-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/yandex-search-report
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect Webmaster and Metrika data
        env:
          YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
          YW_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
        run: node .yandex-report/collect.mjs

      - name: Encrypt and commit the report
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/report.json -out .yandex-report/report.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey .yandex-report/report-public-key.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/k.txt -out .yandex-report/key.enc
          shred -u /tmp/k.txt /tmp/report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .yandex-report/report.enc .yandex-report/key.enc
          git commit -m "Encrypted Yandex search report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:claude/yandex-search-report
