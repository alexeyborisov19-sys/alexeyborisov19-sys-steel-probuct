name: Diagnose production TTS

on:
  push:
    branches:
      - diagnostic/tts-production-20260917

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Check local Piper prerequisites on production host
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "arch=$(uname -m)"
          echo "kernel=$(uname -s)"
          python3 --version
          python3 -m venv --help >/dev/null
          echo "venv=ok"
          command -v curl >/dev/null && echo "curl=ok"
          command -v ffplay >/dev/null && echo "ffplay=present" || echo "ffplay=missing"
          echo "memory_begin"
          free -m
          echo "memory_end"
          echo "disk_begin"
          df -h / /var/lib 2>/dev/null || df -h /
          echo "disk_end"
          python3 - <<'PY'
          import platform
          print('python_machine=' + platform.machine())
          print('python_version=' + platform.python_version())
          PY
          REMOTE
