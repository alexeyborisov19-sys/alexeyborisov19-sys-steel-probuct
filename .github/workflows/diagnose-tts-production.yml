name: Smoke-test production local TTS

on:
  push:
    branches:
      - diagnostic/tts-production-20260917

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production TTS endpoint
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          AUDIO="$(mktemp --suffix=.wav)"
          trap 'rm -f "$HEADERS" "$AUDIO"' EXIT
          HTTP_CODE="$(curl --silent --show-error \
            --output "$AUDIO" \
            --dump-header "$HEADERS" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://www.steelprodukt.ru' \
            --header 'Referer: https://www.steelprodukt.ru/' \
            --header 'Content-Type: application/json' \
            --data '{"text":"Проверка локального голоса инженера."}' \
            'https://www.steelprodukt.ru/api/assistant/tts')"
          test "$HTTP_CODE" = "200"
          grep -Eiq '^content-type:[[:space:]]*audio/wav' "$HEADERS"
          grep -Eiq '^x-tts-engine:[[:space:]]*local-piper' "$HEADERS"
          test "$(stat -c%s "$AUDIO")" -gt 44
          python3 - "$AUDIO" <<'PY'
          import sys, wave
          with wave.open(sys.argv[1], 'rb') as wav:
              assert wav.getnchannels() >= 1
              assert wav.getframerate() > 0
              assert wav.getnframes() > 0
              print(f"channels={wav.getnchannels()}")
              print(f"sample_rate={wav.getframerate()}")
              print(f"frames={wav.getnframes()}")
          PY
          echo "http=$HTTP_CODE"
          echo "bytes=$(stat -c%s "$AUDIO")"
          echo "SMOKE=production_local_piper_ok"
