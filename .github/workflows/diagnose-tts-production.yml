name: Diagnose production TTS

on:
  push:
    branches:
      - diagnostic/tts-production-20260917

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Test pinned local Piper voice on production host
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install --disable-pip-version-check --no-cache-dir 'piper-tts==1.8.0' >/dev/null
          MODEL="$WORK/ru_RU-dmitri-medium.onnx"
          CONFIG="$MODEL.json"
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ru/ru_RU/dmitri/medium'
          curl -fsSL "$BASE/ru_RU-dmitri-medium.onnx" -o "$MODEL"
          curl -fsSL "$BASE/ru_RU-dmitri-medium.onnx.json" -o "$CONFIG"
          printf '%s  %s\n' 'f073356ebc4bd0f80c5af58df2953a5988bd5bdab1eb38635ce960b071fbefcb' "$MODEL" | sha256sum -c -
          START="$(date +%s%3N)"
          "$WORK/venv/bin/python" - "$MODEL" "$WORK/test.wav" <<'PY'
          import sys, wave
          from piper import PiperVoice, SynthesisConfig
          model, out = sys.argv[1], sys.argv[2]
          voice = PiperVoice.load(model)
          with wave.open(out, 'wb') as wav:
              voice.synthesize_wav('Здравствуйте. Я инженер Сталь Продукт. Чем могу помочь?', wav, syn_config=SynthesisConfig(length_scale=1.04))
          PY
          END="$(date +%s%3N)"
          test -s "$WORK/test.wav"
          echo "piper_version=1.8.0"
          echo "voice=ru_RU-dmitri-medium@v1.0.0"
          echo "wav_bytes=$(stat -c%s "$WORK/test.wav")"
          echo "synthesis_ms=$((END-START))"
          echo "DIAGNOSIS=local_piper_ok"
          REMOTE
