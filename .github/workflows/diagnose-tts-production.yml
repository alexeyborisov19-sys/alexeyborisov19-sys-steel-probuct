name: Diagnose production Metrica

on:
  push:
    branches:
      - diagnostic/tts-production-20260917

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Verify production Metrica after restart
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          BUILD_DIR="$APP_PATH/.next/static"
          BUILD_COMMIT="$APP_PATH/.next/BUILD_COMMIT"
          EXPECTED_BUILD="c1c36c20f5e25eeffacbb58c47be2c25deb45285"

          counter="$(sed -n 's/^NEXT_PUBLIC_YM_COUNTER_ID=//p' "$ENV_FILE" | tail -n1 | tr -d '\r\n"' | tr -d "'")"
          webvisor="$(sed -n 's/^NEXT_PUBLIC_YM_WEBVISOR=//p' "$ENV_FILE" | tail -n1 | tr -d '\r\n"' | tr -d "'")"
          build_commit="$(cat "$BUILD_COMMIT")"

          canonical_files="$( (grep -rlF '112542227' "$BUILD_DIR" 2>/dev/null || true) | wc -l | tr -d ' ')"
          legacy_111263638="$( (grep -rlF '111263638' "$BUILD_DIR" 2>/dev/null || true) | wc -l | tr -d ' ')"
          legacy_112129777="$( (grep -rlF '112129777' "$BUILD_DIR" 2>/dev/null || true) | wc -l | tr -d ' ')"

          test "$counter" = "112542227"
          test "$webvisor" = "true"
          test "$build_commit" = "$EXPECTED_BUILD"
          test "$canonical_files" -gt 0
          test "$legacy_111263638" = "0"
          test "$legacy_112129777" = "0"

          echo "counter=112542227"
          echo "webvisor=true"
          echo "canonical_bundle_files=$canonical_files"
          echo "legacy_111263638_files=$legacy_111263638"
          echo "legacy_112129777_files=$legacy_112129777"
          echo "build_commit=$build_commit"
          echo "METRICA=production_consistent_after_restart"
          REMOTE
