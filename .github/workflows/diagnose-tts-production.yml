name: Smoke-test production AI engineer brand story

on:
  push:
    branches:
      - diagnostic/tts-production-20260917

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live brand story answer
        run: |
          set -euo pipefail
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT

          HTTP_CODE="$(curl --silent --show-error             --output "$RESPONSE"             --write-out '%{http_code}'             --request POST             --header 'Origin: https://www.steelprodukt.ru'             --header 'Referer: https://www.steelprodukt.ru/'             --header 'Content-Type: application/json'             --data '{"message":"Расскажите про Сталь Продукт","pathname":"/"}'             'https://www.steelprodukt.ru/api/assistant')"

          test "$HTTP_CODE" = "200"
          jq -e '.answer | contains("инженерно-производственный бренд")' "$RESPONSE" >/dev/null
          jq -e '.answer | contains("Мы начинаем не со станка, а с задачи")' "$RESPONSE" >/dev/null
          jq -e '.answer | contains("серийное и OEM-производство")' "$RESPONSE" >/dev/null
          jq -e '.answer | contains("Монтаж на объектах мы не выполняем")' "$RESPONSE" >/dev/null
          jq -e '.mode == "knowledge" or .mode == "ai"' "$RESPONSE" >/dev/null

          echo "http=$HTTP_CODE"
          echo "mode=$(jq -r '.mode' "$RESPONSE")"
          echo "answer_chars=$(jq -r '.answer | length' "$RESPONSE")"
          echo "BRAND_STORY=production_ok"
