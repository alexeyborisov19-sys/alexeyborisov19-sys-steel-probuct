name: Verify live upright BIM 2026-10-15
on:
  push:
    branches: ['audit/bim-upright-live-20261015']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://www.steelprodukt.ru
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm source under test is the successfully deployed release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '76a34669cfb9ca575fbc8e02656ad4fb9eb19ac8'
          echo "Audit branch parent matches the published main SHA."
      - name: Test live HTML, robots and static content checksums (read-only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, urllib.error
          base=os.environ["BASE"]
          paths=[
            "/products/metallokassety/bim",
            "/bim/metallokassety-parametric/index.html",
            "/bim/metallokassety-oriented/index.html",
            "/robots.txt",
            "/sitemap.xml"
          ]
          for path in paths:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"SteelProdukt-BIM-release-verify/1.0"}),timeout=35) as response:
                  body=response.read()
                  assert response.status==200,(path,response.status)
                  assert len(body)>200,(path,len(body))
                  if path.endswith("metallokassety/bim"): 
                      assert b'SP-CAS-01' in body
                      assert b'metallokassety-oriented' in body
                  print("PASS LIVE PAGE",path,len(body),flush=True)
          filenames=[]
          ids=["SP-CAS-01","SP-CAS-03","SP-CAS-05"]
          for model in ids:
              for folder in ["IFC4_coordination","IFC4_exact_geometry"]:
                  filenames.append(f"metallokassety-oriented/{folder}/{model}.ifc")
          filenames += [
              "metallokassety-oriented/index.html",
              "metallokassety-oriented/viewer.js",
              "metallokassety-oriented/viewer.css",
              "metallokassety-parametric/models.json",
              "metallokassety-parametric/app.mjs",
              "metallokassety-parametric/sizing.mjs",
          ]
          for file in filenames:
              local=pathlib.Path("public/bim")/file
              expected=hashlib.sha256(local.read_bytes()).hexdigest()
              url=base+"/bim/"+file
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"SteelProdukt-BIM-release-verify/1.0"}),timeout=35) as response:
                  body=response.read()
                  assert response.status==200,(url,response.status)
              observed=hashlib.sha256(body).hexdigest()
              assert observed==expected,(file,observed,expected)
              print("PASS LIVE SHA256",file,len(body),flush=True)
          print(f"PASS: {len(paths)} pages and {len(filenames)} release files.",flush=True)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Audit live BIM library, search, cards, source downloads and mobile
        run: BROWSER_AUDIT_BASE_URL=https://www.steelprodukt.ru node scripts/audit-cassette-library-page.mjs
      - name: Audit upright 3D gallery and 8 downloaded source IFCs (no form submissions)
        run: BIM_AUDIT_BASE_URL=https://www.steelprodukt.ru node scripts/audit-oriented-cassette-viewer.mjs
      - name: Audit parametric viewer, downloads, invalid input and canvas fallback
        run: BIM_AUDIT_BASE_URL=https://www.steelprodukt.ru BIM_SIZING_OUTPUT_DIR=artifacts/cassette-parametric-live node scripts/audit-cassette-parametric.mjs
      - name: Preserve external validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-bim-upright-2026-10-15
          path: |
            output/browser-audit/cassette-library
            artifacts/cassette-upright
            artifacts/cassette-parametric-live
          retention-days: 7
          if-no-files-found: ignore
