name: Clarify engineering calculation boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-clarify-engineering-calculation-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clarify structural calculation responsibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data/production-services.ts')
          text = path.read_text()
          replacements = [
              (
                  '"3D моделирование и инженерные расчёты",',
                  '"3D моделирование и подготовка КД",'
              ),
              (
                  '"Зависит от ответственности изделия. Для декоративных и защитных элементов обычно достаточно инженерной проработки и опытного образца. Для несущих конструкций, элементов, воспринимающих ветровую нагрузку, и изделий, отказ которых опасен, расчёт выполняет профильная проектная организация, а мы работаем по её заданию и обеспечиваем изготовление в соответствии с ним."',
                  '"Необходимость расчёта зависит от назначения изделия, действующих нагрузок и последствий отказа. Для несущих конструкций, элементов под ветровой или эксплуатационной нагрузкой и других ответственных изделий расчёт задаёт профильная проектная организация; мы проверяем технологичность и изготавливаем по согласованной КД и расчётным данным. Для остальных изделий состав инженерной проверки определяется проектом и техническим заданием."'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one engineering-boundary phrase, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          if '3D моделирование и инженерные расчёты' in text:
              raise SystemExit('Old engineering-calculation SEO claim remains')
          path.write_text(text)
          PY

      - name: Commit clarified calculation boundary
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'data/production-services.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: clarify engineering calculation responsibility"
          git push origin HEAD:main
