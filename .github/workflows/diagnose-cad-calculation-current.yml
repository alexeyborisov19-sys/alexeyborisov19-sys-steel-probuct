name: Diagnose current CAD calculation result

on:
  push:
    branches:
      - diagnose/cad-calculator-20260918
    paths:
      - .github/workflows/diagnose-cad-calculation-current.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit a valid millimetre DXF to production
        run: |
          set -euo pipefail
          cat > /tmp/diag.dxf <<'DXF'
          0
          SECTION
          2
          HEADER
          9
          $INSUNITS
          70
          4
          0
          ENDSEC
          0
          SECTION
          2
          ENTITIES
          0
          LWPOLYLINE
          8
          CUT
          90
          4
          70
          1
          10
          0
          20
          0
          10
          100
          20
          0
          10
          100
          20
          100
          10
          0
          20
          100
          0
          ENDSEC
          0
          EOF
          DXF
          cat > /tmp/manifest.json <<'JSON'
          {"title":"CAD calculation diagnostic","parts":[{"clientPartId":"diag-part","fileIndex":0,"materialId":"zinc","thicknessMm":1,"quantity":1,"operations":[],"operationInputs":{}}]}
          JSON
          HTTP_CODE="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            -H 'Origin: https://www.steelprodukt.ru' \
            -H 'Referer: https://www.steelprodukt.ru/online-order' \
            -F 'manifest=</tmp/manifest.json' \
            -F 'files=@/tmp/diag.dxf;type=application/dxf' \
            https://www.steelprodukt.ru/api/online-order/calculate)"
          echo "HTTP=$HTTP_CODE"
          jq '{ok,code,status:(.calculation.parts[0].status // null),price:(.calculation.parts[0].price // null),message:(.calculation.parts[0].message // .message // null)}' /tmp/response.json
          test "$HTTP_CODE" = "200"
