name: Diagnose PD login

on:
  push:
    paths:
      - '.github/workflows/install-diagnose-pd-login.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect login state without secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          DB_PATH="$(sed -n 's/^PD_ADMIN_DB_PATH=//p' "$ENV_FILE" | head -n1)"
          python3 - "$DB_PATH" <<'PY'
          import sqlite3, sys, datetime
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          try:
              row=con.execute("""
                select id, username, is_active, must_change_password,
                       failed_login_count, locked_until, password_changed_at, last_login_at
                from users where username='admin'
              """).fetchone()
              print("ADMIN_EXISTS=" + str(bool(row)).lower())
              if row:
                  print("ADMIN_ACTIVE=" + str(bool(row[2])).lower())
                  print("MUST_CHANGE_PASSWORD=" + str(bool(row[3])).lower())
                  print("FAILED_LOGIN_COUNT=" + str(row[4]))
                  print("LOCKED_UNTIL=" + str(row[5] or "none"))
                  print("PASSWORD_CHANGED_AT=" + str(row[6] or "none"))
                  print("LAST_LOGIN_AT=" + str(row[7] or "none"))
                  uid=row[0]
                  recent=con.execute("""
                    select attempted_at, success, coalesce(failure_reason,'SUCCESS')
                    from login_attempts
                    where user_id=?
                    order by attempted_at desc
                    limit 8
                  """,(uid,)).fetchall()
                  print("RECENT_USER_ATTEMPTS=" + str(len(recent)))
                  for attempted_at, success, reason in recent:
                      print("ATTEMPT=" + attempted_at + "|" + ("success" if success else "fail") + "|" + reason)
          finally:
              con.close()
          PY
          REMOTE
