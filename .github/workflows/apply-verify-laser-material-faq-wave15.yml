name: Apply and verify laser material FAQ wave15

on:
  push:
    branches:
      - copy/laser-material-faq-wave15

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          ref: copy/laser-material-faq-wave15
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/.agents/
            !/.codex/
            !/.claude/
            !/.claude-flow/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply FAQ cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('data/production-services.ts')
          text = service_path.read_text(encoding='utf-8')

          old_description = '`Лазерная резка чёрной стали ${laserCuttingCapabilities.thicknessRange} на столе ${laserCuttingCapabilities.tableWorkingArea} по DXF и чертежам. Материал заказчика, единичные детали и партии.`'
          new_description = '`Лазерная резка чёрной стали ${laserCuttingCapabilities.thicknessRange} на столе ${laserCuttingCapabilities.tableWorkingArea} по DXF и чертежам. Работаем с материалом заказчика, выполняем единичные детали и партии.`'
          if old_description not in text:
            raise SystemExit('Laser description source fragment not found')
          text = text.replace(old_description, new_description, 1)

          duplicate_block = '''      {
        question: "Можно выполнить заказ из металла заказчика?",
        answer: customerMaterialSummary,
      },
'''
          if duplicate_block not in text:
            raise SystemExit('Duplicate customer-material FAQ block not found')
          text = text.replace(duplicate_block, '', 1)

          old_answer = '''        answer:
          "Такой вариант возможен, его условия обсуждаются отдельно. Заранее нужно согласовать марку, фактическую толщину, состояние поверхности и плоскостность листа, а также порядок учёта остатков и деловых обрезков. Состояние материала заказчика напрямую влияет на устойчивость режима, поэтому его проверяют до запуска.",'''
          new_answer = '''        answer:
          `${customerMaterialSummary} Для лазерного раскроя заранее согласуем фактическую толщину, состояние поверхности и плоскостность листа, а также порядок учёта остатков и деловых обрезков.`,'''
          if old_answer not in text:
            raise SystemExit('Detailed customer-material FAQ answer not found')
          text = text.replace(old_answer, new_answer, 1)
          service_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/semantic-seo.test.ts')
          test_text = test_path.read_text(encoding='utf-8')
          old_assertion = '  assert.ok(laserCutting.faq.some((item) => /металла заказчика/i.test(item.question) && /входного контроля/i.test(item.answer)));\n'
          new_assertion = '''  const customerMaterialFaq = laserCutting.faq.filter((item) => /материалом заказчика/i.test(item.question));
  assert.equal(customerMaterialFaq.length, 1, "laser page should keep one customer-material FAQ");
  assert.match(customerMaterialFaq[0].answer, /входного контроля/);
  assert.match(laserCutting.description, /Работаем с материалом заказчика/);
'''
          if old_assertion not in test_text:
            raise SystemExit('Customer-material FAQ assertion not found')
          test_path.write_text(test_text.replace(old_assertion, new_assertion, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production-services.ts tests/semantic-seo.test.ts
          git commit -m "copy: consolidate customer-material FAQ"
          git push origin HEAD:copy/laser-material-faq-wave15
