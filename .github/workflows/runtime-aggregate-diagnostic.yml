name: Read runtime cohort and listener aggregates
on:
  workflow_dispatch:
  push:
    branches: [audit/runtime-cohorts-20261011]
    paths:
      - '.github/workflows/runtime-aggregate-diagnostic.yml'
      - 'scripts/runtime-aggregate-diagnostic.py'
      - 'scripts/test-runtime-aggregate-diagnostic.py'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Verify aggregate-only diagnostics using synthetic data
        run: python3 scripts/test-runtime-aggregate-diagnostic.py
      - name: Configure existing server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read bounded aggregates without publishing raw server output
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          [[ "$BEGET_APP_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo 'DIAGNOSTIC_PATH_INVALID'; exit 2; }
          result=$(mktemp)
          trap 'rm -f "$result"' EXIT
          status=0
          ssh -q -T -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "sudo -n python3 - '$BEGET_APP_PATH'" \
            < scripts/runtime-aggregate-diagnostic.py > "$result" 2>/dev/null || status=$?
          python3 scripts/runtime-aggregate-diagnostic.py --validate-output "$result" || { echo 'DIAGNOSTIC_OUTPUT_UNAVAILABLE'; exit 2; }
          if [ "$status" -ne 0 ]; then echo 'DIAGNOSTIC_INCOMPLETE'; exit 2; fi
