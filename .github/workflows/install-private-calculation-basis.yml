name: Install encrypted private calculation basis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-calculation-basis.yml'

permissions:
  contents: read

jobs:
  install-basis:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Install confidential rates and pricing policy
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          KEYIV_B64: 
          PAYLOAD_B64: 
          INSTALLER_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$KEYIV_B64" | base64 --decode > keyiv.enc
          printf '%s' "$PAYLOAD_B64" | base64 --decode > envelope.enc
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" keyiv.enc envelope.enc "$BEGET_USER@$BEGET_HOST:/tmp/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' INSTALLER_B64='$INSTALLER_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          KEY_DIR=/var/lib/steelprodukt/private-basis
          PRIVATE_KEY="$KEY_DIR/decrypt.pem"
          OUT_DIR=/var/lib/steelprodukt/production
          BASIS_PATH="$OUT_DIR/calculation-basis.json"
          test -s "$PRIVATE_KEY"
          install -m 700 -d "$OUT_DIR"
          openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/keyiv.enc -out /tmp/keyiv.bin
          KEYHEX="$(head -c 32 /tmp/keyiv.bin | od -An -tx1 | tr -d ' \n')"
          IVHEX="$(tail -c 16 /tmp/keyiv.bin | od -An -tx1 | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in /tmp/envelope.enc -out /tmp/envelope.json.gz
          gzip -dc /tmp/envelope.json.gz > /tmp/envelope.json
          printf '%s' "$INSTALLER_B64" | base64 --decode > /tmp/install_basis.py
          python3 /tmp/install_basis.py "$APP_PATH" "$BASIS_PATH"
          chmod 600 "$BASIS_PATH"
          rm -f /tmp/keyiv.enc /tmp/envelope.enc /tmp/keyiv.bin /tmp/envelope.json.gz /tmp/envelope.json /tmp/install_basis.py
          echo "Encrypted private calculation basis installed."
          REMOTE
