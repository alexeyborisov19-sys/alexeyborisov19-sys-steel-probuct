name: Install encrypted private calculation basis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-calculation-basis.yml'

permissions:
  contents: read

jobs:
  install-basis:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Install confidential rates and pricing policy
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          KEYIV_B64: 
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$KEYIV_B64" | base64 --decode > keyiv.enc
          printf '%s' "$PAYLOAD_B64" | base64 --decode > envelope.enc
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$BEGET_SSH_PORT" keyiv.enc envelope.enc "$BEGET_USER@$BEGET_HOST:/tmp/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          KEY_DIR=/var/lib/steelprodukt/private-basis
          PRIVATE_KEY="$KEY_DIR/decrypt.pem"
          OUT_DIR=/var/lib/steelprodukt/production
          BASIS_PATH="$OUT_DIR/calculation-basis.json"
          test -s "$PRIVATE_KEY"
          install -m 700 -d "$OUT_DIR"
          openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/keyiv.enc -out /tmp/keyiv.bin
          KEYHEX="$(head -c 32 /tmp/keyiv.bin | od -An -tx1 | tr -d ' \n')"
          IVHEX="$(tail -c 16 /tmp/keyiv.bin | od -An -tx1 | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in /tmp/envelope.enc -out /tmp/envelope.json.gz
          gzip -dc /tmp/envelope.json.gz > /tmp/envelope.json
          python3 - "$APP_PATH" "$BASIS_PATH" <<'PY'
import json, os, sys, tempfile
app_path, basis_path = sys.argv[1], sys.argv[2]
with open('/tmp/envelope.json', encoding='utf-8') as f:
    envelope = json.load(f)
basis = envelope['basis']
commercial = envelope['commercial']
os.makedirs(os.path.dirname(basis_path), exist_ok=True)
fd, tmp = tempfile.mkstemp(dir=os.path.dirname(basis_path), prefix='.basis-', text=True)
with os.fdopen(fd, 'w', encoding='utf-8') as out:
    json.dump(basis, out, ensure_ascii=False, indent=2)
    out.write('\n')
os.chmod(tmp, 0o600)
os.replace(tmp, basis_path)
env_path = os.path.join(app_path, '.env.production')
values = {
    'STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH': basis_path,
    'STEEL_PRODUCT_METAL_MULTIPLIER': commercial['metalMultiplier'],
    'STEEL_PRODUCT_DRAW_PCT': commercial['drawingPercentOfWorks'],
    'STEEL_PRODUCT_FINAL_PCT': commercial['finalPercent'],
    'STEEL_PRODUCT_FIXED_ADD_RUB': commercial['fixedAddRubEach'],
    'STEEL_PRODUCT_FIXED_ADD_ENABLED': 'true' if commercial['fixedAddEnabled'] else 'false',
    'STEEL_PRODUCT_ROUND_STEP_RUB': commercial['roundStepRub'],
}
lines=[]
if os.path.exists(env_path):
    with open(env_path, encoding='utf-8') as f: lines=f.read().splitlines()
keys=set(values)
lines=[line for line in lines if not any(line.startswith(k+'=') for k in keys)]
lines += [f'{k}={v}' for k,v in values.items()]
with open(env_path,'w',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
os.chmod(env_path,0o600)
PY
          chmod 600 "$BASIS_PATH"
          rm -f /tmp/keyiv.enc /tmp/envelope.enc /tmp/keyiv.bin /tmp/envelope.json.gz /tmp/envelope.json
          echo "Encrypted private calculation basis installed."
          REMOTE
