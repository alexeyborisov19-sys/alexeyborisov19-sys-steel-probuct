name: Import VostokStroy card photo

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-vostokstroy-card.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download supplied VostokStroy photo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/projects
          curl -L --fail --silent --show-error "https://at.adobe.com/9418S3u90tAM0IUY"             -o public/images/projects/vostokstroy-vostochny-1.jpg
          size="$(stat -c%s public/images/projects/vostokstroy-vostochny-1.jpg)"
          test "$size" -gt 50000
          file public/images/projects/vostokstroy-vostochny-1.jpg | grep -qiE 'JPEG|image data'
      - name: Commit imported photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/vostokstroy-vostochny-1.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add VostokStroy project card photo"
          git push origin HEAD:main
