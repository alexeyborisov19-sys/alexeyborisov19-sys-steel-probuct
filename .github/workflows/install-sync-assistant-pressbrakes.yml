name: Sync assistant press brake fact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-sync-assistant-pressbrakes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace hard-coded press brake count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/assistant-knowledge.ts')
          text = path.read_text()
          pattern = r'return "На производстве работают три листогибочных комплекса и панельгиб\.([^\"]*)";'
          replacement = r'return `На производстве работают ${productionEquipment.pressBrakes} листогибочных комплекса и панельгиб.\1`;'
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one hard-coded assistant bending fact, found {count}')
          path.write_text(updated)
          PY

      - name: Commit synced fact
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/assistant-knowledge.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "facts: sync assistant press brake count"
          git push origin HEAD:main
