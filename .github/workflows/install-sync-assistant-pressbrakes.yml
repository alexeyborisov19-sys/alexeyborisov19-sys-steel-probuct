name: Sync assistant press brake fact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-sync-assistant-pressbrakes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace hard-coded press brake count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('data/assistant-knowledge.ts')
          text = path.read_text()
          old = 'return "На производстве работают три листогибочных комплекса и панельгиб. Для проверки гибки нужны материал, толщина, длина гиба, углы, геометрия полок и количество деталей.";'
          new = 'return `На производстве работают ${productionEquipment.pressBrakes} листогибочных комплекса и панельгиб. Для проверки гибки нужны материал, толщина, длина гиба, углы, геометрия полок и количество деталей.`;'
          if old not in text:
              raise SystemExit('Expected hard-coded assistant bending fact not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit synced fact
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/assistant-knowledge.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "facts: sync assistant press brake count"
          git push origin HEAD:main
