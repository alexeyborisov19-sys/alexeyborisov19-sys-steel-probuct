name: Read-only Beget AI capacity audit

on:
  push:
    branches:
      - feat/engineering-ai-calculator-bridge-20261017
    paths:
      - ".github/workflows/ai-beget-capacity-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelprodukt-ai-capacity-readonly
  cancel-in-progress: true

jobs:
  check:
    name: Check server resources without changes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify dedicated Beget SSH credentials exist
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in BEGET_HOST BEGET_USER BEGET_SSH_PORT BEGET_SSH_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secured deployment connection field: $key"
              exit 1
            fi
          done
          echo "All required connection fields are configured (values withheld)."

      - name: Read aggregate resource readiness over the existing SSH channel
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/id_ai_capacity_audit"' EXIT
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ai_capacity_audit"
          chmod 600 "$HOME/.ssh/id_ai_capacity_audit"
          # Match the existing deployment's connection method; do not print
          # the hostname, username, address, private key or remote environment.
          ssh-keyscan -T 10 -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ai_capacity_audit" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=12 -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -eu
          # Every remote command is read-only. No package installs, model
          # downloads, writes to .env.production, restart, deploy or credentials.
          total_kb=$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)
          available_kb=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
          swap_kb=$(awk '/^SwapTotal:/ { print $2 }' /proc/meminfo)
          free_disk_kb=$(df -Pk /var | awk 'NR==2 { print $4 }')
          cpus=$(getconf _NPROCESSORS_ONLN 2>/dev/null || printf '0')
          printf 'Audit type: read-only / no deployment / no model inference\n'
          if [ "$total_kb" -ge 16777216 ]; then echo 'RAM total >= 16 GiB: yes'; else echo 'RAM total >= 16 GiB: no'; fi
          if [ "$available_kb" -ge 12582912 ]; then echo 'RAM available >= 12 GiB: yes'; else echo 'RAM available >= 12 GiB: no'; fi
          if [ "$free_disk_kb" -ge 15728640 ]; then echo 'Free disk on /var >= 15 GiB: yes'; else echo 'Free disk on /var >= 15 GiB: no'; fi
          if [ "$swap_kb" -gt 0 ]; then echo 'Swap configured: yes'; else echo 'Swap configured: no'; fi
          if [ "$cpus" -ge 4 ]; then echo 'Logical CPU threads >= 4: yes'; else echo 'Logical CPU threads >= 4: no'; fi
          if command -v nvidia-smi >/dev/null 2>&1; then
            if nvidia-smi -L >/dev/null 2>&1; then echo 'NVIDIA GPU detected: yes'; else echo 'NVIDIA GPU detected: no'; fi
          else
            echo 'NVIDIA GPU detected: no'
          fi
          if command -v ollama >/dev/null 2>&1; then
            echo 'Ollama binary installed: yes'
          else
            echo 'Ollama binary installed: no'
          fi
          if command -v curl >/dev/null 2>&1 && \
            curl --noproxy '*' -fsS --max-time 2 'http://127.0.0.1:11434/api/version' > /dev/null 2>&1; then
            echo 'Loopback Ollama API alive: yes'
          else
            echo 'Loopback Ollama API alive: no'
          fi
          echo 'No hostname, secrets, private customer data or process environment exported.'
          REMOTE
