name: SERP check 2026-10-03 (encrypted, read-only)

# Temporary. Runs only on this branch. Executes .search-check/serp.mjs on the site server, which uses
# the Yandex Search API key already configured there. Nothing on the server is changed. The result is
# written to a file on the runner (never to the log) and committed back ENCRYPTED.
on:
  push:
    branches:
      - claude/search-check-20261003
    paths:
      - ".github/workflows/serp-check-20261003.yml"
      - ".search-check/serp.mjs"

permissions:
  contents: write

concurrency:
  group: serp-check-20261003
  cancel-in-progress: false

jobs:
  serp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/search-check-20261003
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run read-only SERP check with repository secrets
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_SEARCH_FOLDER_ID: ${{ secrets.YANDEX_SEARCH_FOLDER_ID }}
          YANDEX_AI_API_KEY: ${{ secrets.YANDEX_AI_API_KEY }}
          YANDEX_AI_FOLDER_ID: ${{ secrets.YANDEX_AI_FOLDER_ID }}
          YANDEX_CLOUD_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YANDEX_SPEECHKIT_API_KEY: ${{ secrets.YANDEX_SPEECHKIT_API_KEY }}
        run: |
          set -uo pipefail
          umask 077
          node .search-check/serp.mjs > /tmp/raw.txt 2>/dev/null
          echo "node exit: $?"
          python3 - <<'PY'
          import re, json
          raw = open('/tmp/raw.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'@@SERP_BEGIN@@(.*)@@SERP_END@@', raw, re.S)
          out = m.group(1) if m else json.dumps({"error": "NO_MARKERS", "bytes": len(raw)})
          open('/tmp/serp.json', 'w', encoding='utf-8').write(out)
          print("markers found:", bool(m), "bytes:", len(out))
          PY
          shred -u /tmp/raw.txt

      - name: Encrypt and commit the result
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/serp.json -out .search-check/serp.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey .search-check/public-key.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/k.txt -out .search-check/serp-key.enc
          shred -u /tmp/k.txt /tmp/serp.json
          rm -f ~/.ssh/id_ed25519
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .search-check/serp.enc .search-check/serp-key.enc
          git commit -m "Encrypted SERP check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin claude/search-check-20261003
          git push origin HEAD:claude/search-check-20261003
