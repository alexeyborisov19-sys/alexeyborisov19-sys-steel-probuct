name: Remove unverified quote response SLA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-fix-quote-sla.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove response-time promises from quote form
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/QuoteRequestForm.tsx')
          text = path.read_text()

          replacements = [
              (
                  '${payload.message || "Заявка принята."}${payload.requestId ? ` Номер заявки: ${payload.requestId}.` : ""} Подтвердим получение материалов в течение рабочего дня. Срок подготовки расчёта сообщим после проверки документации.',
                  '${payload.message || "Заявка принята."}${payload.requestId ? ` Номер заявки: ${payload.requestId}.` : ""} Материалы переданы на проверку. Срок подготовки расчёта сообщим после проверки документации.'
              ),
              (
                  'Подтвердим получение материалов в течение рабочего дня.',
                  'После отправки материалы поступят на инженерную и коммерческую проверку.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one quote SLA occurrence, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          if 'в течение рабочего дня' in text.lower():
              raise SystemExit('Unverified response-time SLA remains in QuoteRequestForm')

          path.write_text(text)
          PY

      - name: Commit quote-form copy fix
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'components/QuoteRequestForm.tsx'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: remove quote form response-time promise"
          git push origin HEAD:main
