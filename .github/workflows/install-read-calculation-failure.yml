name: Read safe calculation failure category

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-read-calculation-failure.yml'

permissions:
  contents: read

jobs:
  read-category:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Read latest safe calculation failure code
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          LINE="$(sudo -iu nodejs bash -lc 'pm2 logs steelprodukt --nostream --lines 500 2>/dev/null' | grep '"route":"online-calculation"' | grep '"result":"calculation_failed"' | tail -n 1 || true)"
          if [ -z "$LINE" ]; then
            echo 'SAFE_FAILURE_CODE=NOT_FOUND'
            exit 1
          fi
          CODE="$(printf '%s\n' "$LINE" | sed -n 's/.*"code":"\([A-Z0-9_]*\)".*/\1/p')"
          test -n "$CODE"
          echo "SAFE_FAILURE_CODE=$CODE"
          REMOTE
