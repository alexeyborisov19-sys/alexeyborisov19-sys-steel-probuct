name: Check SMTP secret

on:
  push:
    paths:
      - '.github/workflows/install-check-smtp-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm SMTP_PASSWORD is configured
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "SMTP_PASSWORD is not configured."
            exit 1
          fi
          echo "SMTP_PASSWORD is configured."
