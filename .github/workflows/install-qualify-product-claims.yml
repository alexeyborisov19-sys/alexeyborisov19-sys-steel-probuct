name: Qualify product engineering claims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-qualify-product-claims.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qualify project-dependent product claims
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data/products.ts')
          text = path.read_text()
          replacements = {
              '{ label: "Пожарная безопасность", value: "Класс КМ0 (НГ — негорючие материалы)" },':
                  '{ label: "Пожарные требования", value: "По проектной документации и подтверждающим документам применяемой фасадной системы" },',
              '{ label: "Монтаж", value: "Всесезонно, без ограничений по минусовым температурам" },':
                  '{ label: "Монтаж", value: "Условия и температурные ограничения — по проекту и требованиям применяемой фасадной системы" },',
              'advantage: "Скрытый крепёж не нарушает покрытие и исключает риск ржавых подтёков в местах крепления.",':
                  'advantage: "Скрытый крепёж убирает видимые точки фиксации; защита узла от коррозионных подтёков зависит от конструкции, покрытия и качества монтажа.",',
              'lead: "Точные угловые профили для герметичного, аккуратного примыкания фасадных плоскостей и оконных откосов.",':
                  'lead: "Точные угловые профили для аккуратного примыкания фасадных плоскостей и оконных откосов.",',
              'advantage: "Помогает исключить зазоры в узлах и собрать фасад в цельную, чистую геометрию.",':
                  'advantage: "Помогает уменьшить зазоры в узлах и собрать фасад в цельную, чистую геометрию при корректной подготовке основания и монтаже.",',
              '{ label: "Назначение", value: "Точное и герметичное примыкание фасадных плоскостей, углов и оконных откосов" },':
                  '{ label: "Назначение", value: "Точное примыкание фасадных плоскостей, углов и оконных откосов по проектному узлу" },',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one product claim: {old[:100]} (found {count})')
              text = text.replace(old, new, 1)

          for forbidden in [
              'без ограничений по минусовым температурам',
              'исключает риск ржавых подтёков',
              'герметичного, аккуратного примыкания',
              'Точное и герметичное примыкание',
          ]:
              if forbidden in text:
                  raise SystemExit(f'Unqualified product claim remains: {forbidden}')

          path.write_text(text)
          PY

      - name: Commit qualified product copy
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'data/products.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: qualify project-dependent product claims"
          git push origin HEAD:main
