name: Import Solovinaya Roshcha photos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-solovinaya-photos.yml'

permissions:
  contents: write

jobs:
  import:
    name: Import supplied project photos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download supplied photos
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/images/projects

          urls=(
            "https://at.adobe.com/HU6JxTyXwddxGF5B"
            "https://at.adobe.com/ymgXc618RLF3SXcd"
            "https://at.adobe.com/6fxCCL5ywHOIzBUM"
          )
          targets=(
            "public/images/projects/solovinaya-roshcha-1.jpg"
            "public/images/projects/solovinaya-roshcha-2.jpg"
            "public/images/projects/solovinaya-roshcha-3.jpg"
          )

          for i in 0 1 2; do
            echo "Downloading ${targets[$i]}"
            curl -L --fail --silent --show-error "${urls[$i]}" -o "${targets[$i]}"
            size="$(stat -c%s "${targets[$i]}")"
            if [ "$size" -lt 50000 ]; then
              echo "Downloaded file is unexpectedly small: ${targets[$i]} ($size bytes)"
              exit 1
            fi
            file "${targets[$i]}"
            file "${targets[$i]}" | grep -qiE 'JPEG|image data' || {
              echo "Downloaded file is not a JPEG image: ${targets[$i]}"
              exit 1
            }
          done

          rm -f             public/images/projects/solovinaya-roshcha-4.jpg             public/images/projects/solovinaya-roshcha-5.jpg             public/images/projects/solovinaya-roshcha-6.jpg             public/images/projects/solovinaya-roshcha-7.jpg             public/images/projects/solovinaya-roshcha-8.jpg

      - name: Commit imported photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/solovinaya-roshcha-*.jpg
          if git diff --cached --quiet; then
            echo "No project photo changes to commit."
            exit 0
          fi
          git commit -m "Replace Solovinaya Roshcha project photos"
          git push origin HEAD:main
