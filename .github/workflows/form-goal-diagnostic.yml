name: Verify live form goals without sending leads
on:
  push:
    paths:
      - '.github/workflows/form-goal-diagnostic.yml'
      - 'scripts/audit-form-goal-diagnostic.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://www.steelprodukt.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-form-goal-diagnostic.mjs
