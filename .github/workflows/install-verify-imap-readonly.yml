name: Verify read-only IMAP

on:
  push:
    paths:
      - '.github/workflows/install-verify-imap-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Verify IMAP using read-only mailbox access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' python3 - <<'PY'"
          import imaplib
          import os
          from pathlib import Path

          env_file = Path(os.environ["APP_PATH"]) / ".env.production"
          values = {}
          for raw in env_file.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip().strip("'").strip('"')

          required = ["IMAP_HOST", "IMAP_PORT", "IMAP_SECURE", "IMAP_USER", "IMAP_READ_ONLY", "SMTP_PASSWORD"]
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Missing IMAP configuration")

          if values["IMAP_SECURE"].lower() != "true":
              raise SystemExit("IMAP TLS is not enabled")
          if values["IMAP_READ_ONLY"].lower() != "true":
              raise SystemExit("IMAP read-only guard is not enabled")

          client = imaplib.IMAP4_SSL(values["IMAP_HOST"], int(values["IMAP_PORT"]), timeout=15)
          try:
              typ, _ = client.login(values["IMAP_USER"], values["SMTP_PASSWORD"])
              if typ != "OK":
                  raise SystemExit("IMAP login failed")

              typ, data = client.select("INBOX", readonly=True)
              if typ != "OK":
                  raise SystemExit("Read-only EXAMINE failed")

              typ, status = client.status("INBOX", "(MESSAGES UNSEEN)")
              if typ != "OK":
                  raise SystemExit("Read-only STATUS failed")

              message_count = int(data[0]) if data and data[0] else 0
              print("IMAP_READ_ONLY_AUTH=success")
              print("IMAP_READ_ONLY_EXAMINE=success")
              print("IMAP_READ_ONLY_STATUS=success")
              print(f"IMAP_INBOX_MESSAGES={message_count}")
          finally:
              try:
                  client.logout()
              except Exception:
                  pass
          PY
