# Audit trigger: 2026-09-28 search visibility
name: Yandex read-only audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yandex-readonly-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
      YW_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
      YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
      YD_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
    steps:
      - name: Read Yandex Metrika, Webmaster and Direct
        shell: bash
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          const counterId = 112542227;
          const canonicalCounter = String(counterId);

          function normToken(raw = "") {
            let v = String(raw).trim().replace(/^OAuth\s+/i, "").replace(/^Bearer\s+/i, "");
            const m = v.match(/(?:^|[#?&])access_token=([^&#\s]+)/i);
            if (m) {
              try { v = decodeURIComponent(m[1]); } catch { v = m[1]; }
            }
            return v.trim();
          }
          function safe(obj) {
            return JSON.stringify(obj, null, 2);
          }
          async function request(url, token, opts = {}) {
            const res = await fetch(url, {
              ...opts,
              headers: {
                Authorization: `OAuth ${token}`,
                Accept: "application/json",
                ...(opts.body ? {"Content-Type":"application/json"} : {}),
                ...(opts.headers || {}),
              },
              signal: AbortSignal.timeout(25000),
            });
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = text; }
            return {status: res.status, ok: res.ok, body, headers: Object.fromEntries(res.headers.entries())};
          }
          async function requestDirect(url, token, body, clientLogin = "") {
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/json",
              "Content-Type": "application/json",
              "Accept-Language": "ru",
            };
            if (clientLogin) headers["Client-Login"] = clientLogin;
            const res = await fetch(url, {
              method: "POST",
              headers,
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            const text = await res.text();
            let parsed;
            try { parsed = text ? JSON.parse(text) : {}; } catch { parsed = text; }
            return {status: res.status, ok: res.ok, body: parsed, headers: Object.fromEntries(res.headers.entries())};
          }

          console.log("=== YANDEX READ-ONLY AUDIT ===");
          console.log("Timestamp:", new Date().toISOString());

          // WEBMASTER
          console.log("\n=== WEBMASTER ===");
          const yw = normToken(process.env.YW_TOKEN || process.env.YANDEX_OAUTH_TOKEN || process.env.YD_TOKEN || process.env.YM_TOKEN || "");
          if (!yw) {
            console.log("WEBMASTER_TOKEN: MISSING");
          } else {
            const user = await request("https://api.webmaster.yandex.net/v4/user", yw);
            console.log("USER_HTTP:", user.status);
            if (!user.ok) {
              console.log("USER_ERROR:", safe(user.body));
            } else {
              const uid = user.body?.user_id;
              console.log("USER_ID_PRESENT:", Boolean(uid));
              const hosts = await request(`https://api.webmaster.yandex.net/v4/user/${uid}/hosts`, yw);
              console.log("HOSTS_HTTP:", hosts.status);
              if (!hosts.ok) {
                console.log("HOSTS_ERROR:", safe(hosts.body));
              } else {
                const list = hosts.body?.hosts || [];
                const host = list.find(h => /(^|\.)steelprodukt\.ru\/?$/i.test(new URL(h.unicode_host_url || h.ascii_host_url).hostname))
                  || list.find(h => String(h.unicode_host_url || h.ascii_host_url).includes("steelprodukt.ru"));
                console.log("HOST_FOUND:", Boolean(host));
                if (host) {
                  console.log("HOST:", safe({
                    host_id: host.host_id,
                    url: host.unicode_host_url || host.ascii_host_url,
                    verified: host.verified,
                    host_data_status: host.host_data_status,
                    main_mirror: host.main_mirror?.unicode_host_url || host.main_mirror?.ascii_host_url || null
                  }));
                  const hid = encodeURIComponent(host.host_id);
                  for (const [label, suffix] of [
                    ["SUMMARY","summary"],
                    
                    ["POPULAR_QUERIES","search-queries/popular?order_by=TOTAL_SHOWS&query_indicator=TOTAL_SHOWS&query_indicator=TOTAL_CLICKS&query_indicator=AVG_SHOW_POSITION&limit=500"],
                    ["POPULAR_QUERIES_NEXT","search-queries/popular?order_by=TOTAL_SHOWS&query_indicator=TOTAL_SHOWS&query_indicator=TOTAL_CLICKS&query_indicator=AVG_SHOW_POSITION&limit=500&offset=500"],
                    ["DIAGNOSTICS","diagnostics"],
                    ["VERIFICATION","verification"],
                    ["SITEMAPS","sitemaps?limit=100"],
                  ]) {
                    const rr = await request(`https://api.webmaster.yandex.net/v4/user/${uid}/hosts/${hid}/${suffix}`, yw);
                    console.log(`${label}_HTTP:`, rr.status);
                    if (rr.ok) {
                      let out = rr.body;
                      if (label === "DIAGNOSTICS") {
                        const p = rr.body?.problems || {};
                        out = Object.fromEntries(Object.entries(p).filter(([,v]) => v?.state === "PRESENT" || v?.state === "UNDEFINED"));
                      }
                      if (label === "SITEMAPS") {
                        out = (rr.body?.sitemaps || []).map(s => ({
                          url: s.sitemap_url,
                          errors_count: s.errors_count,
                          urls_count: s.urls_count,
                          last_access_date: s.last_access_date,
                          source: s.source || s.sources,
                          type: s.sitemap_type
                        }));
                      }
                      console.log(`${label}:`, safe(out));
                    } else console.log(`${label}_ERROR:`, safe(rr.body));
                  }
                }
              }
            }
          }

          NODE
          node /tmp/audit.mjs
