# Audit trigger: 2026-09-26
name: Yandex read-only audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yandex-readonly-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
      YW_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
      YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
      YD_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
    steps:
      - name: Read Yandex Metrika, Webmaster and Direct
        shell: bash
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          function normToken(raw = "") {
            let v = String(raw).trim().replace(/^OAuth\s+/i, "").replace(/^Bearer\s+/i, "");
            const m = v.match(/(?:^|[#?&])access_token=([^&#\s]+)/i);
            if (m) {
              try { v = decodeURIComponent(m[1]); } catch { v = m[1]; }
            }
            return v.trim();
          }
          function safe(obj) {
            return JSON.stringify(obj, null, 2);
          }
          async function request(url, token, opts = {}) {
            const res = await fetch(url, {
              ...opts,
              headers: {
                Authorization: `OAuth ${token}`,
                Accept: "application/json",
                ...(opts.body ? {"Content-Type":"application/json"} : {}),
                ...(opts.headers || {}),
              },
              signal: AbortSignal.timeout(25000),
            });
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = text; }
            return {status: res.status, ok: res.ok, body, headers: Object.fromEntries(res.headers.entries())};
          }
          async function requestDirect(url, token, body, clientLogin = "") {
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/json",
              "Content-Type": "application/json",
              "Accept-Language": "ru",
            };
            if (clientLogin) headers["Client-Login"] = clientLogin;
            const res = await fetch(url, {
              method: "POST",
              headers,
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            const text = await res.text();
            let parsed;
            try { parsed = text ? JSON.parse(text) : {}; } catch { parsed = text; }
            return {status: res.status, ok: res.ok, body: parsed, headers: Object.fromEntries(res.headers.entries())};
          }

          const token = normToken(process.env.YD_TOKEN || "");
          const login = String(process.env.YD_CLIENT_LOGIN || "").trim();
          if (!token) throw new Error("Direct token missing");
          for (const [service, params] of [
            ["campaigns", {SelectionCriteria:{Ids:[714391927]}, FieldNames:["Id","Name","Type","Status","State","StatusPayment"], UnifiedCampaignFieldNames:["BiddingStrategy","CounterIds"]}],
            ["adgroups", {SelectionCriteria:{CampaignIds:[714391927]}, FieldNames:["Id","Name","RegionIds","Status","Type"]}],
            ["ads", {SelectionCriteria:{CampaignIds:[714391927]}, FieldNames:["Id","AdGroupId","Type","State","Status"], TextAdFieldNames:["Title","Title2","Text","Href"], ResponsiveAdFieldNames:["Href"],Page:{Limit:100,Offset:0}}]
          ]) {
            const result = await requestDirect("https://api.direct.yandex.com/json/v501/"+service, token, {method:"get",params},login);
            console.log(service, safe(result.body));
            if (!result.ok || result.body.error) process.exitCode=1;
          }
          NODE
          node /tmp/audit.mjs
