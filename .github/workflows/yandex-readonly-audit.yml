name: Yandex query mapping export
on:
  push:
    branches: ["audit/yandex-query-mapping-20261004"]
    paths: [".github/workflows/yandex-readonly-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export requested Webmaster query period
        env:
          YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
          YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
          YW_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
        run: |
          cat > /tmp/export.mjs <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";
          const token = (process.env.YW_TOKEN || process.env.YANDEX_OAUTH_TOKEN || process.env.YD_TOKEN || process.env.YM_TOKEN || "").trim().replace(/^OAuth\s+|^Bearer\s+/i, "");
          if (!token) throw new Error("Webmaster token missing");
          async function get(path) {
           const r = await fetch("https://api.webmaster.yandex.net/v4/"+path, {headers:{Authorization:"OAuth "+token},signal:AbortSignal.timeout(30000)});
           if (!r.ok) throw new Error("Webmaster HTTP "+r.status);
           return r.json();
          }
          const {user_id} = await get("user");
          const {hosts} = await get("user/"+user_id+"/hosts");
          const host = hosts.find(h=>h.verified && new URL(h.ascii_host_url).hostname === "www.steelprodukt.ru");
          if (!host) throw new Error("Verified canonical host not found");
          const base="user/"+user_id+"/hosts/"+encodeURIComponent(host.host_id)+"/";
          const pages=[], unique=new Map(), conflicts=[];
          let expected=null, rows=0;
          for (let offset=0;offset<3000;offset+=500) {
           const params=new URLSearchParams({order_by:"TOTAL_SHOWS",date_from:"2026-09-26",date_to:"2026-10-02",offset:String(offset),limit:"500"});
           for(const v of ["TOTAL_SHOWS","TOTAL_CLICKS","AVG_SHOW_POSITION"]) params.append("query_indicator",v);
           const p=await get(base+"search-queries/popular?"+params);
           pages.push(p); expected ??= p.count;
           for(const q of p.queries||[]) {
            const key=q.query_id;
            if(!key) throw new Error("Missing query ID");
            if(unique.has(key) && JSON.stringify(unique.get(key))!==JSON.stringify(q)) conflicts.push(key);
            unique.set(key,q);rows++;
           }
           if(!(p.queries||[]).length || offset+500>=p.count) break;
          }
          const summary={date_from:"2026-09-26",date_to:"2026-10-02",reportedCounts:pages.map(p=>p.count),returnedRows:rows,uniqueQueries:unique.size,duplicateRows:rows-unique.size,conflictingDuplicateIds:conflicts,complete:unique.size===expected&&conflicts.length===0&&pages.every(p=>p.count===expected)};
          mkdirSync("query-export",{recursive:true});
          writeFileSync("query-export/queries.json",JSON.stringify({summary,queries:[...unique.values()],pages},null,2));
          console.log(JSON.stringify(summary));
          
          NODE
          node /tmp/export.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yandex-queries-20260926-20261002
          path: query-export/queries.json
          retention-days: 7
          if-no-files-found: error
