name: Yandex read-only audit
on:
  push:
    branches: [report/direct-conversion-audit-20261009]
    paths: [".github/workflows/yandex-readonly-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
      YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
      YD_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
    steps:
      - name: Read campaign budget goals targeting and search query reports
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/read-only-conversion-audit.mjs <<'NODE'
          const campaign=714391927, counter=112542227;
          const norm=s=>String(s||"").trim().replace(/^(OAuth|Bearer)\s+/i,"");
          const yd=norm(process.env.YD_TOKEN), ym=norm(process.env.YM_TOKEN), login=String(process.env.YD_CLIENT_LOGIN||"").trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const parse=t=>JSON.parse(t.replace(/(:\s*|,\s*|\[\s*)(\d{16,})(?=\s*[,}\]])/g,'$1"$2"'));
          function print(label,value){ console.log(label+" "+JSON.stringify(value));}
          async function direct(service,params){
           if(!["campaigns","adgroups","keywords"].includes(service)) throw Error("Read-only service denied");
           const h={Authorization:"Bearer "+yd,"Content-Type":"application/json","Accept-Language":"ru"};if(login)h["Client-Login"]=login;
           const r=await fetch("https://api.direct.yandex.com/json/v501/"+service,{method:"POST",headers:h,body:JSON.stringify({method:"get",params}),signal:AbortSignal.timeout(45000)});
           const t=await r.text();let b;try{b=parse(t)}catch{b={invalid_json:true}}
           if(!r.ok||b.error){print(service+"_ERROR",{status:r.status,error:b.error});return null}return b.result;
          }
          async function paged(service,params,key){
           const out=[];for(let offset=0;offset<20000;){const r=await direct(service,{...params,Page:{Limit:1000,Offset:offset}});if(!r)return out;
           out.push(...(r[key]||[]));if(!r.LimitedBy)return out;offset=r.LimitedBy;}
           print(service+"_TRUNCATED",true);return out;
          }
          print("REPORT_METADATA",{generated_at:new Date().toISOString(),mode:"READ_ONLY",campaign,counter,money_units:"Direct settings in millionths of RUB; report cost in RUB without VAT",postrelease_caution:"October 9 is incomplete and includes traffic before the 19:04 UTC merge; not a clean post-release cohort"});
          const campaigns=await paged("campaigns",{SelectionCriteria:{},FieldNames:["Id","Name","State","Status","Currency","DailyBudget","NegativeKeywords","TimeTargeting"],UnifiedCampaignFieldNames:["CounterIds","AttributionModel","PriorityGoals","Settings","BiddingStrategy","TrackingParams"]},"Campaigns");
          print("CAMPAIGNS",campaigns);
          print("ADGROUPS",await paged("adgroups",{SelectionCriteria:{CampaignIds:[campaign]},FieldNames:["Id","Name","CampaignId","Status","Type","RegionIds","NegativeKeywords","TrackingParams"]},"AdGroups"));
          print("KEYWORDS",await paged("keywords",{SelectionCriteria:{CampaignIds:[campaign]},FieldNames:["Id","Keyword","AdGroupId","CampaignId","State","Status","ServingStatus","Bid","ContextBid","AutotargetingCategories"]},"Keywords"));
          const goalsRes=await fetch("https://api-metrika.yandex.net/management/v1/counter/"+counter+"/goals",{headers:{Authorization:"OAuth "+ym},signal:AbortSignal.timeout(45000)});
          let goals=[];if(goalsRes.ok){goals=(await goalsRes.json()).goals||[];print("GOALS",goals.map(g=>({id:g.id,name:g.name,type:g.type,status:g.status,conditions:g.conditions})));}else print("GOALS_ERROR",{status:goalsRes.status});
          const important=goals.filter(g=>[612680821,612680809,666575171].includes(g.id)||g.conditions?.some(c=>["assistant_lead_success","ym-submit-leadform"].includes(c.url))).map(g=>g.id);
          for(const dates of [["2026-10-02","2026-10-08"],["2026-10-09","2026-10-09"]]){
           const u=new URL("https://api-metrika.yandex.net/stat/v1/data");
           const metrics=["ym:s:visits",...important.flatMap(id=>["ym:s:goal"+id+"reaches","ym:s:goal"+id+"visits"])];
           for(const [k,v]of Object.entries({ids:String(counter),date1:dates[0],date2:dates[1],timezone:"+03:00",attribution:"last",accuracy:"full",dimensions:"ym:s:lastDirectClickOrder",filters:"ym:s:lastDirectClickOrder=='"+campaign+"'",metrics:metrics.join(","),limit:"100"}))u.searchParams.set(k,v);
           const r=await fetch(u,{headers:{Authorization:"OAuth "+ym},signal:AbortSignal.timeout(45000)});
           if(r.ok){const b=await r.json();print("METRIKA_GOALS",{dates,metrics,totals:b.totals,sampled:b.sampled,data_lag:b.data_lag});}else print("METRIKA_GOALS_ERROR",{dates,status:r.status});
          }
          async function report(kind,fields,dates,goals=[]){
           const p={SelectionCriteria:{DateFrom:dates[0],DateTo:dates[1],Filter:[{Field:"CampaignId",Operator:"EQUALS",Values:[String(campaign)]}]},FieldNames:fields,ReportName:"Readonly optimization "+kind+" "+dates.join("-")+" "+(goals.length?"goals":"base"),ReportType:kind,DateRangeType:"CUSTOM_DATE",Format:"TSV",IncludeVAT:"NO",IncludeDiscount:"NO"};
           if(goals.length){p.Goals=goals.map(String);p.AttributionModels=["LC"];}
           const headers={Authorization:"Bearer "+yd,"Content-Type":"application/json","Accept-Language":"ru",processingMode:"auto",returnMoneyInMicros:"false",skipReportHeader:"true",skipReportSummary:"true"};if(login)headers["Client-Login"]=login;
           for(let attempt=0;attempt<8;attempt++){
           const r=await fetch("https://api.direct.yandex.com/json/v501/reports",{method:"POST",headers,body:JSON.stringify({params:p}),signal:AbortSignal.timeout(60000)});const t=await r.text();
           if(r.status===201||r.status===202){await sleep(Math.min(30000,Math.max(1000,Number(r.headers.get("retryIn")||5)*1000)));continue;}
           if(!r.ok){print("DIRECT_REPORT_ERROR",{kind,dates,status:r.status,error:t.slice(0,1500)});return;}
           const lines=t.trim().split(/\r?\n/);let redacted=0;
           const safe=lines.filter((line,i)=>{if(!i)return true;if(/[\w.+-]+@[\w.-]+\.\w+|\+?\d[\d ()-]{9,}\d/.test(line.split("\t")[0])&&kind==="SEARCH_QUERY_PERFORMANCE_REPORT"){redacted++;return false;}return true;});
           print("DIRECT_REPORT",{kind,dates,goals,redacted_rows:redacted,total_rows:lines.length-1,tsv:safe.join("\n")});return;
           }print("DIRECT_REPORT_PENDING",{kind,dates});
          }
          await report("CAMPAIGN_PERFORMANCE_REPORT",["Date","CampaignId","Impressions","Clicks","Cost","Conversions"],["2026-10-02","2026-10-08"],important);
          await report("SEARCH_QUERY_PERFORMANCE_REPORT",["Query","CampaignId","AdGroupId","Keyword","MatchType","Impressions","Clicks","Cost","Conversions"],["2026-10-02","2026-10-08"],important);
          await report("CRITERIA_PERFORMANCE_REPORT",["CampaignId","AdGroupId","CriteriaId","Criteria","Impressions","Clicks","Cost","Conversions"],["2026-10-02","2026-10-08"],important);
          await report("CAMPAIGN_PERFORMANCE_REPORT",["Date","CampaignId","Impressions","Clicks","Cost","Conversions"],["2026-10-09","2026-10-09"],important);
          print("READ_ONLY_COMPLETE",true);
          
          NODE
          node --check /tmp/read-only-conversion-audit.mjs
          node /tmp/read-only-conversion-audit.mjs
