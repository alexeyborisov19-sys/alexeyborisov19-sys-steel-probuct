name: Verify published BIM release 2026-10-15
on:
  push:
    branches: ['feat/bim-library-20261014']
    paths: ['.github/workflows/verify-bim-release-live-20261015.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/bim-library-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_COMMIT: 0af7ebc329e4fdd6c929537dcc0333a78d13a0cd
      DEPLOY_RUN: '38694161148'
      BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0af7ebc329e4fdd6c929537dcc0333a78d13a0cd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the one existing deployment, without starting another
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['DEPLOY_RUN']
          for attempt in range(40):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run['head_sha'] == os.environ['TARGET_COMMIT']
              assert run['path'] == '.github/workflows/deploy-beget.yml'
              print('Existing deployment:', run['status'], run['conclusion'], flush=True)
              if run['status'] == 'completed':
                  assert run['conclusion'] == 'success', 'Deployment did not succeed; no repair or retry is attempted'
                  break
              time.sleep(20)
          else:
              raise SystemExit('Deployment is still incomplete; no production claim')
          PY
      - name: Verify fresh public pages and every released source asset using GET only
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, subprocess, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          base = os.environ['BROWSER_AUDIT_BASE_URL']
          target = os.environ['TARGET_COMMIT']
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == target
          report = {'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'target_commit': target, 'deploy_run': os.environ['DEPLOY_RUN'], 'method': 'GET only; no form submissions', 'pages': [], 'assets': [], 'errors': []}
          out = pathlib.Path('output/release-live'); out.mkdir(parents=True, exist_ok=True)
          def get(path):
              url = base + path + '?release_check=' + target[:12]
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'SteelProdukt-ReleaseVerification/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(20000000)
                  return data, response.status, response.geturl(), dict(response.headers)
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=[]; self.robots=[]; self.models=[]; self.forms=0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonical.append(a.get('href',''))
                  if tag == 'meta' and a.get('name','').lower() in ['robots','googlebot']: self.robots.append(a.get('content',''))
                  if tag == 'article' and a.get('data-model-id'): self.models.append(a['data-model-id'])
                  if tag == 'form': self.forms += 1
          try:
              robots, status, url, headers = get('/robots.txt')
              assert status == 200
              sitemap, status, url, headers = get('/sitemap.xml')
              assert status == 200
              locations = [node.text for node in ET.fromstring(sitemap).iter() if node.tag.endswith('}loc') or node.tag == 'loc']
              report['sitemap_urls'] = len(locations)
              paths = ['/', '/products', '/products/metallokassety', '/products/korziny-dlya-konditsionerov', '/products/metallicheskie-korpusa', '/products/metallokassety-premium', '/tools', '/contacts', '/products/metallokassety/bim']
              paths += sorted({urllib.parse.urlsplit(u).path for u in locations if u and urllib.parse.urlsplit(u).path.startswith('/production/')})
              for path in paths:
                  data, status, final, headers = get(path)
                  parser = Page(); parser.feed(data.decode('utf-8'))
                  entry = {'path':path,'status':status,'final_url':final,'canonical':parser.canonical,'robots':parser.robots,'forms':parser.forms,'http_date':headers.get('Date')}
                  report['pages'].append(entry)
                  assert status == 200, path
                  assert urllib.parse.urlsplit(final).hostname == 'www.steelprodukt.ru', path
                  assert len(parser.canonical) == 1 and parser.canonical[0].rstrip('/') == (base+path).rstrip('/'), ('canonical',path)
                  assert not any('noindex' in value.lower() for value in parser.robots), ('noindex',path)
                  if path.endswith('/metallokassety/bim'):
                      entry['model_count'] = len(set(parser.models))
                      assert len(parser.models) == 15 and len(set(parser.models)) == 15
                      assert 'Бесплатная BIM-библиотека' in data.decode('utf-8')
              source = pathlib.Path('public/bim/metallokassety')
              expected = {}
              for line in (source/'SHA256SUMS.txt').read_text().splitlines():
                  digest, relative = line.split(None,1)
                  relative = relative.lstrip('*')
                  assert '..' not in pathlib.PurePosixPath(relative).parts and not relative.startswith('/')
                  expected['/bim/metallokassety/'+relative] = digest
              for path in [source/'SHA256SUMS.txt', *pathlib.Path('public/bim/metallokassety-parametric').glob('*')]:
                  if path.is_file(): expected['/'+path.relative_to('public').as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              def verify_asset(item):
                  path, digest = item
                  data, status, final, headers = get(path)
                  actual = hashlib.sha256(data).hexdigest()
                  return {'path':path,'status':status,'bytes':len(data),'sha256':actual,'matches_target':status == 200 and actual == digest}
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  report['assets'] = list(pool.map(verify_asset, expected.items()))
              assert all(item['matches_target'] for item in report['assets']), 'Published asset differs from the merged release'
          except Exception as error:
              report['errors'].append(str(error))
          (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps({'checked_at_utc':report['checked_at_utc'],'target_commit':target,'pages':len(report['pages']),'assets':len(report['assets']),'matching_assets':sum(item['matches_target'] for item in report['assets']),'errors':report['errors']},ensure_ascii=False))
          assert not report['errors'], 'See the saved read-only verification report'
          PY
      - name: Check live library interactions while blocking every write and external origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/audit-cassette-library-page.mjs').read_text()
          needle = "    const request=route.request();"
          assert source.count(needle) == 1
          guard = needle + "\n    if(new URL(request.url()).origin!==new URL(base).origin)return route.abort();"
          Path('scripts/.release-live-cassette-audit.mjs').write_text(source.replace(needle,guard))
          PY
          node scripts/.release-live-cassette-audit.mjs
      - name: Save read-only publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bim-production-verification-0af7ebc
          path: |
            output/release-live/
            output/browser-audit/cassette-library/
          if-no-files-found: error
          retention-days: 3
