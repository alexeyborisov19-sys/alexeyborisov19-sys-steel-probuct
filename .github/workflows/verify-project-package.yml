name: Verify project package

on:
  push:
    branches:
      - feat/project-galleries-exhibitions-obninsk-sep12
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-project-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · tests · build · SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
      NEXT_PUBLIC_YM_COUNTER_ID: "112542227"
      NEXT_PUBLIC_YM_WEBVISOR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: SEO audit
        env:
          NODE_ENV: production
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3011
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3011 > /tmp/steelprodukt-seo-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3011/robots.txt > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/steelprodukt-seo-audit-server.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/steelprodukt-seo-audit-server.log
            echo "Built Next.js server did not become ready on 127.0.0.1:3011."
            exit 1
          fi

          npm run seo:audit

  diagnose-private-calculation-runtime:
    name: Check private calculation runtime readiness
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_HOST"
          test -n "$BEGET_SSH_PORT"
          test -n "$BEGET_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Validate private policy and smoke prerequisites without reading values
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          BASIS_FILE="/var/lib/steelprodukt/production/calculation-basis.json"
          REPORT_ROOT="/var/lib/steelprodukt/production/reports"
          test -f "$ENV_FILE"

          node - "$ENV_FILE" "$BASIS_FILE" <<'NODE'
          const fs = require('node:fs');
          const [envFile, basisFile] = process.argv.slice(2);
          const env = new Map();
          for (const rawLine of fs.readFileSync(envFile, 'utf8').split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const idx = line.indexOf('=');
            if (idx < 1) continue;
            let value = line.slice(idx + 1).trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            env.set(line.slice(0, idx), value);
          }

          const numeric = [
            ['STEEL_PRODUCT_METAL_MULTIPLIER', 'positive'],
            ['STEEL_PRODUCT_DRAW_PCT', 'nonnegative'],
            ['STEEL_PRODUCT_FINAL_PCT', 'nonnegative'],
            ['STEEL_PRODUCT_FIXED_ADD_RUB', 'nonnegative'],
            ['STEEL_PRODUCT_ROUND_STEP_RUB', 'positive'],
          ];
          let ok = true;
          for (const [name, mode] of numeric) {
            const value = Number(env.get(name));
            const valid = Number.isFinite(value) && (mode === 'positive' ? value > 0 : value >= 0);
            console.log(`${name}=${valid ? 'VALID' : 'INVALID'}`);
            if (!valid) ok = false;
          }
          const fixed = env.get('STEEL_PRODUCT_FIXED_ADD_ENABLED');
          const fixedValid = fixed === 'true' || fixed === 'false';
          console.log(`STEEL_PRODUCT_FIXED_ADD_ENABLED=${fixedValid ? 'VALID' : 'INVALID'}`);
          if (!fixedValid) ok = false;

          const basis = JSON.parse(fs.readFileSync(basisFile, 'utf8'));
          const laserRows = Array.isArray(basis?.rateBook?.laserRubPerM) ? basis.rateBook.laserRubPerM : [];
          const zincLaser = laserRows.some((row) => row?.materialId === 'zinc' && Number(row?.thicknessMm) === 1 && Number(row?.rateRub) > 0);
          const snapshots = Array.isArray(basis?.materialPriceSnapshots) ? basis.materialPriceSnapshots : [];
          const zincMaterial = snapshots.some((snapshot) => snapshot?.status !== 'failed' && Array.isArray(snapshot?.rows) && snapshot.rows.some((row) => row?.materialId === 'zinc' && Number(row?.thicknessMm) === 1 && Number(row?.rubPerTon) > 0));
          console.log(`SMOKE_ZINC_1_LASER_RATE=${zincLaser ? 'AVAILABLE' : 'UNAVAILABLE'}`);
          console.log(`SMOKE_ZINC_1_MATERIAL_PRICE=${zincMaterial ? 'AVAILABLE' : 'UNAVAILABLE'}`);
          if (!zincLaser || !zincMaterial) ok = false;
          if (!ok) process.exit(1);
          NODE

          if sudo -iu nodejs test -r "$BASIS_FILE"; then
            echo "PRIVATE_CALCULATION_BASIS=READABLE_BY_RUNTIME"
          else
            echo "PRIVATE_CALCULATION_BASIS=UNAVAILABLE_TO_RUNTIME"
            exit 1
          fi
          if sudo -iu nodejs test -w "$REPORT_ROOT"; then
            echo "PRIVATE_REPORT_ROOT=WRITABLE_BY_RUNTIME"
          else
            echo "PRIVATE_REPORT_ROOT=UNAVAILABLE_TO_RUNTIME"
            exit 1
          fi
          REMOTE
