name: Verify project package

on:
  push:
    branches:
      - feat/project-galleries-exhibitions-obninsk-sep12
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-project-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · tests · build · SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
      NEXT_PUBLIC_YM_COUNTER_ID: "112542227"
      NEXT_PUBLIC_YM_WEBVISOR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: SEO audit
        env:
          NODE_ENV: production
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3011
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3011 > /tmp/steelprodukt-seo-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3011/robots.txt > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/steelprodukt-seo-audit-server.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/steelprodukt-seo-audit-server.log
            echo "Built Next.js server did not become ready on 127.0.0.1:3011."
            exit 1
          fi

          npm run seo:audit

  diagnose-private-calculation-runtime:
    name: Check private calculation runtime readiness
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_HOST"
          test -n "$BEGET_SSH_PORT"
          test -n "$BEGET_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Check required private keys without reading values
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"
          missing=0
          for key in \
            STEEL_PRODUCT_METAL_MULTIPLIER \
            STEEL_PRODUCT_DRAW_PCT \
            STEEL_PRODUCT_FINAL_PCT \
            STEEL_PRODUCT_FIXED_ADD_RUB \
            STEEL_PRODUCT_FIXED_ADD_ENABLED \
            STEEL_PRODUCT_ROUND_STEP_RUB
          do
            if grep -Eq "^${key}=.+$" "$ENV_FILE"; then
              echo "${key}=SET"
            else
              echo "${key}=MISSING"
              missing=1
            fi
          done

          if [ -r /var/lib/steelprodukt/production/calculation-basis.json ]; then
            echo "PRIVATE_CALCULATION_BASIS=READABLE"
          else
            echo "PRIVATE_CALCULATION_BASIS=UNAVAILABLE"
            missing=1
          fi
          if [ -d /var/lib/steelprodukt/production/reports ] && [ -w /var/lib/steelprodukt/production/reports ]; then
            echo "PRIVATE_REPORT_ROOT=WRITABLE"
          else
            echo "PRIVATE_REPORT_ROOT=UNAVAILABLE"
            missing=1
          fi
          exit "$missing"
          REMOTE
