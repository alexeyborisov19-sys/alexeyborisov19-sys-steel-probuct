name: Secrets check 2026-10-03 (encrypted, read-only)

# Temporary. Runs only on this branch. Lists secret NAMES with a type guess (never values), probes
# Yandex Cloud keys against Search API, and commits the result back ENCRYPTED (repo and logs are public).
on:
  push:
    branches:
      - claude/search-check-20261003
    paths:
      - ".github/workflows/secrets-check-20261003.yml"
      - ".search-check/secrets.mjs"

permissions:
  contents: write

concurrency:
  group: secrets-check-20261003
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/search-check-20261003
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inventory secrets and probe Search API
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .search-check/secrets.mjs

      - name: Encrypt and commit the result
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/secrets-check.json -out .search-check/secrets.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey .search-check/public-key.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/k.txt -out .search-check/secrets-key.enc
          shred -u /tmp/k.txt /tmp/secrets-check.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .search-check/secrets.enc .search-check/secrets-key.enc
          git commit -m "Encrypted secrets check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin claude/search-check-20261003
          git push origin HEAD:claude/search-check-20261003
