name: Fix bending equipment count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-fix-bending-equipment-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Correct bending equipment facts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/(public)/production/page.tsx'): [
                  (
                      '["4 листогибочных комплекса", "Формируем стабильную геометрию деталей и повторяемость партии."],',
                      '["3 листогибочных комплекса + панельгиб", "Формируем стабильную геометрию деталей и повторяемость партии."],'
                  ),
              ],
              Path('data/assistant-knowledge.ts'): [
                  (
                      '"4 листогибочных комплекса и панельгиб для повторяемой геометрии деталей.",',
                      '"3 листогибочных комплекса и панельгиб для повторяемой геометрии деталей.",'
                  ),
                  (
                      '"На производстве работают четыре листогибочных комплекса и панельгиб. Для проверки гибки нужны материал, толщина, длина гиба, углы, радиусы и чертёж детали. Какой материал и толщина заложены?";',
                      '"На производстве работают три листогибочных комплекса и панельгиб. Для проверки гибки нужны материал, толщина, длина гиба, углы, радиусы и чертёж детали. Какой материал и толщина заложены?";'
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one occurrence in {path}: {old[:80]} (found {count})')
                  text = text.replace(old, new, 1)
              if '4 листогибочных' in text or 'четыре листогибочных' in text:
                  raise SystemExit(f'Old bending equipment count remains in {path}')
              path.write_text(text)
          PY

      - name: Commit corrected equipment facts
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(public)/production/page.tsx' 'data/assistant-knowledge.ts'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: correct bending equipment count"
          git push origin HEAD:main
