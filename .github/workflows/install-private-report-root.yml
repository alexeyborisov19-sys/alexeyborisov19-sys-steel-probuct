name: Configure private production report storage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-report-root.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Configure confidential report directory and reload runtime
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          REPORT_ROOT=/var/lib/steelprodukt/production-reports
          install -o nodejs -g nodejs -m 700 -d "$REPORT_ROOT"
          ENV_FILE="$APP_PATH/.env.production"
          touch "$ENV_FILE"
          if grep -q '^STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT=' "$ENV_FILE"; then
            sed -i "s|^STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT=.*|STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT=$REPORT_ROOT|" "$ENV_FILE"
          else
            printf '%s\n' "STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT=$REPORT_ROOT" >> "$ENV_FILE"
          fi
          chmod 600 "$ENV_FILE"
          sudo -iu nodejs test -w "$REPORT_ROOT"
          sudo -iu nodejs bash -lc "cd '$APP_PATH' && pm2 restart steelprodukt --update-env"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Private report storage configured and runtime reloaded."
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after restart."
          exit 1
          REMOTE
