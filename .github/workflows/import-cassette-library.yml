name: Import approved cassette IFC library

on:
  push:
    branches: ['feat/bim-library-20261014']
    paths: ['release-assets/SteelProdukt_BIM_Web_2026-10-14.zip']

permissions:
  contents: write

concurrency:
  group: cassette-library-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the upload commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify and install the approved files
        run: python3 scripts/install-cassette-library.py
      - name: Verify installed release
        run: python3 scripts/install-cassette-library.py --check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for the library audit
        run: npx playwright install --with-deps chromium
      - name: Check browser and download behavior
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory public > /tmp/cassette-library-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/bim/metallokassety/index.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-cassette-library.mjs
      - name: Save library audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cassette-library-browser-audit
          path: artifacts/cassette-library
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit assets to the same feature branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = 'feat/bim-library-20261014'
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bim/metallokassety
          git rm release-assets/SteelProdukt_BIM_Web_2026-10-14.zip
          git commit -m 'Add verified cassette IFC library assets'
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
      - name: Record remaining release gate
        run: |
          echo 'Assets imported into the feature branch. Production has NOT been published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the pull request, run site checks, merge and verify Publish to Beget.' >> "$GITHUB_STEP_SUMMARY"
