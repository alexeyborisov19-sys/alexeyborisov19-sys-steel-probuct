name: Diagnose PD reset

on:
  push:
    paths:
      - '.github/workflows/install-diagnose-pd-reset.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose prerequisites
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          ENV_FILE="$APP_PATH/.env.production"
          DB_PATH="$(sed -n 's/^PD_ADMIN_DB_PATH=//p' "$ENV_FILE" | head -n1)"

          echo "SCRIPT_EXISTS=$(test -f scripts/pd-reset-admin-password.ts && echo true || echo false)"
          echo "PD_ENABLED=$(grep -q '^PD_ADMIN_ENABLED=true$' "$ENV_FILE" && echo true || echo false)"
          echo "DB_EXISTS=$(test -f "$DB_PATH" && echo true || echo false)"
          echo "DB_MODE=$(stat -c '%a' "$DB_PATH")"
          echo "DB_DIR_MODE=$(stat -c '%a' "$(dirname "$DB_PATH")")"
          echo "DB_OWNER=$(stat -c '%U:%G' "$DB_PATH")"

          NODE_ENV=production node --env-file="$ENV_FILE" --import tsx --input-type=module <<'NODE'
          import { readPdAdminConfig } from "./lib/pd-admin/config.ts";
          import { openPdDatabase, closePdDatabase, migrationStatus } from "./lib/pd-admin/db/database.ts";
          const cfg = readPdAdminConfig(process.env, { production: true, cwd: process.cwd() });
          console.log("CONFIG_VALID=true");
          const db = openPdDatabase({ applyMigrations: false, databasePath: cfg.databasePath, environment: process.env });
          try {
            const pending = migrationStatus(db).filter((x) => x.state === "pending").length;
            const user = db.prepare("SELECT username, role, is_active, must_change_password FROM users WHERE username = 'admin'").get();
            console.log("PENDING_MIGRATIONS=" + pending);
            console.log("ADMIN_EXISTS=" + Boolean(user));
            if (user) {
              console.log("ADMIN_ACTIVE=" + Boolean(user.is_active));
              console.log("ADMIN_ROLE=" + String(user.role));
              console.log("MUST_CHANGE_PASSWORD=" + Boolean(user.must_change_password));
            }
          } finally {
            closePdDatabase(db, cfg.databasePath);
          }
          NODE
          REMOTE
