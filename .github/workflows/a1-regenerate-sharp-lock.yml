name: Regenerate sharp runtime lockfile

on:
  push:
    branches:
      - audit/seo-design-tail-a-20260917
    paths:
      - .github/workflows/a1-regenerate-sharp-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: audit/seo-design-tail-a-20260917

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use repository npm version
        run: npm install --global npm@11.16.0 --no-audit --no-fund

      - name: Move sharp to runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          const sharp = pkg.devDependencies?.sharp;
          if (sharp !== "0.35.3") {
            throw new Error(`Expected sharp 0.35.3 in devDependencies, got ${String(sharp)}`);
          }
          delete pkg.devDependencies.sharp;
          pkg.dependencies.sharp = sharp;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          test "$(node -p "require('./package.json').dependencies.sharp")" = "0.35.3"
          test "$(node -p "String(require('./package.json').devDependencies.sharp)")" = "undefined"

      - name: Regenerate package lock with npm install
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.16.0"
          npm install --no-audit --no-fund

      - name: Verify only package metadata changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'package-lock.json\npackage.json'

      - name: Commit regenerated package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Перенести sharp в runtime dependencies"
          git push origin HEAD:audit/seo-design-tail-a-20260917
