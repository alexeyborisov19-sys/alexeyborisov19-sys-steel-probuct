name: Audit PD admin readiness 2

on:
  push:
    paths:
      - '.github/workflows/install-audit-pd-admin-readiness-2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Check readiness
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"

          grep -q '^PD_SEARCH_HMAC_KEY=.' "$ENV_FILE" && echo 'PD_SEARCH_HMAC_KEY=present' || echo 'PD_SEARCH_HMAC_KEY=missing'
          grep -q '^PD_SESSION_HASH_KEY=.' "$ENV_FILE" && echo 'PD_SESSION_HASH_KEY=present' || echo 'PD_SESSION_HASH_KEY=missing'
          grep -q '^PD_AUDIT_CHAIN_KEY=.' "$ENV_FILE" && echo 'PD_AUDIT_CHAIN_KEY=present' || echo 'PD_AUDIT_CHAIN_KEY=missing'
          grep -q '^PD_ADMIN_DB_PATH=.' "$ENV_FILE" && echo 'PD_ADMIN_DB_PATH=present' || echo 'PD_ADMIN_DB_PATH=missing'
          grep -q '^PD_EXPORT_PATH=.' "$ENV_FILE" && echo 'PD_EXPORT_PATH=present' || echo 'PD_EXPORT_PATH=missing'
          grep -q '^PD_ADMIN_ENABLED=true$' "$ENV_FILE" && echo 'PD_ADMIN_ENABLED=true' || echo 'PD_ADMIN_ENABLED=false'
          REMOTE
