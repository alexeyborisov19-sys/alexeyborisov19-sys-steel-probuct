name: Harden supply-only product claims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-supply-only-product-claims.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qualify product-system claims and make supply-only scope explicit
        run: python3 .agents/scripts/harden-supply-only-claims.py

      - name: Commit hardened supply-only copy
        run: |
          git config user.name "steelprodukt-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.ts data/solution-details.ts tests/supply-only-product-claims.test.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "content: clarify supply-only scope and project-dependent facade claims"
          git push origin HEAD:main
