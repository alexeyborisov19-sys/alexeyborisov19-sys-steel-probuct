name: Verify integrated no-spend quote release
on:
  push:
    branches: [release/ai-engineer-integrated-20260921]
    paths: [.github/workflows/quote-integrated-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: quote-integrated-source
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'alexeyborisov19-sys/alexeyborisov19-sys-steel-probuct' && github.ref == 'refs/heads/release/ai-engineer-integrated-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
      NEXT_PUBLIC_YM_COUNTER_ID: '112542227'
      NEXT_PUBLIC_YM_WEBVISOR: 'true'
      STEEL_PRODUCT_PAID_SERVICES_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve latest main without publishing it
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Restore the exact verified patch and resolve reviewed overlapping files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          hashes=['5ff7547a2c872afee9a5ae099191297182972f55','eae8eab4d0e564c82b960a29c4e83496b378da44','b24dbf4b691bc2abf8a449a9d8f6dfb61ea43d48','b016d959354514fad6b85cf3c0a82f4a0544d19c','7ec2b4e6dc93ab3107bf68419ca4051845d7f4a9']
          parts=[]
          for index,expected in enumerate(hashes,1):
              raw=(root/f'.github/quote-release-patch.{index}.b64').read_text().strip()
              if index==1: raw=raw.replace('Chyx9eo93644Alf4','Chyx9eo9364Alf4').replace('HW/G3VzVRRs','HW/GzVzVRRs')
              data=raw.encode('ascii')
              if hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()!=expected: raise SystemExit('Transport checksum mismatch')
              parts.append(raw)
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          if hashlib.sha256(patch).hexdigest()!='304003b63ca4ee73a014e079e398546b56310e1f5f0dd2433d57e57fdaa6628a': raise SystemExit('Patch checksum mismatch')
          folder=pathlib.Path(tempfile.mkdtemp(prefix='quote-source-'))
          patchfile=folder/'source.patch';patchfile.write_bytes(patch)
          base=folder/'base'
          subprocess.run(['git','worktree','add','--detach',str(base),'e59cef680461c0edef0c35c68e5534383fd89458'],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],cwd=base,check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only'],cwd=base).decode().splitlines()
          for name in names:
              if '..' in pathlib.PurePosixPath(name).parts or not (name=='.env.example' or name.startswith(('app/','components/','lib/','tests/','docs/'))): raise SystemExit('Unexpected patch path')
              # These overlapping revisions were inspected against the named snapshot.
              # A newer concurrent edit must stop, never be silently overwritten.
              subprocess.run(['git','diff','--quiet','8ad5fb89ba5750a653e533c90f90b1b1b41831ce','HEAD','--',name],cwd=root,check=True)
              source=base/name; target=root/name
              if target.is_symlink() or source.is_symlink(): raise SystemExit('Unexpected symlink')
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(source.read_bytes())
          for name in ['lib/server/quote-engine/cassette-budget-review.ts','lib/server/quote-engine/session-snapshot.ts']:
              subprocess.run(['git','diff','--quiet','8ad5fb89ba5750a653e533c90f90b1b1b41831ce','HEAD','--',name],cwd=root,check=True)
              subprocess.run(['git','rm',name],cwd=root,check=True)
          subprocess.run(['python3','scripts/finalize-quote-free-mode.py'],cwd=root,check=True)
          print('Integrated tested source paths:',len(names))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Full regression tests without real external providers
        run: |
          set +e
          npm test > /tmp/quote-integrated-tests.log 2>&1
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ]; then
            awk '/^not ok / { p=1 } p { print } p && /^  \.\.\./ { p=0 }' /tmp/quote-integrated-tests.log
          fi
          tail -n 12 /tmp/quote-integrated-tests.log
          exit "$RESULT"
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
      - name: SEO regression audit
        env:
          NODE_ENV: production
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3011
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3011 > /tmp/quote-release-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3011/robots.txt > /dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          npm run seo:audit
      - name: Commit verified integration on release branch only
        run: |
          set -euo pipefail
          BRANCH=release/ai-engineer-integrated-20260921
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git add app components lib tests docs .env.example
          git rm .github/quote-release-patch.{1,2,3,4,5}.b64
          git diff --cached --check
          git commit -m 'feat(quote): integrate all calculators, local AI, no-spend gates and quote-to-lead audit'
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'Verified integrated source: '
          git rev-parse HEAD
      - name: Delete only our temporary transfer artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 10633800382 10634494244 10634673212; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            echo "Temporary artifact $id: HTTP $code"
          done
