name: Check private calculation basis status

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-basis-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Check protected calculation configuration without printing values
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' node -" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const appPath = process.env.APP_PATH;
          const envPath = path.join(appPath, '.env.production');
          const envText = fs.existsSync(envPath) ? fs.readFileSync(envPath, 'utf8') : '';
          const value = (key) => {
            const match = envText.match(new RegExp(`^${key}=(.*)$`, 'm'));
            return match ? match[1].trim().replace(/^['"]|['"]$/g, '') : '';
          };
          const basisPath = value('STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH');
          const reportRoot = value('STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT');
          const commercialKeys = [
            'STEEL_PRODUCT_COMMERCIAL_MATERIAL_MULTIPLIER',
            'STEEL_PRODUCT_COMMERCIAL_DRAW_PCT',
            'STEEL_PRODUCT_COMMERCIAL_FINAL_PCT',
            'STEEL_PRODUCT_COMMERCIAL_FIXED_ADD_RUB',
            'STEEL_PRODUCT_COMMERCIAL_FIXED_ADD_ENABLED',
            'STEEL_PRODUCT_COMMERCIAL_ROUND_STEP_RUB',
          ];
          console.log(`basis_env=${basisPath ? 'present' : 'missing'}`);
          console.log(`report_env=${reportRoot ? 'present' : 'missing'}`);
          console.log(`commercial_env=${commercialKeys.every((key) => value(key)) ? 'complete' : 'incomplete'}`);
          if (!basisPath || !fs.existsSync(basisPath)) {
            console.log('basis_file=missing');
            process.exit(0);
          }
          console.log('basis_file=present');
          try {
            const basis = JSON.parse(fs.readFileSync(basisPath, 'utf8'));
            console.log(`basis_json=valid`);
            console.log(`laser_rows=${Array.isArray(basis?.rateBook?.laserRubPerM) ? basis.rateBook.laserRubPerM.length : 0}`);
            console.log(`material_snapshots=${Array.isArray(basis?.materialPriceSnapshots) ? basis.materialPriceSnapshots.length : 0}`);
            for (const key of ['bendRubEach','weldRubPerM','powderRubPerM2','assemblyRubPerHour','surfacePreparationRubPerM2','packagingRubEach']) {
              console.log(`${key}=${basis?.rateBook?.[key] ? 'present' : 'missing'}`);
            }
          } catch {
            console.log('basis_json=invalid');
          }
          NODE
