name: Verify site feature branch (temporary)

# Runs typecheck, tests and build for the branch named in .yandex-report/verify-target
# and commits the log back to this branch. No secrets are used.
on:
  push:
    branches:
      - claude/yandex-search-report
    paths:
      - ".github/workflows/verify-feature-branch.yml"
      - ".yandex-report/verify-target"

permissions:
  contents: write

concurrency:
  group: verify-feature-branch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/yandex-search-report
          path: report

      - id: target
        run: |
          read -r BRANCH SHA < report/.yandex-report/verify-target
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install, typecheck, lint, test, build
        working-directory: site
        shell: bash
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/verify.log"
          echo "target ${{ steps.target.outputs.branch }} @ ${{ steps.target.outputs.sha }}" > "$LOG"
          step() { local name="$1"; shift; echo "== $name" >> "$LOG"; "$@" > /tmp/step.log 2>&1; local code=$?; tail -n 200 /tmp/step.log >> "$LOG"; echo "== $name exit $code" >> "$LOG"; }
          step "npm ci" npm ci --no-audit --no-fund
          step "typecheck" npm run typecheck
          step "lint" npm run lint
          step "test" npm test
          step "build" npm run build
          exit 0

      - name: Commit the log
        working-directory: report
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/verify.log" .yandex-report/verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .yandex-report/verify.log
          git commit -m "Verify log for ${{ steps.target.outputs.branch }} ${{ steps.target.outputs.sha }}"
          git push origin HEAD:claude/yandex-search-report
