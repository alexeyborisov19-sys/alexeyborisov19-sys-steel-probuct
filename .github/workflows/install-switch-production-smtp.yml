name: Switch production SMTP to VK WorkSpace

on:
  push:
    paths:
      - '.github/workflows/install-switch-production-smtp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Validate and atomically switch production SMTP
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"
          grep -q '^SMTP_PASSWORD=.' "$ENV_FILE"

          ENV_TMP="$(mktemp "$APP_PATH/.env.smtp-candidate.XXXXXX")"
          cleanup() {
            rm -f "${ENV_TMP:-}"
          }
          trap cleanup EXIT

          grep -v -E '^(SMTP_HOST|SMTP_PORT|SMTP_SECURE|SMTP_USER|SMTP_FROM|SMTP_ENVELOPE_FROM|QUOTE_RECIPIENT)=' "$ENV_FILE" > "$ENV_TMP" || true
          {
            printf '%s\n' 'SMTP_HOST=smtp.mail.ru'
            printf '%s\n' 'SMTP_PORT=465'
            printf '%s\n' 'SMTP_SECURE=true'
            printf '%s\n' 'SMTP_USER=info@steelprodukt.ru'
            printf '%s\n' 'SMTP_FROM=info@steelprodukt.ru'
            printf '%s\n' 'SMTP_ENVELOPE_FROM=info@steelprodukt.ru'
            printf '%s\n' 'QUOTE_RECIPIENT=info@steelprodukt.ru'
          } >> "$ENV_TMP"

          chmod 0600 "$ENV_TMP"

          cd "$APP_PATH"
          node --env-file="$ENV_TMP" --input-type=module <<'NODE'
          import nodemailer from "nodemailer";
          const transporter = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port: Number(process.env.SMTP_PORT),
            secure: process.env.SMTP_SECURE === "true",
            connectionTimeout: 10000,
            greetingTimeout: 10000,
            socketTimeout: 20000,
            auth: {
              user: process.env.SMTP_USER,
              pass: process.env.SMTP_PASSWORD,
            },
          });
          await transporter.verify();
          console.log("Candidate VK WorkSpace SMTP authentication verified.");
          NODE

          chown nodejs:nodejs "$ENV_TMP"
          mv "$ENV_TMP" "$ENV_FILE"
          ENV_TMP=""
          trap - EXIT

          sudo -iu nodejs bash -lc "cd '$APP_PATH' && pm2 startOrReload ecosystem.config.cjs --env production --update-env && pm2 save"
          echo "Production SMTP switched to VK WorkSpace."
          REMOTE
