name: Public release proof 30 September
on:
  push:
    branches: [diagnostic/public-release-proof-20260930]
    paths: [.github/workflows/public-release-proof-20260930.yml]
permissions:
  contents: read
concurrency:
  group: steelprodukt-public-proof-20260930
  cancel-in-progress: false
# Run 36705417957 stopped before any quote POST at the hidden online CTA.
# This run uses the corrected responsive selector; retries remain non-sending.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
      SEO_AUDIT_BASE_URL: https://www.steelprodukt.ru
      ALLOW_SYNTHETIC_SUBMISSIONS: ${{ github.run_attempt == 1 && 'YES' || 'NO' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Require the exact production deployment to succeed
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url='https://api.github.com/repos/alexeyborisov19-sys/alexeyborisov19-sys-steel-probuct/actions/runs/36705192147'
          for attempt in range(20):
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SteelProdukt-release-proof'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  run=json.load(response)
              assert run['head_sha']=='6f738f7e204d183aaeee4ef409a2293552c6bf3a'
              if run['status']=='completed':
                  assert run['conclusion']=='success', 'Production deployment did not succeed'
                  print('DEPLOYMENT_VERIFIED',run['id'],run['head_sha'],run['conclusion'])
                  break
              time.sleep(20)
          else:
              raise RuntimeError('Production verification timed out; no test enquiries sent')
          PY
      - name: Browser checks and exactly two marked synthetic enquiries
        run: node .github/diagnostics/public-release-proof.mjs
      - name: Production SEO and legacy redirects
        if: always()
        run: npm run seo:audit
      - name: Production browser accessibility and layout
        if: always()
        run: npm run browser:audit
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-proof
          path: |
            output/public-release-proof/
            output/browser-audit/
          if-no-files-found: warn
          retention-days: 14
