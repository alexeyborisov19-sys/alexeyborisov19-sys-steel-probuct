name: Public release proof 30 September
on:
  push:
    branches: [diagnostic/public-release-proof-20260930]
    paths: [.github/workflows/public-release-proof-20260930.yml]
permissions:
  contents: read
concurrency:
  group: steelprodukt-public-proof-20260930
  cancel-in-progress: false
# Both authorized enquiries succeeded in run 36706177253. Never resend them.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
      SEO_AUDIT_BASE_URL: https://www.steelprodukt.ru
      ALLOW_SYNTHETIC_SUBMISSIONS: 'NO'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Require the final production deployment to succeed
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url='https://api.github.com/repos/alexeyborisov19-sys/alexeyborisov19-sys-steel-probuct/actions/runs/36706199764'
          for attempt in range(20):
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SteelProdukt-release-proof'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  run=json.load(response)
              assert run['head_sha']=='0922f5273ec72ef32aa00ad1fe64781a22a9c91d'
              if run['status']=='completed':
                  assert run['conclusion']=='success', 'Production deployment did not succeed'
                  print('DEPLOYMENT_VERIFIED',run['id'],run['head_sha'],run['conclusion'])
                  break
              time.sleep(20)
          else:
              raise RuntimeError('Production verification timed out')
          PY
      - name: Public CTA and validation checks without sending
        run: node .github/diagnostics/public-release-proof.mjs
      - name: Verify published BIM heading and enquiry links
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium, expect } from '@playwright/test';
          const browser=await chromium.launch();
          try {
            const base='https://www.steelprodukt.ru';
            const page=await browser.newPage({viewport:{width:390,height:900},reducedMotion:'reduce'});
            const response=await page.goto(base+'/products/metallokassety/bim?utm_source=technical_audit&utm_campaign=final_release_check',{waitUntil:'networkidle',timeout:60000});
            assert.equal(response.status(),200);
            await expect(page.locator('#bim-config-title')).toHaveText('Настройка BIM-модели металлокассет');
            for(const label of ['Рассчитать металлокассеты','Передать инженеру']) {
              const link=page.locator('#bim-passport').getByRole('link',{name:label,exact:true});
              await expect.poll(async()=>new URL(await link.getAttribute('href'),base).searchParams.get('utm_campaign')).toBe('final_release_check');
            }
            console.log('BIM_RELEASE_PROOF',JSON.stringify({http:200,heading:true,attributionLinks:2,submissions:0}));
            const redirect=await fetch('https://saquapequoke.beget.app/products/metallokassety?utm_source=technical_audit',{redirect:'manual',signal:AbortSignal.timeout(20000)});
            const location=redirect.headers.get('location');
            console.log('TECHNICAL_HOST_REDIRECT',JSON.stringify({status:redirect.status,location}));
            assert.ok([301,308].includes(redirect.status));
            assert.equal(new URL(location).hostname,'www.steelprodukt.ru');
            assert.equal(new URL(location).pathname,'/products/metallokassety');
          } finally {await browser.close();}
          JS
      - name: Production SEO and legacy redirects
        if: always()
        run: npm run seo:audit
      - name: Production browser accessibility and layout
        if: always()
        run: npm run browser:audit
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-proof
          path: |
            output/public-release-proof/
            output/browser-audit/
          if-no-files-found: warn
          retention-days: 14
