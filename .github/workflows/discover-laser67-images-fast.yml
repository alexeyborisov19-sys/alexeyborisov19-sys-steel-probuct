name: Discover Laser67 images fast

on:
  push:
    branches:
      - check-yandex-api-20260919
    paths:
      - '.github/workflows/discover-laser67-images-fast.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect product images
        run: |
          cat > discover-fast.mjs <<'EOF'
          import { chromium } from 'playwright';
          const urls = [
            'https://laser67.ru/products/category/metallokassety-fasadnye',
            'https://laser67.ru/products/category/korpusa-metallicheskie',
            'https://laser67.ru/products/category/zakladnye-detali-iz-metalla',
            'https://laser67.ru/products/category/pozharnye-shkafy'
          ];

          const browser = await chromium.launch({headless:true});
          for (const url of urls) {
            const page = await browser.newPage({viewport:{width:1365,height:1600}});
            const seen = new Map();
            page.on('response', async res => {
              try {
                const ct=(await res.headerValue('content-type'))||'';
                if (ct.startsWith('image/')) {
                  const u=res.url();
                  if (!/favicon|logo|icon|sprite/i.test(u)) seen.set(u,{src:u,ct,source:'network'});
                }
              } catch {}
            });
            try {
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForTimeout(2500);
              for (let y=0; y<Math.min(await page.evaluate(()=>document.body.scrollHeight),7000); y+=900) {
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(120);
              }
              await page.waitForTimeout(1200);
              const dom=await page.evaluate(() => {
                const a=[];
                document.querySelectorAll('img').forEach(img=>a.push({
                  src:img.currentSrc||img.src||'',
                  alt:img.alt||'',
                  w:img.naturalWidth||0,
                  h:img.naturalHeight||0,
                  source:'img'
                }));
                document.querySelectorAll('*').forEach(el=>{
                  const bg=getComputedStyle(el).backgroundImage;
                  if(bg && bg!=='none'){
                    for(const m of bg.matchAll(/url\(["']?([^"')]+)["']?\)/g)){
                      a.push({src:m[1],alt:'[background]',w:el.clientWidth||0,h:el.clientHeight||0,source:'background'});
                    }
                  }
                });
                return a;
              });
              for (const x of dom) {
                if (!x.src || /favicon|logo|icon|sprite/i.test(x.src)) continue;
                if (!seen.has(x.src)) seen.set(x.src,x);
                else Object.assign(seen.get(x.src),x);
              }
              const out=[...seen.values()].filter(x => (x.w||0)>=180 || (x.h||0)>=180 || x.source==='network');
              console.log('PAGE='+url);
              console.log('IMAGES='+JSON.stringify(out));
            } catch(e) {
              console.log('ERROR='+url+' '+String(e));
            }
            await page.close();
          }
          await browser.close();
          EOF
          node discover-fast.mjs
