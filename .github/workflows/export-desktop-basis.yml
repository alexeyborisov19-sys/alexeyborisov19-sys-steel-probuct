name: Export approved calculation basis for local desktop
on:
  push:
    branches: [feat/cad-tier-split-final-20260921]
    paths: ['.github/workflows/export-desktop-basis.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the calculation basis and encrypt for owner
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "cd '$BEGET_APP_PATH' && printf '%s' '' | base64 -d | sudo -n node" > desktop-basis.encrypted.json
          test -s desktop-basis.encrypted.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-basis-encrypted
          path: desktop-basis.encrypted.json
          retention-days: 1
