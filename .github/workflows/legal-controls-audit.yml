name: Audit legal runtime controls

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish to Beget"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify_public:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current legal editions
        uses: actions/checkout@v5
      - name: Confirm all eight legal pages are published
        run: python3 scripts/audit-live-legal-publication.py

  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect retention and backups without personal data
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n python3 - "$APP_PATH" <<'PYTHON'
          import sys, pathlib, sqlite3, json, datetime, subprocess
          app=pathlib.Path(sys.argv[1]); env={}
          for line in (app/'.env.production').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"').strip("'")
          now=datetime.datetime.now(datetime.timezone.utc)
          issues=[]
          if env.get('PD_ADMIN_ENABLED')!='true': issues.append('ADMIN_CONFIGURATION_REVIEW')
          for key,default in [('QUOTE_STORAGE_PATH','/var/lib/steelprodukt/quote-leads'),('ASSISTANT_LEAD_STORAGE_PATH','/var/lib/steelprodukt/assistant-leads'),('CONSENT_AUDIT_STORAGE_PATH','/var/lib/steelprodukt/consent-audit')]:
              root=pathlib.Path(env.get(key) or default); count=expired=invalid=0
              for file in root.glob('*.json'):
                  if file.is_symlink(): invalid+=1; continue
                  try:
                      record=json.loads(file.read_text()); count+=1
                      created=datetime.datetime.fromisoformat(str(record['createdAt']).replace('Z','+00:00'))
                      days=int(record['retentionDays'])
                      if days<=0: raise ValueError()
                      expired+=int(created+datetime.timedelta(days=days)<=now)
                  except Exception: invalid+=1
              if not root.is_dir() or expired or invalid:
                  issues.append(key+'_REVIEW')
          dbpath=pathlib.Path(env.get('PD_ADMIN_DB_PATH') or '/var/lib/steelprodukt/admin/personal-data.sqlite')
          if dbpath.is_file():
              con=sqlite3.connect(dbpath.as_uri()+'?mode=ro',uri=True)
              for table,column in [('lead_workflow','internal_status'),('deletion_jobs','stage4_status')]:
                  try: con.execute('SELECT '+column+' FROM '+table+' LIMIT 1').fetchone()
                  except sqlite3.Error: issues.append('PD_DATABASE_SCHEMA_REVIEW')
              con.close()
          else:
              issues.append('PD_DATABASE_MISSING')
          root=pathlib.Path('/var/backups/steelprodukt')
          files=[f for f in root.glob('steelprodukt-pd-*.tar.gz.enc') if f.is_file() and not f.is_symlink()]
          # Do not publish customer volume, storage locations or backup inventory in public Actions logs.
          if not files or now.timestamp()-max(f.stat().st_mtime for f in files)>48*3600:
              issues.append('LOCAL_BACKUP_STALE_OR_MISSING')
          result=subprocess.run(['systemctl','is-active','steelprodukt-pd-offsite-backup.timer'],capture_output=True,text=True)
          for unit in ['steelprodukt-pd-retention-check.timer','steelprodukt-pd-export-expiry.timer']:
              state=subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True).stdout.strip()
              print(unit+'='+state)
              if state!='active': issues.append('INACTIVE_'+unit)
          report=dbpath.parent/'retention-monitor.json'
          if report.is_file():
              value=json.loads(report.read_text())
              if value.get('status') != 'NO_EXPIRED_LEADS': issues.append('RETENTION_REVIEW_REQUIRED')
              try:
                  checked=datetime.datetime.fromisoformat(str(value['checkedAt']).replace('Z','+00:00'))
                  if now-checked>datetime.timedelta(hours=48): issues.append('RETENTION_REPORT_STALE')
              except (KeyError, ValueError, TypeError): issues.append('RETENTION_REPORT_INVALID')
          else:
              issues.append('RETENTION_REPORT_MISSING')
          print('LEGAL_BACKUP_TIMER='+('OK' if result.stdout.strip()=='active' else 'REVIEW_REQUIRED'))
          if result.stdout.strip()!='active': issues.append('OFFSITE_BACKUP_TIMER_INACTIVE')
          print('LEGAL_RUNTIME_AUDIT='+('REVIEW_REQUIRED' if issues else 'OK'))
          if issues:
              print('::error title=Personal data controls require review::'+','.join(sorted(set(issues))))
              raise SystemExit(2)
          PYTHON
          REMOTE
