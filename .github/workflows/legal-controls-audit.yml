name: Audit legal runtime controls

on:
  push:
    paths:
      - '.github/workflows/legal-controls-audit.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish to Beget"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Inspect retention and backups without personal data
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n python3 - "$APP_PATH" <<'PYTHON'
          import sys, pathlib, sqlite3, json, datetime, subprocess
          app=pathlib.Path(sys.argv[1]); env={}
          for line in (app/'.env.production').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"').strip("'")
          print('PD_ADMIN_ENABLED='+str(env.get('PD_ADMIN_ENABLED')=='true').lower())
          now=datetime.datetime.now(datetime.timezone.utc)
          for key,default in [('QUOTE_STORAGE_PATH','/var/lib/steelprodukt/quote-leads'),('ASSISTANT_LEAD_STORAGE_PATH','/var/lib/steelprodukt/assistant-leads'),('CONSENT_AUDIT_STORAGE_PATH','/var/lib/steelprodukt/consent-audit')]:
              root=pathlib.Path(env.get(key) or default); count=expired=invalid=0
              for file in root.glob('*.json'):
                  if file.is_symlink(): invalid+=1; continue
                  try:
                      record=json.loads(file.read_text()); count+=1
                      created=datetime.datetime.fromisoformat(str(record['createdAt']).replace('Z','+00:00'))
                      days=int(record['retentionDays'])
                      if days<=0: raise ValueError()
                      expired+=int(created+datetime.timedelta(days=days)<=now)
                  except Exception: invalid+=1
              print(key+': '+json.dumps({'exists':root.is_dir(),'records':count,'expired':expired,'invalid':invalid}))
          dbpath=pathlib.Path(env.get('PD_ADMIN_DB_PATH') or '/var/lib/steelprodukt/admin/personal-data.sqlite')
          if dbpath.is_file():
              con=sqlite3.connect(dbpath.as_uri()+'?mode=ro',uri=True)
              for table,column in [('lead_workflow','internal_status'),('deletion_jobs','stage4_status')]:
                  try: print(table+': '+json.dumps(con.execute('SELECT '+column+', COUNT(*) FROM '+table+' GROUP BY '+column).fetchall()))
                  except sqlite3.Error: print(table+': SCHEMA_UNAVAILABLE')
              con.close()
          root=pathlib.Path('/var/backups/steelprodukt')
          files=[f for f in root.glob('steelprodukt-pd-*.tar.gz.enc') if f.is_file() and not f.is_symlink()]
          print('LOCAL_BACKUP='+json.dumps({'count':len(files),'older_than_30d':sum(now.timestamp()-f.stat().st_mtime>30*86400 for f in files),'latest_age_hours':round((now.timestamp()-max(f.stat().st_mtime for f in files))/3600,1) if files else None}))
          result=subprocess.run(['systemctl','is-active','steelprodukt-pd-offsite-backup.timer'],capture_output=True,text=True)
          for unit in ['steelprodukt-pd-retention-check.timer','steelprodukt-pd-export-expiry.timer']:
              print(unit+'='+subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True).stdout.strip())
          report=dbpath.parent/'retention-monitor.json'
          if report.is_file():
              value=json.loads(report.read_text()); print('RETENTION_CHECK='+json.dumps({key:value.get(key) for key in ['checkedAt','examined','indexed','expired','status','deletionPerformed','findings']}))
          print('BACKUP_TIMER='+result.stdout.strip())
          # BEGIN OFFSITE DIAGNOSTIC
          import os, re

          # Read only the last invocation of this unit. Raw stdout/stderr and exception
          # text stay on the server; every emitted value is an enum, bounded count or
          # parsed number/date. Silent shell tests (including hash checks) stay UNKNOWN.
          unit = 'steelprodukt-pd-offsite-backup.service'
          classes = ('LOCK', 'SQLITE', 'PERMISSION', 'DISK_FULL', 'NETWORK', 'DNS',
                     'TLS', 'REMOTE_AUTH', 'THROTTLE', 'HASH', 'RESTORE', 'UNKNOWN')
          counts = dict.fromkeys(classes, 0)
          patterns = {
              'LOCK': r'PD backup already running|flock:.*(?:would block|resource temporarily unavailable)',
              'SQLITE': r'\bSQLITE_[A-Z_]+\b|sqlite3\.(?:OperationalError|DatabaseError)|database is locked|SQLite snapshot integrity failed',
              'PERMISSION': r'permission denied|read-only file system|PD backup staging/retention failed: \w+; code=(?:13|30)\b',
              'DISK_FULL': r'no space left on device|PD backup staging/retention failed: \w+; code=28\b',
              'NETWORK': r'connection (?:refused|reset|timed out)|i/o timeout|network is unreachable|no route to host',
              'DNS': r'no such host|temporary failure in name resolution|could not resolve host|name or service not known',
              'TLS': r'x509:|tls:.*(?:handshake|certificate)|certificate verify failed',
              'REMOTE_AUTH': r'\b(?:AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|InvalidToken|ExpiredToken)\b|HTTP (?:status code: |error )?(?:401|403)\b',
              'THROTTLE': r'\b(?:SlowDown|Throttling|TooManyRequests)\b|HTTP (?:status code: |error )?429\b',
              'HASH': r'(?:hash|checksum)(?:es)? (?:differ|mismatch)|corrupted on transfer:.*(?:hash|checksum)',
              'RESTORE': r'restore verification failed|bad decrypt|not in gzip format|unexpected (?:EOF in archive|end of file)',
          }

          def read_diagnostic(command, limit):
              try:
                  response = subprocess.run(command, stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=15,
                      env={**os.environ, 'LC_ALL': 'C', 'TZ': 'UTC', 'SYSTEMD_COLORS': '0'})
                  if response.returncode == 0 and len(response.stdout) <= limit:
                      return response.stdout.decode('utf-8', errors='replace')
              except (OSError, subprocess.SubprocessError):
                  pass
              return None

          def diagnostic_number(value, maximum):
              return int(value) if re.fullmatch(r'[0-9]{1,3}', value) and int(value) <= maximum else None

          def diagnostic_timestamp(value):
              if not re.fullmatch(r'[A-Za-z]{3} \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} UTC', value):
                  return None
              try:
                  return datetime.datetime.strptime(value, '%a %Y-%m-%d %H:%M:%S UTC').replace(tzinfo=datetime.timezone.utc).isoformat()
              except ValueError:
                  return None

          properties = ('Result', 'ExecMainCode', 'ExecMainStatus', 'ExecMainStartTimestamp',
                        'ExecMainExitTimestamp', 'InvocationID')
          raw = read_diagnostic(['systemctl', 'show', unit, '--no-pager',
                                 '--property=' + ','.join(properties)], 8192)
          values = dict(line.split('=', 1) for line in (raw or '').splitlines() if '=' in line)
          results = ('success', 'exit-code', 'signal', 'core-dump', 'watchdog', 'timeout',
                     'resources', 'protocol', 'start-limit-hit', 'oom-kill', 'exec-condition')
          service_result = values.get('Result') if values.get('Result') in results else 'unknown'
          invocation = values.get('InvocationID', '')
          journal_status = 'unscoped'
          if re.fullmatch(r'[0-9a-f]{32}', invocation) and invocation != '0' * 32:
              # Without --all, journalctl JSON omits oversized (>4096-byte) MESSAGE values.
              journal = read_diagnostic(['journalctl', '_SYSTEMD_UNIT=' + unit,
                  '_SYSTEMD_INVOCATION_ID=' + invocation, '-n', '200', '--no-pager',
                  '--quiet', '--output=json', '--output-fields=MESSAGE'], 1048576)
              journal_status = 'unavailable' if journal is None else 'ok'
              if journal is not None:
                  lines = journal.splitlines()
                  journal_status = 'truncated' if len(lines) >= 200 else ('ok' if lines else 'empty')
                  for line in lines[:200]:
                      try:
                          entry = json.loads(line)
                          message = entry.get('MESSAGE') if isinstance(entry, dict) else None
                      except (ValueError, TypeError, RecursionError):
                          message = None
                      if not isinstance(message, str) or len(message) > 4096:
                          counts['UNKNOWN'] += 1
                          continue
                      matches = [name for name, pattern in patterns.items() if re.search(pattern, message, re.IGNORECASE)]
                      for name in matches:
                          counts[name] += 1
                      if not matches and re.search(r'\b(?:error|failed|fatal)\b', message, re.IGNORECASE):
                          counts['UNKNOWN'] += 1
          # UNKNOWN is also an insufficient-evidence marker, not a guessed error cause.
          if not any(counts.values()) and (service_result != 'success' or journal_status not in ('ok', 'empty')):
              counts['UNKNOWN'] = 1
          print('OFFSITE_DIAGNOSTIC=' + json.dumps({
              'result': service_result,
              'exec_main_code': diagnostic_number(values.get('ExecMainCode', ''), 6),
              'exec_main_status': diagnostic_number(values.get('ExecMainStatus', ''), 255),
              'started_at': diagnostic_timestamp(values.get('ExecMainStartTimestamp', '')),
              'exited_at': diagnostic_timestamp(values.get('ExecMainExitTimestamp', '')),
              'journal_status': journal_status,
              'error_counts': counts,
          }))
          # Retention exit facts only: do not read its journal or run the check.
          retention_raw = read_diagnostic(['systemctl', 'show', 'steelprodukt-pd-retention-check.service',
              '--no-pager', '--property=' + ','.join(properties[:-1])], 8192)
          retention = dict(line.split('=', 1) for line in (retention_raw or '').splitlines() if '=' in line)
          print('RETENTION_SERVICE=' + json.dumps({
              'result': retention.get('Result') if retention.get('Result') in results else 'unknown',
              'exec_main_code': diagnostic_number(retention.get('ExecMainCode', ''), 6),
              'exec_main_status': diagnostic_number(retention.get('ExecMainStatus', ''), 255),
              'started_at': diagnostic_timestamp(retention.get('ExecMainStartTimestamp', '')),
              'exited_at': diagnostic_timestamp(retention.get('ExecMainExitTimestamp', '')),
          }))
          # END OFFSITE DIAGNOSTIC
          PYTHON
          REMOTE
