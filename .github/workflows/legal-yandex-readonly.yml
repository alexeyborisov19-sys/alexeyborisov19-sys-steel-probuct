name: Public SEO crawl
on:
  push:
    branches: [audit/legal-yandex-20261004]
    paths: [.github/workflows/legal-yandex-readonly.yml]
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawl public pages and legacy URLs
        env:
          SEO_AUDIT_BASE_URL: https://www.steelprodukt.ru
        run: npm run seo:audit
