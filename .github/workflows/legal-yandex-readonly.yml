name: Legal integrity and Yandex evidence
on:
  push:
    branches: [audit/legal-yandex-20261004]
    paths: [.github/workflows/legal-yandex-readonly.yml]
permissions:
  contents: read
jobs:
  yandex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - name: Read Yandex evidence
        env:
          YM_TOKEN: ${{ secrets.YANDEX_METRIKA_OAUTH_TOKEN }}
          YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
          YW_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
        run: python3 scripts/legal-yandex-readonly.py
