name: Yandex excluded pages follow-up
on:
  push:
    branches: [audit/legal-yandex-20261004]
    paths: [.github/workflows/legal-yandex-readonly.yml]
permissions:
  contents: read
jobs:
  yandex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - name: Read indexing and commercial queries
        env:
          YD_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
        run: python3 scripts/yandex-followup.py
