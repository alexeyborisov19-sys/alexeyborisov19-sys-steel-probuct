name: Full published browser recheck
on:
  push:
    branches: [audit/legal-yandex-20261004]
    paths: [.github/workflows/legal-yandex-readonly.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 342c62abcad9cb6876c1664ced7f7eb17ea17a7f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full mobile and desktop audit with intercepted submissions
        env:
          BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
        run: node scripts/audit-browser.mjs
