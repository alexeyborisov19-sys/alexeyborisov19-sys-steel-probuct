name: Verify published service navigation
on:
  push:
    branches: [audit/legal-yandex-20261004]
    paths: [.github/workflows/legal-yandex-readonly.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 342c62abcad9cb6876c1664ced7f7eb17ea17a7f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for published guide section
        run: |
          python3 - <<'PY'
          import urllib.request,time
          for attempt in range(90):
              try:
                  html=urllib.request.urlopen('https://www.steelprodukt.ru/production/gibka-listovogo-metalla',timeout=20).read().decode()
                  if 'aria-labelledby="service-guides"' in html:
                      print('Published service guides found')
                      break
              except Exception as e:
                  print(type(e).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Expected release not found')
          PY
      - name: Browser check against production without submissions
        env:
          BROWSER_AUDIT_BASE_URL: https://www.steelprodukt.ru
        run: node scripts/audit-service-navigation.mjs
      - name: Crawl production
        env:
          SEO_AUDIT_BASE_URL: https://www.steelprodukt.ru
        run: npm run seo:audit
