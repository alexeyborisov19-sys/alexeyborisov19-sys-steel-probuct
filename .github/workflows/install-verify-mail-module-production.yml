name: Verify production read-only mail module

on:
  push:
    paths:
      - '.github/workflows/install-verify-mail-module-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Verify deployed read-only mail worker and admin gate
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"

          test -f scripts/mail-readonly.py
          test -f lib/mail/read-only.ts
          test -f 'app/(internal)/internal/personal-data/mail/page.tsx'
          test -f 'app/(internal)/internal/personal-data/mail/[uid]/page.tsx'

          STATUS_JSON="$(python3 scripts/mail-readonly.py --env-file .env.production status)"
          printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("readOnly") is True; assert isinstance(d.get("messages"), int); print("MAIL_WORKER_STATUS=success"); print("MAILBOX_MESSAGES=" + str(d["messages"]))'

          if grep -q '^PD_ADMIN_ENABLED=true$' .env.production; then
            echo "PD_ADMIN_ENABLED=true"
          else
            echo "PD_ADMIN_ENABLED=false"
          fi

          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: www.steelprodukt.ru' -H 'X-Forwarded-Host: www.steelprodukt.ru' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/internal/personal-data/mail)"
          echo "MAIL_ROUTE_HTTP=$CODE"
          case "$CODE" in
            302|307|308|401|403) echo "MAIL_ROUTE_GATE=protected" ;;
            404) echo "MAIL_ROUTE_GATE=disabled" ;;
            *) echo "Unexpected mail route status: $CODE"; exit 1 ;;
          esac
          REMOTE
