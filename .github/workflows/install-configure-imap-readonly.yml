name: Configure read-only IMAP

on:
  push:
    paths:
      - '.github/workflows/install-configure-imap-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Configure read-only IMAP settings
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"
          grep -q '^SMTP_PASSWORD=.' "$ENV_FILE"

          ENV_TMP="$(mktemp "$APP_PATH/.env.production.XXXXXX")"
          trap 'rm -f "$ENV_TMP"' EXIT
          grep -v -E '^(IMAP_HOST|IMAP_PORT|IMAP_SECURE|IMAP_USER|IMAP_READ_ONLY)=' "$ENV_FILE" > "$ENV_TMP" || true
          {
            printf '%s\n' 'IMAP_HOST=imap.mail.ru'
            printf '%s\n' 'IMAP_PORT=993'
            printf '%s\n' 'IMAP_SECURE=true'
            printf '%s\n' 'IMAP_USER=info@steelprodukt.ru'
            printf '%s\n' 'IMAP_READ_ONLY=true'
          } >> "$ENV_TMP"
          chown nodejs:nodejs "$ENV_TMP"
          chmod 0600 "$ENV_TMP"
          mv "$ENV_TMP" "$ENV_FILE"
          trap - EXIT
          echo "Read-only IMAP settings stored."
          REMOTE
