name: Check production SMTP

on:
  push:
    paths:
      - '.github/workflows/install-check-production-smtp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Verify production mail configuration without printing secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          test -f "$ENV_FILE"

          has_value() {
            grep -q "^$1=." "$ENV_FILE"
          }

          for key in SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASSWORD SMTP_FROM SMTP_ENVELOPE_FROM QUOTE_RECIPIENT; do
            if has_value "$key"; then
              echo "$key=present"
            else
              echo "$key=missing"
            fi
          done

          cd "$APP_PATH"
          node --env-file="$ENV_FILE" --input-type=module <<'NODE'
          import nodemailer from "nodemailer";
          const required = [
            "SMTP_HOST","SMTP_PORT","SMTP_SECURE","SMTP_USER","SMTP_PASSWORD",
            "SMTP_FROM","SMTP_ENVELOPE_FROM","QUOTE_RECIPIENT"
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }
          console.log("SMTP_HOST_MATCH=" + String(process.env.SMTP_HOST === "smtp.mail.ru"));
          console.log("SMTP_PORT_MATCH=" + String(process.env.SMTP_PORT === "465"));
          console.log("SMTP_SECURE_MATCH=" + String(process.env.SMTP_SECURE === "true"));
          console.log("SMTP_USER_MATCH=" + String(process.env.SMTP_USER === "info@steelprodukt.ru"));
          console.log("SMTP_FROM_MATCH=" + String(process.env.SMTP_FROM === "info@steelprodukt.ru"));
          console.log("SMTP_ENVELOPE_FROM_MATCH=" + String(process.env.SMTP_ENVELOPE_FROM === "info@steelprodukt.ru"));
          console.log("QUOTE_RECIPIENT_MATCH=" + String(process.env.QUOTE_RECIPIENT === "info@steelprodukt.ru"));
          const transporter = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port: Number(process.env.SMTP_PORT),
            secure: process.env.SMTP_SECURE === "true",
            connectionTimeout: 10000,
            greetingTimeout: 10000,
            socketTimeout: 20000,
            auth: {
              user: process.env.SMTP_USER,
              pass: process.env.SMTP_PASSWORD,
            },
          });
          await transporter.verify();
          console.log("PRODUCTION_SMTP_AUTH=success");
          NODE
          REMOTE
