name: Temporary packaged calculation API smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temp-packaged-calculation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packaged-calculation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
      NEXT_PUBLIC_YM_COUNTER_ID: "112542227"
      NEXT_PUBLIC_YM_WEBVISOR: "true"
      STEEL_PRODUCT_METAL_MULTIPLIER: "1.2"
      STEEL_PRODUCT_DRAW_PCT: "10"
      STEEL_PRODUCT_FINAL_PCT: "20"
      STEEL_PRODUCT_FIXED_ADD_RUB: "0"
      STEEL_PRODUCT_FIXED_ADD_ENABLED: "false"
      STEEL_PRODUCT_ROUND_STEP_RUB: "10"
      CLAMAV_ENABLED: "false"
      TRUST_NGINX_PROXY: "false"
      IP_HASH_SALT: "synthetic-ci-only-calculation-smoke-salt"
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production Next.js bundle
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run real calculation API against packaged server
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          BASIS="$RUNNER_TEMP/calculation-basis.json"
          REPORT_ROOT="$RUNNER_TEMP/reports"
          QUARANTINE="$RUNNER_TEMP/quarantine"
          mkdir -p "$REPORT_ROOT" "$QUARANTINE"

          cat > "$BASIS" <<'JSON'
          {
            "version": "ci-synthetic-v1",
            "rateBook": {
              "laserRubPerM": [
                {
                  "materialId": "zinc",
                  "thicknessMm": 1,
                  "rateRub": 100,
                  "pierceRubEach": 5,
                  "source": {
                    "id": "ci-synthetic",
                    "label": "CI synthetic rate",
                    "confirmedAt": "2026-09-15T00:00:00.000Z",
                    "note": "Synthetic test data only"
                  }
                }
              ],
              "bendRubEach": null,
              "weldRubPerM": null,
              "powderRubPerM2": null,
              "assemblyRubPerHour": null,
              "surfacePreparationRubPerM2": null,
              "packagingRubEach": null
            },
            "materialPriceSnapshots": [
              {
                "sourceId": "ci-synthetic",
                "fetchedAt": "2026-09-15T00:00:00.000Z",
                "sourceDate": "2026-09-15T00:00:00.000Z",
                "status": "ok",
                "rows": [
                  {
                    "materialId": "zinc",
                    "thicknessMm": 1,
                    "rubPerTon": 100000,
                    "source": "CI synthetic material price",
                    "sourceDate": "2026-09-15T00:00:00.000Z",
                    "fetchedAt": "2026-09-15T00:00:00.000Z",
                    "size": "1x1000x2000",
                    "exactThickness": true
                  }
                ]
              }
            ]
          }
          JSON
          chmod 600 "$BASIS"

          export STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH="$BASIS"
          export STEEL_PRODUCT_PRIVATE_PRODUCTION_REPORT_ROOT="$REPORT_ROOT"
          export UPLOAD_QUARANTINE_PATH="$QUARANTINE"

          npm run start -- -H 127.0.0.1 -p 3012 > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3012/robots.txt >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 1
          done
          test "$READY" = "1"

          cat > "$RUNNER_TEMP/smoke.dxf" <<'DXF'
          0
          SECTION
          2
          HEADER
          9
          $INSUNITS
          70
          4
          0
          ENDSEC
          0
          SECTION
          2
          ENTITIES
          0
          LWPOLYLINE
          8
          0
          90
          4
          70
          1
          10
          0
          20
          0
          10
          100
          20
          0
          10
          100
          20
          100
          10
          0
          20
          100
          0
          ENDSEC
          0
          EOF
          DXF
          cat > "$RUNNER_TEMP/manifest.json" <<'JSON'
          {"title":"Packaged calculation smoke","parts":[{"clientPartId":"smoke-part","fileIndex":0,"materialId":"zinc","thicknessMm":1,"quantity":2,"operations":[]}]}
          JSON

          HTTP_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
            -F "manifest=<$RUNNER_TEMP/manifest.json" \
            -F "files=@$RUNNER_TEMP/smoke.dxf;type=application/dxf" \
            http://127.0.0.1:3012/api/online-order/calculate)"
          echo "PACKAGED_CALCULATION_HTTP=$HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            sed -n '1,240p' "$RUNNER_TEMP/server.log"
          fi

          python3 - <<'PY'
          import json, os
          response_path=os.path.join(os.environ['RUNNER_TEMP'],'response.json')
          with open(response_path, encoding='utf-8') as f:
              data=json.load(f)
          parts=((data.get('calculation') or {}).get('parts') or [])
          if not data.get('ok') or len(parts) != 1:
              raise SystemExit('Packaged calculation API did not return one successful part')
          part=parts[0]
          price=part.get('price') or {}
          if part.get('status') != 'ready':
              raise SystemExit(f"Unexpected part status: {part.get('status')}")
          if price.get('status') != 'approved' or not isinstance(price.get('totalRub'), (int,float)) or price['totalRub'] <= 0:
              raise SystemExit('Approved positive total was not returned')
          raw=json.dumps(data, ensure_ascii=False).lower()
          forbidden=['raterub','rubperton','directcost','internalsubtotal','supplier','cutlength','piercecount','masskg','waste','blankarea','reportid','basisversion']
          leaked=[token for token in forbidden if token in raw]
          if leaked:
              raise SystemExit('Confidential fields leaked: '+','.join(leaked))
          print(json.dumps({'ok':True,'status':part.get('status'),'priceStatus':price.get('status'),'positiveApprovedPrice':True}))
          PY
          test "$HTTP_CODE" = "200"
          test "$(find "$REPORT_ROOT" -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 1
