name: Temporary private calculation diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temp-private-calculation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Configure Beget access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Read deployed calculation build identity
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          BUILD_COMMIT="$(cat .next/BUILD_COMMIT 2>/dev/null || true)"
          if [ -n "$BUILD_COMMIT" ]; then
            echo "PRODUCTION_BUILD_COMMIT=$BUILD_COMMIT"
          else
            echo "PRODUCTION_BUILD_COMMIT=MISSING"
          fi
          if grep -q 'BASIS_START' lib/server/instant-quote/run-confidential-calculation.ts 2>/dev/null; then
            echo "SOURCE_STAGE_TRACE=PRESENT"
          else
            echo "SOURCE_STAGE_TRACE=ABSENT"
          fi
          if grep -Rqs 'BASIS_START' .next/server 2>/dev/null; then
            echo "BUNDLE_STAGE_TRACE=PRESENT"
          else
            echo "BUNDLE_STAGE_TRACE=ABSENT"
          fi
          REMOTE

      - name: Submit live DXF smoke without exposing internals
        run: |
          set -euo pipefail
          cat > /tmp/smoke.dxf <<'DXF'
          0
          SECTION
          2
          HEADER
          0
          ENDSEC
          0
          SECTION
          2
          ENTITIES
          0
          LWPOLYLINE
          8
          0
          90
          4
          70
          1
          10
          0
          20
          0
          10
          100
          20
          0
          10
          100
          20
          100
          10
          0
          20
          100
          0
          ENDSEC
          0
          EOF
          DXF
          cat > /tmp/manifest.json <<'JSON'
          {"title":"Production calculation smoke","parts":[{"clientPartId":"smoke-part","fileIndex":0,"materialId":"zinc","thicknessMm":1,"quantity":1,"operations":[]}]}
          JSON
          HTTP_CODE="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            -H 'Origin: https://www.steelprodukt.ru' \
            -H 'Referer: https://www.steelprodukt.ru/online-order' \
            -F 'manifest=</tmp/manifest.json' \
            -F 'files=@/tmp/smoke.dxf;type=application/dxf' \
            https://www.steelprodukt.ru/api/online-order/calculate)"
          echo "HTTP=$HTTP_CODE"
          python3 - <<'PY'
          import json
          with open('/tmp/response.json', encoding='utf-8') as f:
              data=json.load(f)
          safe={"ok":data.get("ok"),"code":data.get("code")}
          calc=data.get("calculation") or {}
          parts=calc.get("parts") or []
          if parts:
              safe["status"]=parts[0].get("status")
              price=parts[0].get("price") or {}
              safe["priceStatus"]=price.get("status")
              safe["positiveApprovedPrice"]=isinstance(price.get("totalRub"),(int,float)) and price.get("totalRub",0)>0
          print(json.dumps(safe,ensure_ascii=False))
          forbidden={'rateRub','confirmedDirectCostRubEach','confirmedDirectCostRubBatch','supplier','materialPrice','basisVersion','internalReport','pierceCount','cutLengthMm'}
          raw=json.dumps(data,ensure_ascii=False)
          leaked=[key for key in forbidden if key in raw]
          if leaked:
              raise SystemExit('Confidential fields leaked: '+','.join(leaked))
          PY
          echo "LIVE_SMOKE_COMPLETED=true"
