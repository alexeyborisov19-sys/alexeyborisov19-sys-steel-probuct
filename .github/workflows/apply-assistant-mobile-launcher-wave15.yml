name: Apply assistant mobile launcher wave 15

on:
  push:
    branches:
      - fix/assistant-mobile-launcher-wave15

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[wave15-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/assistant-mobile-launcher-wave15
          sparse-checkout: |
            /*
            !/.agents/
            !/.codex/
            !/.claude/
            !/.claude-flow/
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow mobile launcher fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/EngineeringAssistant.tsx')
          source = path.read_text()
          old_button = 'className="assistant-launcher group flex h-[58px] items-center gap-3 border border-steel-orange/65 bg-[#111519] pl-3 pr-4 shadow-[0_14px_50px_rgba(0,0,0,.58),0_0_26px_rgba(234,91,12,.16)]"'
          new_button = 'className="assistant-launcher group flex h-[58px] items-center gap-0 border border-steel-orange/65 bg-[#111519] px-1.5 shadow-[0_14px_50px_rgba(0,0,0,.58),0_0_26px_rgba(234,91,12,.16)] sm:gap-3 sm:pl-3 sm:pr-4"'
          old_label = '<span className="min-w-[142px] whitespace-nowrap text-left">'
          new_label = '<span className="hidden min-w-[142px] whitespace-nowrap text-left sm:block">'
          if source.count(old_button) != 1:
              raise SystemExit(f'expected one loaded launcher button match, found {source.count(old_button)}')
          if source.count(old_label) != 1:
              raise SystemExit(f'expected one loaded launcher label match, found {source.count(old_label)}')
          source = source.replace(old_button, new_button).replace(old_label, new_label)
          path.write_text(source)

          test = Path('tests/assistant-launcher-consistency.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst lazyLauncherPath = new URL("../components/EngineeringAssistantLauncher.tsx", import.meta.url);\nconst loadedAssistantPath = new URL("../components/EngineeringAssistant.tsx", import.meta.url);\n\ntest("assistant launcher stays compact on mobile before and after first activation", async () => {\n  const [lazyLauncher, loadedAssistant] = await Promise.all([\n    readFile(lazyLauncherPath, "utf8"),\n    readFile(loadedAssistantPath, "utf8"),\n  ]);\n\n  const compactButton = /assistant-launcher[^\\n]*gap-0[^\\n]*px-1\\.5[^\\n]*sm:gap-3[^\\n]*sm:pl-3[^\\n]*sm:pr-4/;\n  const hiddenMobileLabel = /hidden min-w-\\[142px\\] whitespace-nowrap text-left sm:block/;\n\n  assert.match(lazyLauncher, compactButton, "initial launcher must stay compact on mobile");\n  assert.match(lazyLauncher, hiddenMobileLabel, "initial launcher label must remain hidden below sm");\n  assert.match(loadedAssistant, compactButton, "loaded launcher must keep the same compact mobile shell after closing");\n  assert.match(loadedAssistant, hiddenMobileLabel, "loaded launcher label must remain hidden below sm after closing");\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/EngineeringAssistant.tsx tests/assistant-launcher-consistency.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep assistant launcher compact after activation [wave15-applied]"
          git push origin HEAD:fix/assistant-mobile-launcher-wave15
