name: Audit stale Beget files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-beget-stale-file-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Wait for production deployment lock
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" \
            "exec 9>/tmp/steelprodukt-production-deploy.lock; flock -w 900 9; echo 'Production deploy lock is free.'"

      - name: Dry-run production synchronization
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          output="$(rsync -azn --delete-delay --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.claude/' \
            --exclude='.claude-flow/' \
            --exclude='.mcp.json' \
            --exclude='AGENTS.md' \
            --exclude='.data/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --include='.env.example' \
            --exclude='.env*' \
            --exclude='public/video/company-film-flat.mp4' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p $BEGET_SSH_PORT" \
            ./ "$BEGET_USER@$BEGET_HOST:$BEGET_APP_PATH/")"

          stale="$(printf '%s\n' "$output" | grep '^\*deleting' || true)"
          if [ -z "$stale" ]; then
            echo 'STALE_MANAGED_FILES=0'
          else
            echo 'STALE_MANAGED_FILES_FOUND'
            printf '%s\n' "$stale"
          fi

      - name: Check obsolete excluded development artifacts
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          found=0
          for rel in .git .github .agents .codex .claude .claude-flow .mcp.json AGENTS.md; do
            if [ -e "$APP_PATH/$rel" ]; then
              echo "OBSOLETE_DEV_ARTIFACT=$rel"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo 'OBSOLETE_DEV_ARTIFACTS=0'
          fi
          # Do not inspect or print .env*, protected .data, node_modules or .next contents.
          REMOTE
