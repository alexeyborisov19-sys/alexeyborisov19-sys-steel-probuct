name: Configure private calculation basis path

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-private-basis-path.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure server access
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$BEGET_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BEGET_SSH_PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Configure server-only basis path
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          BEGET_APP_PATH: ${{ secrets.BEGET_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$BEGET_SSH_PORT" \
            "$BEGET_USER@$BEGET_HOST" "APP_PATH='$BEGET_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE="$APP_PATH/.env.production"
          KEY=STEEL_PRODUCT_PRIVATE_CALCULATION_BASIS_PATH
          VALUE=/var/lib/steelprodukt/private-basis/basis.json
          touch "$ENV_FILE"
          if grep -q "^${KEY}=" "$ENV_FILE"; then
            sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$ENV_FILE"
          else
            printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
          fi
          chmod 600 "$ENV_FILE"
          install -m 700 -d /var/lib/steelprodukt/private-basis
          echo 'Private calculation basis path configured.'
          REMOTE
