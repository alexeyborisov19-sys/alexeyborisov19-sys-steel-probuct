name: Import Laser67 product photos

on:
  push:
    branches:
      - feature/laser67-product-photos-20260920
    paths:
      - '.github/workflows/import-laser67-product-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/laser67-product-photos-20260920

      - name: Download full product image files
        run: |
          set -euo pipefail
          ROOT="public/images/real-products/laser67"
          mkdir -p "$ROOT/metallokassety" "$ROOT/korpusa" "$ROOT/zakladnye"

          fetch_image() {
            id="$1"
            target="$2"
            tmp="$(mktemp)"
            url="https://s2.siteapi.org/0a72641009ad46e/img/$id"
            curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$url" -o "$tmp"
            mime="$(file -b --mime-type "$tmp")"
            case "$mime" in
              image/jpeg) ext=jpg ;;
              image/png) ext=png ;;
              image/webp) ext=webp ;;
              *) echo "Unsupported MIME $mime for $id" >&2; exit 1 ;;
            esac
            mv "$tmp" "$target.$ext"
            bytes="$(wc -c < "$target.$ext")"
            info="$(file -b "$target.$ext")"
            echo "IMPORTED=$target.$ext BYTES=$bytes INFO=$info"
          }

          fetch_image kc6b1cgbvs0go40gc0ckkoo8sks8ko "$ROOT/metallokassety/open-type"
          fetch_image gi5xt7nywn40owos8ko8ccwogggw0c "$ROOT/metallokassety/closed-type"
          fetch_image 1oi49d9001msgcoko0000sswgksgos "$ROOT/metallokassety/hook-on-panel"

          fetch_image be93pej3rdskw4g8g4wsswgck0go4w "$ROOT/korpusa/electrical-cabinet-enclosures"
          fetch_image sm033b3w4004c0c4okkso08csscscg "$ROOT/korpusa/power-supply-enclosure"
          fetch_image 3nol1s4nt8844wok08s00kw0k80cck "$ROOT/korpusa/power-supply-enclosure-ral"
          fetch_image g5esyuhnpz40k0gow8ows8oc0c4s08 "$ROOT/korpusa/aggregate-cabinet-enclosure"
          fetch_image hlhi3b4zu884kcos8wcgkk4soo8ckw "$ROOT/korpusa/industrial-equipment-cover-1"
          fetch_image 1x2nh8e7bl34sgks840048owkcw0ks "$ROOT/korpusa/industrial-equipment-cover-2"
          fetch_image gdj20a7tupcscwkws04s4g4s8oco0s "$ROOT/korpusa/electrical-equipment-enclosure"

          fetch_image 9lnfb3c57osowg44ok8o8k84ow8k0o "$ROOT/zakladnye/support-shoe"
          fetch_image a72zsls4knk808kg8s0g804gss400g "$ROOT/zakladnye/column-heads"
          fetch_image 8i1khbwrvdgcksgw0w88g0k8og4wwc "$ROOT/zakladnye/structural-support"

      - name: Commit imported image binaries
        run: |
          set -euo pipefail
          git config user.name "steelprodukt-bot"
          git config user.email "steelprodukt-bot@users.noreply.github.com"
          git add public/images/real-products/laser67
          git commit -m "Import Laser67 product photos as local assets"
          git push origin HEAD:feature/laser67-product-photos-20260920
