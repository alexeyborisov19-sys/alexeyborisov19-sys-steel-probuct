name: Apply customer material language wave14

on:
  push:
    branches:
      - fix/customer-material-language-wave14

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          ref: fix/customer-material-language-wave14
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/.agents/
            !/.codex/
            !/.claude/
            !/.claude-flow/
          sparse-checkout-cone-mode: false
      - name: Apply client-facing material language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            Path('app/(public)/production/page.tsx'): [
              ('question: "Работаете с давальческим сырьём?"', 'question: "Работаете с материалом заказчика?"'),
              ('Другие материалы и давальческое сырьё принимаем после проверки марки, состояния и выбранной операции.', 'С другими материалами и металлом заказчика работаем после проверки марки, состояния и выбранной операции.'),
            ],
            Path('data/assistant-knowledge.ts'): [
              ('Давальческий материал принимаем после входного контроля.', 'С металлом заказчика работаем после входного контроля.'),
            ],
            Path('tests/semantic-seo.test.ts'): [
              ('assert.match(customerMaterialSummary, /давальческий материал/);', 'assert.match(customerMaterialSummary, /металлом заказчика/);'),
              ('assert.match(steelProductAssistantSystemPrompt, /давальческий материал/);', 'assert.match(steelProductAssistantSystemPrompt, /металлом заказчика/);'),
            ],
          }

          for path, replacements in changes.items():
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              if old not in text:
                raise SystemExit(f'Expected source fragment not found in {path}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/production/page.tsx' data/assistant-knowledge.ts tests/semantic-seo.test.ts
          git commit -m "copy: use client-facing customer material language"
          git push origin HEAD:fix/customer-material-language-wave14
