name: Notify IndexNow after production deploy

on:
  workflow_run:
    workflows:
      - Publish to Beget
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelprodukt-indexnow
  cancel-in-progress: true

jobs:
  notify:
    name: Submit production URLs to IndexNow
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get deployed production source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live AI discovery and entity endpoints
        env:
          SITE_URL: https://www.steelprodukt.ru
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          expected_key="$(sed -n 's/.*indexNowKey = "\([^"]*\)".*/\1/p' lib/indexnow.ts | head -n 1)"
          test -n "$expected_key"

          fetch_live() {
            local path="$1"
            local output="$2"
            curl \
              --fail --silent --show-error --location --max-time 10 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$SITE_URL/$path?release=$DEPLOYED_SHA" \
              -o "$output"
          }

          for attempt in {1..12}; do
            if \
              fetch_live robots.txt "$tmpdir/robots.txt" && \
              fetch_live llms.txt "$tmpdir/llms.txt" && \
              fetch_live llms-full.txt "$tmpdir/llms-full.txt" && \
              fetch_live indexnow-key.txt "$tmpdir/indexnow-key.txt" && \
              fetch_live company/facts "$tmpdir/company-facts.html"
            then
              key="$(tr -d '\r\n' < "$tmpdir/indexnow-key.txt")"
              checks_ok=true

              grep -Fq 'User-agent: *' "$tmpdir/robots.txt" || checks_ok=false
              grep -Fq 'User-agent: OAI-SearchBot' "$tmpdir/robots.txt" || checks_ok=false
              grep -Fq 'User-agent: Google-Extended' "$tmpdir/robots.txt" || checks_ok=false
              grep -Fq 'User-agent: YandexBot' "$tmpdir/robots.txt" || checks_ok=false
              grep -Fq 'Disallow: /api/' "$tmpdir/robots.txt" || checks_ok=false
              grep -Fq '# Сталь Продукт' "$tmpdir/llms.txt" || checks_ok=false
              grep -Fq 'бренд/товарный знак, не юридическое лицо' "$tmpdir/llms.txt" || checks_ok=false
              grep -Fq '/company/facts' "$tmpdir/llms.txt" || checks_ok=false
              grep -Fq '## Производственные возможности' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq '## Независимая идентификация юридического оператора' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq 'РБК Компании' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq 'СПАРК-Интерфакс' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq '60 000 м²/год' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq 'Монтаж на объектах не выполняется.' "$tmpdir/llms-full.txt" || checks_ok=false
              grep -Fq 'Факты о производстве «Сталь Продукт»' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq 'бренд/товарный знак, не юридическое лицо' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq '60 000 м²/год' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq 'Монтаж на объектах не выполняется.' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq '"@type":"Brand"' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq '"@type":"AboutPage"' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq 'ООО «ЭНЕРГОАЛЬЯНС»' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq 'https://companies.rbc.ru/id/1156733014657-ooo-energoalyans/' "$tmpdir/company-facts.html" || checks_ok=false
              grep -Fq 'https://spark-interfax.ru/smolenskaya-oblast-smolensk/ooo-energoalyans-inn-6732110789-ogrn-1156733014657-f8eee79f78d749a3826a431c2b024d8f' "$tmpdir/company-facts.html" || checks_ok=false
              [[ "$key" == "$expected_key" ]] || checks_ok=false

              if [[ "$checks_ok" == true ]]; then
                echo "Live AI/entity endpoints verified for release $DEPLOYED_SHA: robots.txt, llms.txt, llms-full.txt, indexnow-key.txt, company/facts with external entity references."
                exit 0
              fi
            fi

            echo "Production AI/entity endpoints are not fully ready for release $DEPLOYED_SHA yet (attempt $attempt/12)."
            sleep 5
          done

          echo "Live AI/entity endpoint verification failed for release $DEPLOYED_SHA."
          echo "Diagnostic markers:"
          grep -F 'User-agent:' "$tmpdir/robots.txt" || true
          grep -F 'бренд/товарный знак' "$tmpdir/llms.txt" || true
          grep -F 'Независимая идентификация' "$tmpdir/llms-full.txt" || true
          grep -F 'Факты о производстве' "$tmpdir/company-facts.html" || true
          grep -F '"@type":"Brand"' "$tmpdir/company-facts.html" || true
          grep -F '"@type":"AboutPage"' "$tmpdir/company-facts.html" || true
          grep -F 'companies.rbc.ru' "$tmpdir/company-facts.html" || true
          grep -F 'spark-interfax.ru' "$tmpdir/company-facts.html" || true
          echo "Published key length: $(tr -d '\r\n' < "$tmpdir/indexnow-key.txt" | wc -c)"
          exit 1

      - name: Collect changed public URL paths
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/indexnow-paths.txt"
          : > "$paths_file"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            while IFS= read -r file; do
              case "$file" in
                "app/(public)/page.tsx")
                  printf '/\n' >> "$paths_file"
                  ;;
                app/\(public\)/*/page.tsx)
                  route="${file#app/(public)}"
                  route="${route%/page.tsx}"
                  if [[ "$route" != *"["* ]]; then
                    printf '%s\n' "$route" >> "$paths_file"
                  fi
                  ;;
                app/robots.txt/route.ts)
                  printf '/robots.txt\n' >> "$paths_file"
                  ;;
                app/llms.txt/route.ts)
                  printf '/llms.txt\n' >> "$paths_file"
                  ;;
                app/llms-full.txt/route.ts)
                  printf '/llms-full.txt\n' >> "$paths_file"
                  ;;
                app/sitemap.ts)
                  printf '/sitemap.xml\n' >> "$paths_file"
                  ;;
                data/articles.ts)
                  printf '/articles\n' >> "$paths_file"
                  ;;
                data/products.ts|data/commercial-product-landings.ts)
                  printf '/products\n' >> "$paths_file"
                  ;;
                data/production-services.ts|data/manufacturing-facts.ts)
                  printf '/production\n/company/facts\n/llms.txt\n/llms-full.txt\n' >> "$paths_file"
                  ;;
                data/entity-references.ts|lib/entity-schema.ts|lib/legal.ts)
                  printf '/\n/company\n/company/facts\n/llms-full.txt\n' >> "$paths_file"
                  ;;
                data/solution-details.ts|data/solution-seo.ts)
                  printf '/solutions\n' >> "$paths_file"
                  ;;
                data/real-projects.ts|data/real-project-showcase.ts)
                  printf '/projects\n' >> "$paths_file"
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi

          sort -u -o "$paths_file" "$paths_file"
          echo "Changed public URL paths:"
          cat "$paths_file" || true

      - name: Notify IndexNow about key and changed URLs
        env:
          NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < "$RUNNER_TEMP/indexnow-paths.txt"
          node scripts/submit-indexnow.mjs "${changed_paths[@]}"
