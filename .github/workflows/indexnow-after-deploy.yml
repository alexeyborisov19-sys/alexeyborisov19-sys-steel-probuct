name: Notify IndexNow after production deploy

on:
  workflow_run:
    workflows:
      - Publish to Beget
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelprodukt-indexnow
  cancel-in-progress: true

jobs:
  notify:
    name: Submit production URLs to IndexNow
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get deployed production source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live AI discovery endpoints
        env:
          SITE_URL: https://www.steelprodukt.ru
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          for attempt in {1..12}; do
            if \
              curl --fail --silent --show-error --location --max-time 10 "$SITE_URL/robots.txt" -o "$tmpdir/robots.txt" && \
              curl --fail --silent --show-error --location --max-time 10 "$SITE_URL/llms.txt" -o "$tmpdir/llms.txt" && \
              curl --fail --silent --show-error --location --max-time 10 "$SITE_URL/llms-full.txt" -o "$tmpdir/llms-full.txt" && \
              curl --fail --silent --show-error --location --max-time 10 "$SITE_URL/indexnow-key.txt" -o "$tmpdir/indexnow-key.txt"
            then
              key="$(tr -d '\r\n' < "$tmpdir/indexnow-key.txt")"
              if \
                grep -Fqx 'User-agent: *' "$tmpdir/robots.txt" && \
                grep -Fqx 'User-agent: OAI-SearchBot' "$tmpdir/robots.txt" && \
                grep -Fqx 'User-agent: Google-Extended' "$tmpdir/robots.txt" && \
                grep -Fqx 'User-agent: YandexBot' "$tmpdir/robots.txt" && \
                grep -Fqx 'Disallow: /api/' "$tmpdir/robots.txt" && \
                grep -Fq '«Сталь Продукт» — бренд/товарный знак, не юридическое лицо' "$tmpdir/llms.txt" && \
                grep -Fq 'Производственные возможности' "$tmpdir/llms-full.txt" && \
                grep -Fq 'Ориентировочный выпуск фасадных металлокассет — около 60 000 м²/год.' "$tmpdir/llms-full.txt" && \
                grep -Fq 'Монтаж на объектах не выполняется.' "$tmpdir/llms-full.txt" && \
                [[ "$key" =~ ^[A-Za-z0-9-]{8,128}$ ]]
              then
                echo "Live AI endpoints verified: robots.txt, llms.txt, llms-full.txt, indexnow-key.txt."
                exit 0
              fi
            fi

            echo "Production AI endpoints are not fully ready yet (attempt $attempt/12)."
            sleep 5
          done

          echo "Live AI endpoint verification failed."
          exit 1

      - name: Collect changed public URL paths
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/indexnow-paths.txt"
          : > "$paths_file"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            while IFS= read -r file; do
              case "$file" in
                "app/(public)/page.tsx")
                  printf '/\n' >> "$paths_file"
                  ;;
                app/\(public\)/*/page.tsx)
                  route="${file#app/(public)}"
                  route="${route%/page.tsx}"
                  if [[ "$route" != *"["* ]]; then
                    printf '%s\n' "$route" >> "$paths_file"
                  fi
                  ;;
                app/robots.txt/route.ts)
                  printf '/robots.txt\n' >> "$paths_file"
                  ;;
                app/llms.txt/route.ts)
                  printf '/llms.txt\n' >> "$paths_file"
                  ;;
                app/llms-full.txt/route.ts)
                  printf '/llms-full.txt\n' >> "$paths_file"
                  ;;
                app/sitemap.ts)
                  printf '/sitemap.xml\n' >> "$paths_file"
                  ;;
                data/articles.ts)
                  printf '/articles\n' >> "$paths_file"
                  ;;
                data/products.ts|data/commercial-product-landings.ts)
                  printf '/products\n' >> "$paths_file"
                  ;;
                data/production-services.ts|data/manufacturing-facts.ts)
                  printf '/production\n/llms.txt\n/llms-full.txt\n' >> "$paths_file"
                  ;;
                data/solution-details.ts|data/solution-seo.ts)
                  printf '/solutions\n' >> "$paths_file"
                  ;;
                data/real-projects.ts|data/real-project-showcase.ts)
                  printf '/projects\n' >> "$paths_file"
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi

          sort -u -o "$paths_file" "$paths_file"
          echo "Changed public URL paths:"
          cat "$paths_file" || true

      - name: Notify IndexNow about key and changed URLs
        env:
          NEXT_PUBLIC_SITE_URL: https://www.steelprodukt.ru
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < "$RUNNER_TEMP/indexnow-paths.txt"
          node scripts/submit-indexnow.mjs "${changed_paths[@]}"
