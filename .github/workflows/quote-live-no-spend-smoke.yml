name: Live no-spend quote smoke
on:
  push:
    branches: [ops/quote-local-readiness-20260921]
    paths: [.github/workflows/quote-live-no-spend-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published pages and deterministic quotations
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error
          root='https://www.steelprodukt.ru'
          report=[]
          def call(path, payload=None, origin=None):
              headers={'User-Agent':'SteelProdukt-release-smoke/1.0','Cache-Control':'no-cache'}
              if payload is not None:
                  headers.update({'Content-Type':'application/json','Origin':origin or root})
              request=urllib.request.Request(root+path,data=None if payload is None else json.dumps(payload).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      return response.status,response.read(2000000).decode('utf-8')
              except urllib.error.HTTPError as error:
                  return error.code,error.read(64000).decode('utf-8')
          for path in ['/','/calculator-metallokassety','/online-order','/api/health']:
              code,body=call(path+'?release_smoke='+str(int(time.time())))
              assert code==200,(path,code)
              if path=='/api/health': assert json.loads(body).get('ok') is True
              report.append({'check':'GET '+path,'http':code})
          payload={'mode':'area','type':'open','thickness':'1.2','areaM2':10,'pricePerM2':1}
          code,body=call('/api/calc-metallokassety',payload)
          data=json.loads(body)
          assert code==200,(code,body[:200])
          assert data['approximateTotalRub'] >= data['netAreaM2']*data['defaultRateRubM2']
          assert data['approximateRateRubM2'] >= data['defaultRateRubM2']
          assert data['marketVerified'] is False
          assert 'не является офертой' in data['disclaimer'].lower()
          report.append({'check':'cassette price floor','http':code,'areaM2':data['netAreaM2'],'totalRub':data['approximateTotalRub'],'marketVerified':False,'disclaimer':True})
          code,body=call('/api/calc-metallokassety',{**payload,'review':True})
          data=json.loads(body)
          assert code==200,(code,body[:200])
          assert data['reviewStatus']=='unavailable',(data.get('reviewStatus'),data.get('message'))
          assert data['marketVerified'] is False
          assert data['approximateTotalRub'] >= data['netAreaM2']*data['defaultRateRubM2']
          report.append({'check':'honest unavailable AI review','http':code,'reviewStatus':data['reviewStatus'],'marketVerified':data['marketVerified'],'message':data['message']})
          code,_=call('/api/calc-metallokassety',{**payload,'areaM2':-1})
          assert code==400,code
          report.append({'check':'negative area rejected','http':code})
          code,_=call('/api/calc-metallokassety',payload,'https://example.invalid')
          assert code==403,code
          report.append({'check':'cross-origin rejected','http':code})
          code,body=call('/api/assistant/quote',{'calculator':'metal-cassettes','message':'кассеты открытого типа 600×1200 мм'})
          data=json.loads(body)
          assert code==200 and data['kind']=='question',(code,body[:200])
          assert 'толщин' in data['text'].lower(),data['text']
          session=data['sessionId']
          code,body=call('/api/assistant/quote',{'calculator':'metal-cassettes','sessionId':session,'message':'1,2'})
          data=json.loads(body)
          assert code==200 and data['kind']=='question',(code,body[:200])
          code,body=call('/api/assistant/quote',{'calculator':'metal-cassettes','sessionId':session,'message':'10'})
          data=json.loads(body)
          assert code==200 and data['kind']=='priced',(code,body[:400])
          assert 'не является офертой' in data['text'].lower()
          assert 'не подтвержд' in data['text'].lower()
          assert 'record' not in data and 'state' not in data
          report.append({'check':'multi-turn cassette quotation','http':code,'kind':data['kind'],'text':data['text']})
          print(json.dumps({'passed':True,'checks':report,'leadSubmitted':False,'paidProviderInvoked':False},ensure_ascii=False,indent=2))
          PY
