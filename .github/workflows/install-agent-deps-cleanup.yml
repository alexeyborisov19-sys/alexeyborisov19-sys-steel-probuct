name: Remove agent runtimes from website dependencies

on:
  push:
    paths:
      - .github/workflows/install-agent-deps-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove Codex-only runtimes from website dependency graph
        run: npm uninstall --save-dev ruflo @playwright/mcp

      - name: Preserve pinned npx tooling scripts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts['codex:tools:setup'] = 'node scripts/setup-codex-tools.mjs';
          packageJson.scripts['ruflo:init'] = 'npx -y ruflo@3.38.19 init --yes';
          packageJson.scripts['ruflo:doctor'] = 'npx -y ruflo@3.38.19 doctor';
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit dependency cleanup
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: keep Codex runtimes out of production dependencies'
          git push
