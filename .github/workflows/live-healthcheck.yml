name: Live website healthcheck

on:
  push:
    branches:
      - ops/live-healthcheck

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Monitor public HTTPS during deployment
        run: |
          set -u
          failures=0
          consecutive=0
          max_consecutive=0
          checks=0
          echo '=== DNS ==='
          getent ahosts www.steelprodukt.ru || true
          echo '=== 3 MINUTE AVAILABILITY MONITOR ==='
          end=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$end" ]; do
            checks=$((checks + 1))
            code=$(curl -sS --max-time 4 -o /dev/null -w '%{http_code}' https://www.steelprodukt.ru/ || true)
            now=$(date -u +%H:%M:%S)
            if [ "$code" = "200" ]; then
              consecutive=0
              echo "$now check=$checks http=200"
            else
              failures=$((failures + 1))
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -gt "$max_consecutive" ]; then max_consecutive=$consecutive; fi
              echo "$now check=$checks http=${code:-curl_failed} FAILURE"
            fi
            sleep 2
          done
          echo "RESULT checks=$checks failures=$failures max_consecutive_failures=$max_consecutive"
          test "$failures" -eq 0
