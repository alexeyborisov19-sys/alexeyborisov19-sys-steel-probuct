title = "Сталь Продукт — проверка секретов"

[extend]
useDefault = true

[allowlist]
description = "Разрешены только заведомо публичные или тестовые значения"
regexTarget = "match"
regexes = [
  '''https://www\.steelprodukt\.ru''',
  '''127\.0\.0\.1''',
  # IndexNow requires this verification value to be publicly retrievable.
  '''9f6d7c0b8a2e4f1c5d3b7a9e6c4f2d1b''',
]
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
]
