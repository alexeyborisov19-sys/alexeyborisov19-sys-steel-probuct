server {
    listen 80;
    listen [::]:80;
    server_name steelprodukt.ru www.steelprodukt.ru;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steelprodukt.ru;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.steelprodukt.ru;

    client_max_body_size 30m;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /vnutri {
        return 301 https://www.steelprodukt.ru/production/lazernaya-rezka-metalla;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
