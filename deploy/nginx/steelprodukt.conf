server {
    listen 80;
    listen [::]:80;
    server_name steelprodukt.ru www.steelprodukt.ru;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steelprodukt.ru;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.steelprodukt.ru;

    # Matches the 11 MiB streaming body limit enforced by the Next.js route.
    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /vnutri {
        return 301 https://www.steelprodukt.ru/production/lazernaya-rezka-metalla;
    }

    # The application remains the authoritative internal-route gate.
    # PD_ADMIN_ENABLED=false returns 404 before any page or API handler runs.
    # Do not set PD_ADMIN_ENABLED=true until migrations, the first ADMIN and
    # the Stage 3 post-deploy security checks have been completed manually.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
