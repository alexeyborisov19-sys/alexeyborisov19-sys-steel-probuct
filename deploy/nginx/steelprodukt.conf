# Public pages are prerendered at build time, so nginx can answer crawlers and
# visitors from cache instead of waking the single Node process for every hit.
proxy_cache_path /var/cache/nginx/steelprodukt levels=1:2 keys_zone=steelprodukt:10m
                 max_size=256m inactive=60m use_temp_path=off;

# Sections that must never enter the shared cache: form endpoints, technical
# routes and the whole personal-data perimeter. Upstream already sends
# no-store there, and nginx skips Set-Cookie responses on its own; this map is
# the explicit second barrier so a header regression cannot leak a cached page.
map $request_uri $steelprodukt_skip_cache {
    default      0;
    ~^/api/      1;
    ~^/internal/ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name steelprodukt.ru www.steelprodukt.ru;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steelprodukt.ru;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.steelprodukt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.steelprodukt.ru;

    # Matches the 11 MiB streaming body limit enforced by the Next.js route.
    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/steelprodukt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steelprodukt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /vnutri {
        return 301 https://www.steelprodukt.ru/production/lazernaya-rezka-metalla;
    }

    # The application remains the authoritative internal-route gate.
    # PD_ADMIN_ENABLED=false returns 404 before any page or API handler runs.
    # Do not set PD_ADMIN_ENABLED=true until migrations, the first ADMIN and
    # the Stage 3 post-deploy security checks have been completed manually.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache steelprodukt;
        proxy_cache_methods GET HEAD;
        proxy_cache_key $scheme://$host$request_uri;
        # Only successful pages are cached. Redirects are cheap to recompute, and
        # while the site is still moving its main mirror a stale 301 pinned here
        # for ten minutes would be far more expensive than the hit it saves.
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $steelprodukt_skip_cache $http_authorization;
        proxy_no_cache $steelprodukt_skip_cache $http_authorization;
        # Keep answering from a stale copy while the app restarts or rebuilds,
        # so a pm2 reload no longer shows up as a slow or failed page.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
